:where([data-k]) #search::placeholder{color:var(--k43)}
:where([data-k]) select{background:var(--obsidian-3);border:1px solid var(--line);color:var(--k3)}
:where([data-k]) select:hover,:where([data-k]) select:focus{border-color:var(--gold-dim);outline:none}
:where([data-k]) .tool-btn{background:var(--obsidian-3);border:1px solid var(--line);color:var(--k4)}
:where([data-k]) .tool-btn:hover{border-color:var(--gold-dim);color:var(--k17);box-shadow:0 0 10px var(--k44)}
:where([data-k]) .tool-btn.accent{border-color:var(--gold-dim);color:var(--k18)}
:where([data-k]) #theme-chips{border-bottom:1px solid var(--line-faint)}
:where([data-k]) .chip{color:var(--k4);background:transparent;border:1px solid var(--line)}

/* ---- src/themes-extra.css ---- */
/* ============================================================
   ARCHIVUS — colourways, by hand. Appended verbatim to the generated src/themes.css
   by tools/build-themes.js. Two kinds of thing live here and nothing else:
     1. the colourway switch itself — its swatches show the three pages as they are,
        so they must NOT pass through the rule;
     2. the few places where the rule needs help, each with its reason.
   ============================================================ */
#tone { flex: 0 0 auto; align-self: center; display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 0 8px; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--obsidian-3); }
#tone button { width: 14px; height: 14px; border-radius: 50%; padding: 0; cursor: pointer; border: 1px solid #868b98; transition: transform .15s; }
#tone button:hover { transform: scale(1.18); }
#tone button[data-tone="blue"] { background: linear-gradient(135deg, #1d2f57 50%, #0a0c12 50%); }
#tone button[data-tone="black"] { background: #000; }
#tone button[data-tone="white"] { background: #fff; }
#tone button.on { box-shadow: 0 0 0 2px var(--obsidian-3), 0 0 0 3.5px var(--gold); }
#tone button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
/* a narrow header shows only the current swatch; pressing it steps to the next colourway */
@media (max-width: 1700px) {
  #tone { gap: 0; padding: 0 7px; margin: 0 8px 0 6px; } #tone button:not(.on) { display: none; }
  /* alone, a black disc on black or a white one on white says nothing: the lone button shows all three, and a gold rim */
  #tone button.on { background: conic-gradient(from -60deg, #1d2f57 0 33.4%, #fff 0 66.7%, #000 0); border-color: var(--gold); box-shadow: none; width: 15px; height: 15px; }
}
@media (max-width: 935px) { #tone { border: 0; background: none; padding: 0 4px; margin: 0 4px 0 0; } }

/* ---------- exceptions: where the general rule is not enough ---------- */
/* on white an accent is already deepened to hold 4.5:1; fading it again would undo that */
html[data-theme="white"] .as-blood text,
html[data-theme="white"] .pn-plate-title { opacity: 1; }

</style><!-- generated: the three colourways (tools/build-themes.js) -->

    let bar = sec.querySelector(":scope > .pg-bar");
    if (heads.length < 2) { if (bar) bar.remove(); kids.forEach(k => k.classList.remove("pg-off")); st.obs && st.obs.takeRecords(); return; }
    let g = 0, seen = false; kids.forEach(k => { if (pgIsBreak(k)) { if (seen) g++; seen = true; } k._pg = g; });
    if (st.page !== "all" && !(st.page <= g)) st.page = 0;
    kids.forEach(k => k.classList.toggle("pg-off", st.page !== "all" && k._pg !== st.page));
    if (!bar) { bar = document.createElement("div"); bar.className = "pg-bar"; bar.setAttribute("role", "tablist"); sec.insertBefore(bar, sec.firstChild); }
    bar.innerHTML = heads.map((h, i) => '<button type="button" class="chipbtn' + (i === st.page ? " on" : "") + '" data-pg="' + i + '">' + pgLabel(h).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</button>").join("") +
      '<button type="button" class="chipbtn pg-all' + (st.page === "all" ? " on" : "") + '" data-pg="all" title="Every section on one long page">All</button>';
    PG.set(sec, st);
    st.obs && st.obs.takeRecords();                          /* our own edits are not a re-render */
  }
  function paginate() {
    document.querySelectorAll(".wr-scroll").forEach(sec => {
      if (PG.has(sec)) return;
      const st = { page: pgAll() ? "all" : 0 }; PG.set(sec, st);
      sec.addEventListener("click", e => {
        const b = e.target.closest(".pg-bar [data-pg]"); if (!b) return;
        st.page = b.dataset.pg === "all" ? "all" : +b.dataset.pg;
        try { if (st.page === "all") localStorage.setItem("archivus-pager", "all"); else localStorage.removeItem("archivus-pager"); } catch (_) {}   /* "All" is remembered as a preference */
        pgCut(sec); sec.scrollTop = 0;
      });
      st.obs = new MutationObserver(ms => { if (ms.some(m => m.target === sec || (m.target.classList && m.target.classList.contains("dc-doc") && m.target.parentNode === sec))) pgCut(sec); });
      st.obs.observe(sec, { childList: true, subtree: true });
      pgCut(sec);
    });
    /* a jump to something inside a hidden section opens that section first */
    const siv = Element.prototype.scrollIntoView;
    Element.prototype.scrollIntoView = function () {
      const sec = this.closest && this.closest(".wr-scroll"), st = sec && PG.get(sec);
      if (st) { pgCut(sec); const off = this.closest(".pg-off"); if (off) { st.page = off._pg; pgCut(sec); } }   /* cut first: the view may have just been re-rendered */
      return siv.apply(this, arguments);
    };
  }

  /* ---------- THE ILLUMINATION (v15): every instrument drawn to the Oracle's standard ----------
     Three things no page has to do for itself (the styles are at the foot of src/styles.css):
       · a masthead at the head of every view — the page's sign, the page's name, the view's name, what it is for;
       · light under everything drawn: one bloom filter, defined once here, given to each chart by the class .lux;
       · the same on the two reading pages that have no tabs (the Transmissions, the Trial).
     The Oracle draws its own and is left alone. */
  function illuminate() {
    const body = document.body; if (body.classList.contains("or")) return;
    const me = ITEMS.find(it => it.id === here) || ITEMS[0];
    const mh = $("masthead"), h1 = mh && mh.querySelector("h1"), tag = mh && mh.querySelector(".tagline");
    const page = (h1 ? h1.textContent.split("·").pop().trim() : me.label.replace(/<[^>]+>/g, "")).toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
    const hero = (k, t2, l) => '<header class="vw-top"><div class="vw-emb">' + me.icon + '</div><div><div class="vw-k">' + esc(k) + '</div><h2 class="vw-t">' + esc(t2) + "</h2>" + (l ? '<p class="vw-l">' + esc(l) + "</p>" : "") + "</div></header>";
    /* the bloom: a soft copy of whatever is drawn, laid under it. Referenced from a style element in this document, so the
       fragment resolves here whether the page is served, opened from disk or inlined into one file. */
    body.insertAdjacentHTML("beforeend", '<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><filter id="ax-bloom" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b"/><feComponentTransfer in="b" result="g"><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>');
    document.head.appendChild(document.createElement("style")).textContent = '.lux{filter:url(#ax-bloom)}[data-theme="white"] .lux{filter:none}';
    const LIT = "svg.chart:not(.lux), svg.spark:not(.lux), svg.pspark:not(.lux), #cp:not(.lux), #ln:not(.lux), #tl:not(.lux), #pn-svg:not(.lux), #bl-svg:not(.lux)";
    const tabs = Array.from(document.querySelectorAll("#wr-tabs button[data-v]")), rl = body.classList.contains("rl");
    const dress = () => {
      document.querySelectorAll(LIT).forEach(s => s.classList.add("lux"));
      document.querySelectorAll(".wr-view:not([hidden])").forEach(sec => { const pane = sec.querySelector(".pane"), at = pane || sec;
        if (at.querySelector(":scope > .vw-top") || (!pane && (!rl || sec.querySelector(".rl-map, #mp, [data-stage]")))) return;     /* a map keeps the whole stage; a view with no pane is dressed at its own head */
        const tb = tabs.find(b => "v-" + b.dataset.v === sec.id); if (!tb) return;
        const up = tb.dataset.kin && tabs.find(b => b.dataset.v === tb.dataset.kin);            /* a grouped view names the tab it stands beside */
        at.insertAdjacentHTML("afterbegin", hero(page + (up ? " · " + up.textContent.trim() : ""), tb.dataset.label || tb.textContent.trim(), (tb.title || "").replace(/\s*\(\d\)\s*$/, "")).replace('class="vw-top"', pane ? 'class="vw-top"' : 'class="vw-top sec"')); });
    };
    dress();
    if (rl) new MutationObserver(dress).observe($("dc-stage") || body, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
    const solo = { transmissions: "tx-main", trial: "tr-stage" }[here], at = solo && $(solo);
    if (at && !at.querySelector(".vw-top")) at.insertAdjacentHTML("afterbegin", hero("Archivus", page, tag ? tag.textContent.trim().replace(/^./, c => c.toUpperCase()) + "." : ""));
  }

  /* ---------- THE TRIM (v16, reworked in v16.2): fewer doors, grouped tabs, a quieter first screen ----------
     NOTHING IS HIDDEN OR REMOVED — the owner asked for the site to be reorganised, not cut. Done once here
     (styles at the foot of src/styles.css):
       · GROUPED TABS. Every view keeps its tab and its name. A view that is the same subject arranged another
         way stands beside the tab it belongs with, smaller, and is marked in the page itself:
             <button role="tab" data-v="red" data-kin="roll">The Red Seizures</button>
         A tab of secondary weight (method and sources) carries class="minor". This function only lights the
         parent while one of its kin is open, and writes the number-key hints from the strip's order.
       · THE GUIDE. The "how to read this" card in the right-hand panel is folded to a labelled strip at the
         right edge until opened (click the strip or the Guide button; remembered). The panel opens by itself
         when something is selected.
       · TUCKED CHIP ROWS. The Bloodline's houses and the Pantheons' domains open from one labelled button. */
  function foldTabs() {
    const box = $("wr-tabs"); if (!box) return;
    const btns = Array.from(box.querySelectorAll("button[data-v]"));
    btns.forEach((b, i) => { b.dataset.label = b.textContent.trim(); b.title = (b.title || "").replace(/\s*\(\d\)\s*$/, "") + " (" + (i + 1) + ")"; });
    if (!btns.some(b => b.dataset.kin)) return;
    const sync = () => { const on = box.querySelector("button.on"), up = on && on.dataset.kin; btns.forEach(b => b.classList.toggle("kin", !!up && b.dataset.v === up)); };
    new MutationObserver(sync).observe(box, { attributes: true, subtree: true, attributeFilter: ["class"] });
    sync();
  }
  let guideOpen = false; try { guideOpen = localStorage.getItem("archivus-guide") === "open"; } catch (_) {}
  if (document.body && !guideOpen) document.body.classList.add("guide-shut");
  function guide() {
    const side = $("dc-side"), bar = $("wr-bar"), body = document.body; if (!side || !bar) return;
    const btn = document.createElement("button"); btn.type = "button"; btn.id = "guide-btn"; btn.title = "How to read this view, and where to start";
    btn.innerHTML = I('<circle cx="8" cy="8" r="6.2"/><path d="M6.2 6.3a1.9 1.9 0 1 1 2.7 1.7c-.6.4-.9.8-.9 1.4M8 11.7v.1"/>') + "<span>Guide</span>";
    const find = $("dc-find"); if (find) bar.insertBefore(btn, find); else bar.appendChild(btn);
    const wide = () => Math.round(side.getBoundingClientRect().width);
    let was = wide();                                         /* what the instrument saw when it drew itself */
    const set = open => { guideOpen = open; try { if (open) localStorage.setItem("archivus-guide", "open"); else localStorage.removeItem("archivus-guide"); } catch (_) {} body.classList.toggle("guide-shut", !open); sync(); };
    const sync = () => {
      const card = !!side.querySelector(".dc-card:not(.intro)"), intro = !side.hidden && !!side.querySelector(".dc-card.intro");
      body.classList.toggle("side-card", card);
      const folded = intro && !guideOpen && !card;            /* the panel is a strip at the edge, labelled "Guide" */
      side.classList.toggle("folded", folded);
      if (folded) { side.setAttribute("role", "button"); side.setAttribute("tabindex", "0"); side.setAttribute("aria-label", "Open the guide to this view"); }
      else { side.removeAttribute("role"); side.removeAttribute("tabindex"); side.removeAttribute("aria-label"); }
      btn.hidden = !intro; btn.classList.toggle("on", guideOpen); btn.setAttribute("aria-pressed", guideOpen);
      const now = wide();
      if (now !== was && innerWidth > 860) requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));   /* the stage changed width: let the instrument redraw to fit */
      was = now;
    };
    btn.addEventListener("click", () => set(!guideOpen));
    side.addEventListener("click", () => { if (side.classList.contains("folded")) set(true); });
    side.addEventListener("keydown", e => { if (side.classList.contains("folded") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); set(true); } });
    new MutationObserver(sync).observe(side, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden"] });
    sync(); body.classList.add("side-ready"); sync();        /* from here the panel's own class decides its width, not the boot rule */
  }
  function tuck() {
    [["bl-houses", "Houses", "bl-toolbar"], ["pn-dombar", "Domains", "pn-toolbar"]].forEach(r => {
      const el = $(r[0]), bar = $(r[2]); if (!el || !bar) return;
      const n = (el.querySelector(":scope > div") || el).children.length, btn = document.createElement("button");
      btn.type = "button"; btn.className = "tool-btn tuck-btn"; btn.setAttribute("aria-expanded", "false"); btn.textContent = r[1] + (n ? " · " + n : "");
      btn.title = "Show or hide the " + r[1].toLowerCase() + " (filters and colour key)";
      el.classList.add("tucked"); bar.appendChild(btn);
      btn.addEventListener("click", () => { const open = !el.classList.toggle("tucked"); btn.setAttribute("aria-expanded", open); btn.classList.toggle("active", open); window.dispatchEvent(new Event("resize")); });
    });
  }
  function ready() {
    buildHeader();
    /* the older per-page link buttons are redundant now — hidden, not deleted (no-script fallback) */
    document.querySelectorAll("#bar > a[href], #masthead a[href], #as-bar a[href], #cx-bar a[href]").forEach(a => {
      if (FILES.indexOf(fileOf((a.getAttribute("href") || "").split("#")[0])) >= 0) a.classList.add("legacy-nav");
    });
    document.body.classList.add("has-rail");
    /* overlays that hang below the chrome (the Archive's filter drawer) read its height from here */
    const hdr = $("hdr"), bar = $("bar");
    const setH = () => root.style.setProperty("--chrome-h", ((hdr ? hdr.offsetHeight : 0) + (bar ? bar.offsetHeight : 0)) + "px");
    setH(); window.addEventListener("resize", setH);
    if (window.ResizeObserver && bar) new ResizeObserver(setH).observe(bar);
    foldTabs();
    glide($("wr-tabs"), "button.on");
    guide(); tuck();
    paginate();
    speculate();
    if (document.prerendering) document.addEventListener("prerenderingchange", () => { placePill(true); titleCard(); }, { once: true });
    else titleCard();
    illuminate();
  }
  buildHeader();                                             /* runs at the top of <body>: the header exists before first paint */
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ready); else ready();
})();

    { id: "ukraine", n: "Russia – Ukraine", rg: "Europe", lv: 5, tr: "flat", trBy: "CFR", ty: "War between states", since: 2014, at: [48.4, 37.6], where: ["Ukraine"],
      sum: "Russia seized Crimea and backed a war in the Donbas in 2014, and invaded the whole country on 24 February 2022. It is the largest war in Europe since 1945, fought along a front of about a thousand kilometres and, at long range, against each other's cities, refineries and power grids.",
      now: "Russian forces are pressing toward Kostiantynivka, Pokrovsk and Myrnohrad; Ukraine holds about 19% of Donetsk province. US envoys met President Putin in Moscow on 12 Nov after three-way talks in Abu Dhabi. There is no ceasefire. October was, by one research institute's count, Russia's costliest month of the war.",
      d25: "80,245", d26: "42,286", cum: "369,000 – 827,000+",
      toll: [["Civilians killed, Jan–Sep 2026", "2,570 (and 15,211 injured)", "UN monitoring mission (HRMMU)", "hrmmu"], ["Civilians, September 2026 alone", "328 killed, 2,105 injured — the worst month on the UN's record", "UN monitoring mission (HRMMU)", "hrmmu"]],

    { id: "armaz", n: "Armenia – Azerbaijan", rg: "Europe", lv: 1, tr: "down", trBy: "CFR", ty: "Territorial dispute", since: 1988, at: [39.9, 46.6], where: ["Armenia", "Azerbaijan"],

    /* ---------------------------- MIDDLE EAST ---------------------------- */
    { id: "iran", n: "United States & Israel – Iran", rg: "Middle East", lv: 4, tr: "up", trBy: "CFR", ty: "War between states", since: 2026, at: [27.0, 56.2], where: ["Iran"],
      sum: "On 28 February 2026 the United States and Israel struck Iran, killing Supreme Leader Ali Khamenei; the Assembly of Experts named his son Mojtaba to succeed him. Iran struck US bases, Israel and the Gulf states and closed the Strait of Hormuz; the US blockaded Iran's ports. A two-week ceasefire in April and a Pakistan-mediated memorandum in June lowered the fighting without ending it, and it flared again in July.",
      now: "US strikes hit Qeshm island on the night of 8–9 Nov; Washington called earlier strikes 'defensive'. The blockade of Iran's southern ports stands. Iranian state television says 11 tankers were attacked in ten days in Hormuz. Talks continue through Qatar and Pakistan; Iran's seven demands include an end to the blockade and to sanctions.",
      d25: null, d26: "8,000 – 10,600 on all fronts, Lebanon included", cum: null,
      toll: [["Killed on all fronts of the 2026 war, Lebanon included", "8,000 – 10,600", "Sum of the sources' counts, as tabulated", "irancas"], ["Displaced by the war", "up to 3.2 million", "UNHCR", "cfrIran"],
             ["Deadliest single incident reported", "at least 175 killed when a US strike hit an elementary school", "New York Times", "cfrIran"]],
      sides: [
        { n: "United States, Israel and the Gulf states", parties: [{ n: "United States", k: "state" }, { n: "Israel", k: "state" }, { n: "Gulf states struck by Iran (UAE, Kuwait, Oman, Saudi Arabia, Bahrain, Qatar)", k: "bloc" }],
          loss: [["Israel: killed", "72 — 40 soldiers, 1 contractor, 26 civilians by Iranian missiles, 5 civilians by Hezbollah fire (to 5 Aug)", "Israeli military and government data", "own", "irancas"],

        { n: "Iran and its allies", parties: [{ n: "Islamic Revolutionary Guard Corps (IRGC)", k: "state", at: [35.7, 51.4], us: "15 Apr 2019", note: "An arm of the Iranian state; the only state body on the US list." }, { n: "Armed forces of Iran", k: "state" },
            { n: "Kata'ib Hizballah and allied Iraqi militias", k: "armed", at: [33.0, 44.1], us: "2 Jul 2009" }],
          loss: [["Iran: killed", "3,528", "Iranian government", "own", "irancas"], ["Iran: killed", "3,400 (UN OCHA) · 3,684 (HRANA, a rights group)", "Outside counts", "count", "irancas"],
                 ["Iran: killed", "6,000", "Israeli military", "claim", "irancas"],

    { id: "lebanon", n: "Israel – Hezbollah (Lebanon)", rg: "Middle East", lv: 4, tr: "flat", trBy: "CFR", ty: "War between a state and an armed group", since: 2023, at: [33.3, 35.5], where: ["Lebanon"],
      sum: "Hezbollah and Israel have exchanged fire since October 2023 and fought a war in 2024. On 2 March 2026, after the strikes on Iran, Hezbollah fired on Israel; Israel resumed large-scale bombing and invaded on 16 March. A US-brokered truce from 16 April was extended several times. A framework in June tied Israel's withdrawal to Hezbollah's disarmament, which Hezbollah rejected.",
      now: "Israel holds roughly a fifth of Lebanese territory. On 13 Nov Lebanese state media reported Israeli artillery and tank fire on Majdal Zoun, Bayt al-Sayyad and Mayfadoun.",
      d25: null, d26: "4,324 in Lebanon", cum: null,
      toll: [["Killed in Lebanon since 2 Mar 2026", "4,324 (12,221 injured) — the count does not separate fighters from civilians", "Lebanese Health Ministry", "irancas"],

        { n: "Hezbollah", parties: [{ n: "Hezbollah", k: "armed", at: [33.85, 35.86], us: "8 Oct 1997", uk: "2019" }],
          loss: [["Fighters killed", "over 1,000", "Hezbollah internal sources, per Asharq Al-Awsat", "own", "irancas"], ["Fighters killed", "1,700", "Israeli military", "claim", "irancas"]] },

          loss: [["Soldiers and security officers killed in Israeli strikes", "at least 6 soldiers and 13 State Security officers, in the incidents listed", "Lebanese authorities", "own", "lebwar"]] }
      ], src: ["cfrLeb", "irancas", "lebwar", "lebcf", "fto", "uk"] },

    { id: "gaza", n: "Israel – Hamas (Gaza and the West Bank)", rg: "Middle East", lv: 4, tr: "up", trBy: "CFR", ty: "War between a state and an armed group", since: 2023, at: [31.4, 34.4], where: ["Palestine", "Israel"],

  /* ------------------------------------------------------------

      paint(fn) { Object.keys(paths).forEach(iso => { const c = fn(iso); paths[iso].forEach(p => { p.style.fill = c || ""; p.classList.toggle("on", !!c); }); }); },
      select(iso) { g.querySelectorAll(".sel").forEach(p => p.classList.remove("sel")); (paths[iso] || []).forEach(p => { p.classList.add("sel"); g.appendChild(p); }); },

        if (x1 - x0 > 200) return;                         /* spans the antimeridian — leave the view alone */

  <script>
/* ============================================================
   ARCHIVUS — TOTAL WAR (v19)
   Every war the Archive knows, on one string: thirty-three centuries from Kadesh to the wars
   being fought today, and the one that is only projected.
     · the Map        — every war where it was fought, lit in the years it was fought: drag the
                        year or press Play, and thirty-three centuries pass in about a minute (v19.3)
     · the String     — a bar a war, laid on its years and its part of the world, sized by its dead,
                        with one thread run through them all in the order they began
     · the Toll       — the wars ranked by their dead, each with the range the estimates span
     · the Centuries  — the same dead, century by century
     · Method & sources
   Data: src/data/totalwar.js (the sized wars), the Chronicle's own events (the rest),
   src/data/conflicts.js (the wars under way). Nothing is copied: a war that exists elsewhere
   in the Archive is read from there and links back to it.
   Deep links:  totalwar.html#v=map&y=1242     #v=map&i=ww2     #v=string&i=thirtyyears&z=2     #v=toll     #v=centuries
   ============================================================ */
(function () {
  "use strict";
  const K = window.ARCHIVUS_KIT, $ = K.$, esc = K.esc;

  const EV = {}; (window.ARCHIVUS_EVENTS || []).forEach(e => { EV[e.id] = e; });
  const NOW = +TW.meta.asOf.slice(0, 4) + 0.9, T0 = TW.meta.t0, T1 = TW.meta.t1;
  const LANE_OF = { "Europe": "eu", "West Asia / Middle East": "wa", "Central Asia": "ca", "South Asia": "ca", "East Asia": "ea", "Southeast Asia": "se", "Oceania": "se", "Africa": "af", "North America": "am", "Latin America": "am", "Global": "gl" };
  const CF_LANE = { Europe: "eu", "Middle East": "wa", Africa: "af", Americas: "am" }, CF_ASIA = { myanmar: "se", philippines: "se", papua: "se", thaicam: "se", taiwan: "ea", korea: "ea", scs: "se" };
  const yr = y => y < 0 ? -y + " BCE" : String(y), span = r => r.kind === "battle" || r.a === r.e ? yr(r.a) : yr(r.a) + " – " + (r.open ? "now" : yr(r.e));
  const mil = v => v >= 10 ? Math.round(v) : v >= 1 ? +v.toFixed(1) : +v.toFixed(2), tollT = r => r.lo == null ? "" : (r.lo === r.hi ? "about " + mil(r.lo) : mil(r.lo) + " – " + mil(r.hi)) + " million";
  const ord = n => n + (n % 100 > 10 && n % 100 < 14 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
  const tone = r => r.kind === "proj" ? "#e8c455" : r.gm == null ? (r.lv ? LV[r.lv - 1].c : "#8d96af") : r.gm >= 10 ? "#ff2e55" : r.gm >= 1 ? "#e0502f" : "#ee8f3a";

  TW.battles.forEach(id => { const e = EV[id]; if (e) R.push({ id, n: e.title, a: e.startYear, e: e.startYear, lane: LANE_OF[e.region] || "gl", ev: id, kind: "battle" }); });
  CF.list.filter(c => c.lv >= 4 && !taken[c.id]).forEach(c => R.push({ id: "now-" + c.id, n: c.n.split(":")[0], a: c.since, e: NOW, open: true, lane: CF_ASIA[c.id] || CF_LANE[c.rg] || "ca", cf: c.id, lv: c.lv, kind: "now" }));
  R.forEach(r => { if (r.cf && !r.lv) { const c = CF.list.filter(x => x.id === r.cf)[0]; if (c && r.open) r.lv = c.lv; } });
  R.push({ id: "ww3", n: "World War III", a: NOW, e: T1, open: true, lane: "gl", kind: "proj" });
  R.sort((a, b) => a.a - b.a || a.e - b.e); R.forEach((r, i) => { r.ix = i; BY[r.id] = r; });

  function go(v) { if (tabs.ids.indexOf(v) >= 0) { st.v = v; sync(); } }

  function render() { if (st.v === "map") drawMap(); else if (st.v === "string") drawString(); else if (st.v === "toll") drawToll(); else if (st.v === "centuries") drawCent(); else drawMethod(); }

  /* ---- the time axis: piecewise, so the crowded centuries get the room ---- */
  const WP = TW.warp;
  const fx = y => { y = Math.max(T0, Math.min(T1, y)); for (let i = 1; i < WP.length; i++) if (y <= WP[i][0]) return WP[i - 1][1] + (y - WP[i - 1][0]) / (WP[i][0] - WP[i - 1][0]) * (WP[i][1] - WP[i - 1][1]); return 1; };

  /* ---------------- the map ----------------
     One year drives it. Every war is a disc where it was fought (several discs for several fronts), sized by its

  const ptsOf = r => WHERE[r.id] || (r.ev && GEO[r.ev] ? [[GEO[r.ev][0], GEO[r.ev][1]]] : null) || (function () { const c = r.cf && CF.list.filter(x => x.id === r.cf)[0]; return c && c.at ? [[c.at[0], c.at[1]]] : null; })();
  const ON_MAP = R.filter(r => r.kind !== "proj" && ptsOf(r));
  const rad = r => r.gm == null ? (r.kind === "battle" ? 3.4 : 4) : 6 + 30 * Math.sqrt(r.gm / SIZED[0].gm);
  const deadBy = y => SIZED.reduce((a, r) => a + r.gm * Math.max(0, Math.min(1, (y - r.a) / Math.max(1, r.e - r.a))), 0), DEAD_ALL = SIZED.reduce((a, r) => a + r.gm, 0);
  const play = { on: false, raf: 0, last: 0, fast: false };
  let tmap = null, tmarks = [], thread = null, sideKey = "";
  const MX = lon => lon + 180, MY = lat => 90 - lat;
  function placeMarks() { if (!tmap) return; const s = tmap.scale(), a = s.toFixed(4), b = (s / tmap.SY).toFixed(4); for (let i = 0; i < tmarks.length; i++) { const t = "translate(" + tmarks[i].x + " " + tmarks[i].y + ") scale(" + a + " " + b + ")"; tmarks[i].g.setAttribute("transform", t); if (tmarks[i].gl) tmarks[i].gl.setAttribute("transform", t); } }
  function stop() { play.on = false; cancelAnimationFrame(play.raf); }
  function tick(now) {
    if (!play.on) return; const dt = Math.min(.1, (now - play.last) / 1000); play.last = now;
    const u = fx(st.y) + dt * FN / (play.fast ? 32 : 70); st.y = fxInv(u);
    if (u >= FN) { st.y = NOW; stop(); return sync(); }

  function drawCent() {
    const C = []; for (let c = -13; c <= 20; c++) { const a = c * 100, b = a + 100; C.push({ a, b, n: 0, dead: 0, top: null }); }
    C.forEach(c => { R.forEach(r => { if (r.kind === "battle" || r.kind === "proj") return; if (r.a >= c.a && r.a < c.b) c.n++;
      if (r.gm != null) { const len = Math.max(1, r.e - r.a), ov = Math.max(0, Math.min(r.e, c.b) - Math.max(r.a, c.a)) + (r.e === r.a && r.a >= c.a && r.a < c.b ? 1 : 0), part = r.gm * ov / len; if (part > 0) { c.dead += part; if (!c.top || part > c.top[1]) c.top = [r, part]; } } }); });
    const mx = Math.max.apply(null, C.map(c => c.dead)), name = c => c.a < 0 ? ord(Math.ceil(-c.a / 100)) + " c. BCE" : ord(c.a / 100 + 1) + " century";
    $("tc-chart").innerHTML = C.map(c => '<div class="tc-c' + (c.top && st.i === c.top[0].id ? " sel" : "") + '"' + (c.top ? ' data-i="' + c.top[0].id + '"' : "") + ' title="' + esc(name(c) + ": about " + mil(c.dead) + " million dead in the sized wars; " + c.n + " wars begun") + '"><span class="v">' + (c.dead >= 0.05 ? mil(c.dead) : "") + '</span><i style="height:' + (Math.sqrt(c.dead / mx) * 100).toFixed(1) + '%"></i><b>' + (c.a < 0 ? Math.ceil(-c.a / 100) : c.a / 100 + 1) + "</b><small>" + c.n + "</small></div>").join("")
      + '<div class="tc-ax"><span>centuries BCE</span><span>centuries CE</span></div>';
    $("tc-table").innerHTML = '<table class="tw-tbl"><thead><tr><th>Century</th><th class="num">Wars begun</th><th class="num">Dead, millions</th><th>Its deadliest war</th></tr></thead><tbody>' + C.slice().reverse().filter(c => c.n || c.dead > 0.01).map(c => '<tr class="row"' + (c.top ? ' data-i="' + c.top[0].id + '"' : "") + "><td>" + name(c) + '</td><td class="num">' + c.n + '</td><td class="num">' + (c.dead >= 0.05 ? mil(c.dead) : "—") + "</td><td>" + (c.top ? esc(c.top[0].n) + " <small>" + span(c.top[0]) + "</small>" : "<small>none of this century's wars is sized</small>") + "</td></tr>").join("") + "</tbody></table>";
    $("tc-n").innerHTML = "Each sized war's dead, at the middle of its range, spread evenly over its years. Bars use a square-root scale. The record thins as it goes back: fewer wars before 1500 means fewer written down, not fewer fought.";
    if (!built.cent) { built.cent = 1; const f = e => { const b = e.target.closest("[data-i]"); if (b) pick(b.dataset.i); }; $("tc-chart").addEventListener("click", f); $("tc-table").addEventListener("click", f); }
  }

  /* ---------------- method ---------------- */
  const srcA = k => '<a href="' + TW.src[k][1] + '"' + (/^https/.test(TW.src[k][1]) ? ' target="_blank" rel="noopener"' : "") + ">" + esc(TW.src[k][0].split(" — ")[0]) + "</a>";
  function drawMethod() {
    if (built.mt) return; built.mt = 1;
    $("tm-pane").innerHTML = '<div class="grid2 even"><div class="col scroll"><h4>What this is</h4><p>One string through every war the Archive holds: ' + WARS.length + " wars and " + TW.battles.length + " single battles, from Kadesh in 1274 BCE to the " + R.filter(r => r.open && r.kind !== "proj").length + " wars being fought as this was compiled, and one more that is only projected.</p>"
      + "<h4>Where the rows come from</h4><p><b>" + SIZED.length + " sized wars</b> are those a reference list of wars by death toll puts at about half a million dead or more; the range shown is that list's own. <b>" + R.filter(r => r.kind === "more").length + " more</b> are wars the Chronicle records that the list does not size; each opens its own record and source. <b>" + R.filter(r => r.kind === "now").length + " wars under way</b> are read from the Conflicts, where every figure is sourced and dated. The last bar, World War III, is not a war: it leads to the projection.</p>"
      + "<h4>How to read a death toll</h4><p>As an order of magnitude. Before 1800 nobody counted: the figures are reconstructions from tax rolls, censuses and chronicles, and most include the famine and disease that war brought. The Three Kingdoms figure is a gap between two censuses. Where the list gives a range the string draws both ends: the bright bar is the low estimate, the pale halo the high. The ranges come from one compilation.</p>"
      + "<h4>Second sources</h4><p>Every one of the " + SIZED.length + " sized wars was taken to a second source. <b>" + Object.keys(SEC).length + "</b> carry what that source says, on the war's card and as a gold mark on the Toll. For the other <b>" + (SIZED.length - Object.keys(SEC).length) + "</b> the pages opened give no figure, or only repeat the list's; their cards say what was opened, and their bars are dotted.</p>"
      + "<p>A second figure is not always the same measure, and the card says which it is. <b>Totals</b> come from Britannica, the World History Encyclopedia, university projects (Tufts, Minnesota, Central Arkansas, MIT), the United Nations and the International Rescue Committee. <b>Soldiers killed in battle only</b> come from Project Mars and from Levy's list of great-power wars: they sit far to the left of the list's bar, and the gap is the civilians, the famine and the disease. <b>A fall in population</b> is all there is for the Spanish conquests and the fall of the Ming. <b>An ancient author's count</b> is all there is for Caesar's Gaul and the Jewish wars. Where a second source confirms the list it may be because both go back to the same estimate: a second source shows that a figure is in the literature, not that it is right.</p><h4>The two world wars</h4><p>The two largest modern rows are also in the War Room, from other sources: it gives the Second World War about 60 million dead or more (the National WWII Museum) against the list's 70 to 85 million, and the First 8.5 million soldiers and about 13 million civilians (Britannica) against 15 to 22 million. The differences are of definition, mainly whether war-related famine and the 1918 influenza are counted.</p>"
      + "<h4>What the string leaves out</h4><p>Wars with fewer than about half a million dead that the Chronicle does not record; there were thousands. The record also thins with distance: the crowding after 1500 is partly more war and partly more writing. The centuries view spreads each war's dead evenly over its years, which no war obeyed. The count of wars under way peaks in the present for the same reason: today is listed far more completely than any earlier century.</p>"
      + '</div><div class="col scroll"><h4>Sources</h4><div class="srcs">' + Object.keys(TW.src).map(k => '<a href="' + TW.src[k][1] + '"' + (/^https/.test(TW.src[k][1]) ? ' target="_blank" rel="noopener"' : "") + ">" + esc(TW.src[k][0]) + "</a>").join("") + "</div><h4>Second sources, opened 27 November 2026</h4><div class=\"srcs\">" + (function () { const seen = {}, o = []; Object.keys(SEC).forEach(k => [[SEC[k][3], SEC[k][4]]].concat(SEC[k][6] || []).forEach(m => { if (/^https/.test(m[1]) && !seen[m[1]]) { seen[m[1]] = 1; o.push('<a href="' + m[1] + '" target="_blank" rel="noopener">' + esc(m[0]) + "</a>"); } })); return o.join(""); })() + "</div>"
      + '<p class="hint">Every war that has a record in the Chronicle or the Conflicts links to it from its card, and that record carries its own source.</p><h4>Elsewhere in the Archive</h4><div class="srcs"><a href="wars.html">The War Room: the two world wars, day by day ⟶</a><a href="conflicts.html">The Conflicts: the wars under way ⟶</a><a href="situation.html">The Situation: the world as it stands ⟶</a><a href="ww3.html">World War III: the projection ⟶</a><a href="oracle.html#v=lines&i=war">The Oracle on war: is the world getting more violent? ⟶</a></div></div></div>';
  }

  /* ---------------- the side panel ---------------- */
  const X_BTN = '<button class="sd-x" title="Close (Esc)" aria-label="Close">×</button>';
  function card(r) {
    const e = r.ev && EV[r.ev], c = r.cf && CF.list.filter(x => x.id === r.cf)[0], rank = SIZED.indexOf(r), prev = R[r.ix - 1], next = R[r.ix + 1];
    if (r.kind === "proj") return X_BTN + '<div class="sd-k" style="color:#e8c455">Projected · not a war</div><div class="sd-t">World War III</div><p class="sd-p">The string does not end at the present. The last war between great powers ended in 1945; what a third would look like, how it could start and what it would cost has been wargamed, surveyed and modelled, and the Archive has gathered that in one place.</p><div class="sd-links"><a class="lnk go" href="ww3.html">Open the projection ⟶</a></div>' + (prev ? '<div class="sd-links"><button class="lnk" data-i="' + prev.id + '">◂ ' + esc(prev.n) + "</button></div>" : "");
    let h = X_BTN + '<div class="sd-k">' + esc(TW.lanes.filter(l => l[0] === r.lane)[0][1]) + (r.kind === "battle" ? " · a single battle" : r.open ? " · still being fought" : "") + '</div><div class="sd-t">' + esc(r.n) + '</div><div class="sd-d">' + span(r) + (r.kind !== "battle" && r.e - r.a >= 1 ? " · " + Math.round(r.e - r.a) + " years" : "") + (r.approx ? " · dates approximate" : "") + "</div>";
    if (r.lo != null) h += '<div class="tw-toll" style="--c:' + tone(r) + '"><b>' + tollT(r) + "</b><span>dead" + (rank >= 0 ? " · " + (rank ? ord(rank + 1) + " " : "") + "deadliest of " + SIZED.length : "") + '</span><div class="bw"><i class="hi" style="width:' + (Math.sqrt(r.hi / SIZED[0].hi) * 100).toFixed(1) + '%"></i><i class="lo" style="width:' + (Math.sqrt(r.lo / SIZED[0].hi) * 100).toFixed(1) + '%"></i>' + mark(r, v => (Math.sqrt(v / SIZED[0].hi) * 100).toFixed(1)) + "</div><small>" + (r.lo === r.hi ? "A single estimate." : "Low and high estimates.") + " " + srcA("list") + "</small></div>"
      + (SEC[r.id] ? secBlock(SEC[r.id]) : r.lo != null ? '<div class="tw-sec none"><b>The list\'s figure only</b><p>' + esc(SOUGHT[r.id] || "No second source has been opened for this war.") + "</p></div>" : "");
    else if (r.kind !== "battle") h += '<p class="hint">' + (r.kind === "now" ? "Not sized on the reference list. The Conflicts gives what is counted, side by side." : "Not sized on the reference list of wars by death toll.") + "</p>";
    if (TW.notes[r.id]) h += '<div class="q" style="border-color:#5b93b8"><span>' + esc(TW.notes[r.id]) + "</span></div>";
    if (e) h += '<p class="sd-p">' + esc(e.desc) + '</p><div class="sd-links"><a class="lnk" href="index.html#e=' + e.id + '&v=chronicle">In the Chronicle ⟶</a>' + (e.source ? '<a class="lnk" href="' + esc(e.source) + '" target="_blank" rel="noopener">Source ↗</a>' : "") + "</div>";
    if (c) h += '<div class="sd-k">Now</div><p class="sd-p">' + esc(c.now) + '</p><div class="sd-links"><a class="lnk go" href="conflicts.html#v=map&i=' + c.id + '">Sides, losses and sources, in the Conflicts ⟶</a></div>';
    if (r.id === "ww1" || r.id === "ww2") h += '<div class="sd-links"><a class="lnk go" href="wars.html#w=' + r.id + '">Day by day, in the War Room ⟶</a></div>';
    /* what else was being fought while this was */
    const mean = R.filter(q => q !== r && q.kind !== "battle" && q.kind !== "proj" && q.a <= r.e && q.e >= r.a).sort((a, b) => (b.gm || 0) - (a.gm || 0)).slice(0, 6);
    if (mean.length && r.kind !== "battle") h += '<div class="sd-k">Fought in the same years</div>' + mean.map(q => '<button class="rel" data-i="' + q.id + '" style="border-left-color:' + tone(q) + '">' + esc(q.n) + "<i>" + span(q) + (q.lo != null ? " · " + tollT(q) : "") + "</i></button>").join("");
    return h + '<div class="sd-links">' + (st.v !== "map" && ptsOf(r) ? '<button class="lnk" data-go="map">On the map ⟶</button>' : "") + (st.v !== "string" ? '<button class="lnk" data-go="string">On the string ⟶</button>' : "") + (prev ? '<button class="lnk" data-i="' + prev.id + '" title="' + esc(prev.n) + '">◂ before</button>' : "") + (next ? '<button class="lnk" data-i="' + next.id + '" title="' + esc(next.n) + '">after ▸</button>' : "") + "</div>";
  }
  function intro() {
    if (st.v === "map" && st.y != null) { const y = st.y, act = WARS.filter(r => inSpan(r, y)).sort((a, b) => (b.gm || 0) - (a.gm || 0)), bt = R.filter(r => r.kind === "battle" && inSpan(r, y));
      return '<div class="sd-k">In ' + yr(Math.round(y)) + "</div><p>" + (act.length ? act.length + (act.length === 1 ? " war" : " wars") + " of the record under way." : "No war of the record is under way: a gap in the record more than a peace.") + '</p><div class="dth"><div><span>Under way</span><b>' + act.length + "</b></div><div><span>Dead so far</span><b>~" + (deadBy(y) >= 10 ? Math.round(deadBy(y)) : deadBy(y).toFixed(1)) + "m</b></div></div>"
        + (act.length || bt.length ? '<div class="sd-k">Being fought</div>' + bt.concat(act).slice(0, 14).map(q => '<button class="rel" data-i="' + q.id + '" style="border-left-color:' + tone(q) + '">' + esc(q.n) + "<i>" + span(q) + (q.lo != null ? " · " + tollT(q) : "") + "</i></button>").join("") : ""); }
    const T = { map: ["THE MAP", "Every war the Archive knows, where it was fought. A disc is a front or a centre of the fighting, sized by the war's dead. Press Play and thirty-three centuries pass in about a minute: a war burns in its years and leaves an ember. Drag the year along the track under the map, or click a disc."], string: ["THE STRING", "Every war the Archive knows on one line of time, by the part of the world it was fought in. A bar's length is its years, its thickness its dead; the pale halo is the high estimate. The gold thread runs through them in the order they began. Click a war; stretch time with the buttons above."],
                toll: ["THE TOLL", "The wars ranked by their dead. The gap between the bright bar and the pale one is what is not known."],
                centuries: ["THE CENTURIES", "The same dead, century by century, with each century's deadliest war."], method: ["METHOD", "Where the rows come from and how far to trust a death toll."] }[st.v];
    return '<div class="sd-k">' + T[0] + "</div><p>" + T[1] + '</p><div class="dth"><div><span>Wars</span><b>' + WARS.length + "</b></div><div><span>Years covered</span><b>" + (Math.round(NOW) - R[0].a).toLocaleString("en") + "</b></div><div><span>Dead, sized wars</span><b>~" + Math.round(SIZED.reduce((a, r) => a + r.gm, 0)) + "m</b></div><div><span>Being fought now</span><b>" + R.filter(r => r.open && r.kind !== "proj").length + "</b></div></div>"
      + '<div class="sd-k">The deadliest</div>' + SIZED.slice(0, 7).map(q => '<button class="rel" data-i="' + q.id + '" style="border-left-color:' + tone(q) + '">' + esc(q.n) + "<i>" + span(q) + " · " + tollT(q) + "</i></button>").join("");
  }
  function renderSide() {
    const side = $("dc-side"), r = st.i && BY[st.i];
    if (!r && innerWidth <= 860) { side.hidden = true; return; }
    side.hidden = false; side.innerHTML = '<div class="dc-card' + (r ? "" : " intro") + '">' + (r ? card(r) : intro()) + "</div>"; side.scrollTop = 0;
  }

  /* ---------------- boot ---------------- */
  function applyHash() {
    if (location.hash === K.hash.self && built.boot) return;
    const q = K.hash.read(); if (q.v && tabs.ids.indexOf(q.v) >= 0) st.v = q.v; st.i = BY[q.i] ? q.i : null; st.z = [1, 2, 4].indexOf(+q.z) >= 0 ? +q.z : 1; st.f = q.f === "two" || q.f === "one" ? q.f : null; stop(); st.y = q.y != null && q.y !== "" && isFinite(+q.y) ? Math.max(T0, Math.min(NOW, +q.y)) : null; built.boot = 1; sync(true);
  }
  tabs = K.tabs(() => st.v, go);
  $("dc-side").addEventListener("click", e => { if (e.target.closest("a")) return; if (e.target.closest(".sd-x")) { st.i = null; return sync(); } const g = e.target.closest("[data-go]"); if (g) { st.v = g.dataset.go; const r = st.i && BY[st.i]; if (st.v === "map" && r) st.y = Math.min(NOW, (r.a + r.e) / 2); return sync(); } const b = e.target.closest("[data-i]"); if (b) { stop(); st.i = b.dataset.i; sync(); } });
  document.addEventListener("keydown", e => { if (e.target.closest("input, textarea") || e.ctrlKey || e.metaKey || e.altKey) return; if (e.key === "Escape" && st.i) { st.i = null; return sync(); }
    if (e.key === " " && st.v === "map" && !e.target.closest("button, a, [role=tab]")) { e.preventDefault(); if (play.on) { stop(); sync(); } else start(); return; }
    const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0; if (d && st.i) { const n = R[BY[st.i].ix + d]; if (n) { st.i = n.id; sync(); } } });               /* ← → walk the string */
  K.finder($("dc-q"), q => R.filter(r => r.n.toLowerCase().indexOf(q) >= 0).slice(0, 12).map(r => ({ label: r.n, sub: span(r) + (r.lo != null ? " · " + tollT(r) : ""), id: r.id })), h => { if (st.v === "method") st.v = "map"; stop(); st.i = h.id; sync(); });
  let rt = 0; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { renderSide(); render(); }, 140); });
  window.addEventListener("hashchange", applyHash);
  applyHash();
})();

</script>
