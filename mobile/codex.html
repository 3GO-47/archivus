<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVUS — The Codex</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0c12'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23c9a227' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e8c455'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@300;400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ARCHIVUS — v0.5 "Lens"
   Dark observatory. Modern instrument typography:
   Space Grotesk (structure) · Inter (reading) · IBM Plex Mono (data)
   ============================================================ */

:root {
  --obsidian:      #0a0c12;
  --obsidian-2:    #0e1119;
  --obsidian-3:    #131826;
  --paper:         #e6e1d3;
  --paper-dim:     #a8a494;
  --gold:          #c9a227;
  --gold-bright:   #e8c455;
  --gold-dim:      #6e5c1f;
  --indigo:        #7c9ac9;
  --line:          #262c3b;
  --line-faint:    #181d29;
  --panel-bg:      #10131dfa;
  --sans: "Inter", system-ui, sans-serif;
  --display: "Space Grotesk", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body { height: 100dvh; }        /* dynamic viewport: tracks the phone's address bar */

body {
  background:
    radial-gradient(ellipse 130% 75% at 50% -12%, #151d33 0%, transparent 55%),
    radial-gradient(ellipse 85% 55% at 88% 112%, #1c1324 0%, transparent 60%),
    var(--obsidian);
  color: var(--paper);
  font-family: var(--sans);
  font-size: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.mono { font-family: var(--mono); font-size: 0.82em; letter-spacing: 0.03em; }

/* ============ motion ============ */
@keyframes glowpulse {
  0%, 100% { box-shadow: 0 0 8px rgba(201,162,39,0.35); }
  50%      { box-shadow: 0 0 20px rgba(232,196,85,0.7); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%, 100% { opacity: 0.04; } 50% { opacity: 0.45; } }
@keyframes condense { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes reveal-up {
  from { transform: translateY(8px); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}

/* ============ masthead ============ */
#masthead {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 22px 10px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(201,162,39,0.05), transparent);
  position: relative;
}
#masthead::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -2px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim) 25%, var(--gold) 50%, var(--gold-dim) 75%, transparent);
  opacity: 0.5;
  pointer-events: none;
}

/* pure-geometry sigil: ring, orbit, nucleus */
.sigil {
  position: relative;
  width: 34px; height: 34px;
  border: 1px solid rgba(201,162,39,0.55);
  border-radius: 50%;
  animation: glowpulse 6s ease-in-out infinite;
}
.sigil::before {
  content: "";
  position: absolute; inset: -5px;
  border: 1px dashed rgba(201,162,39,0.3);
  border-radius: 50%;
  animation: spin 50s linear infinite;
}
.sigil::after {
  content: "";
  position: absolute; left: 50%; top: 50%;
  width: 6px; height: 6px; margin: -3px 0 0 -3px;
  background: var(--gold-bright);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--gold-bright);
}

#masthead h1 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 19px;
  letter-spacing: 0.34em;
  color: var(--gold-bright);
}
.tagline {
  color: var(--paper-dim);
  font-size: 12px;
  letter-spacing: 0.06em;
  margin-top: 1px;
}

#tx-link {
  margin-left: auto;
  font-family: var(--display);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid var(--gold-dim);
  border-radius: 4px;
  padding: 7px 14px;
  transition: all 0.18s;
}
#tx-link:hover { color: var(--gold-bright); box-shadow: 0 0 12px rgba(201,162,39,0.22); }
#bl-link, #pn-link, #cx-link, #tr-link {
  margin-left: 8px;
  font-family: var(--display);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid var(--gold-dim);
  border-radius: 4px;
  padding: 7px 14px;
  transition: all 0.18s;
}
#bl-link:hover, #pn-link:hover, #cx-link:hover { color: var(--gold-bright); box-shadow: 0 0 12px rgba(201,162,39,0.22); }

.masthead-readout { margin-left: 16px; text-align: right; }
.readout-line { font-family: var(--display); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.readout-line.mono { font-family: var(--mono); color: var(--paper-dim); font-size: 11px; margin-top: 3px; text-transform: none; }

/* ============ single command bar (main app) ============ */
#bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(201,162,39,0.05), transparent);
  position: relative;
  z-index: 30;
  flex-wrap: nowrap;
}
#bar::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -2px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim) 25%, var(--gold) 50%, var(--gold-dim) 75%, transparent);
  opacity: 0.5;
  pointer-events: none;
}
#bar-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.3em;
  color: var(--gold-bright);
  margin-right: 4px;
}
.sigil.mini { width: 24px; height: 24px; }
.sigil.mini::before { inset: -4px; }
.sigil.mini::after { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; }
#bar .masthead-readout { margin-left: 4px; }
#bar #search { flex: 0 1 220px; }
#bar #tx-link, #bar #bl-link, #bar #pn-link, #bar #cx-link, #bar #tr-link { margin-left: 0; padding: 6px 10px; font-size: 10.5px; }
#bar .sigil.mini { cursor: pointer; }

/* ============ the portal (welcome overlay) ============ */
#welcome {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(7, 9, 15, 0.93);
  display: flex; align-items: center; justify-content: center;
  padding: 18px;
  overflow-y: auto;
}
#welcome[hidden] { display: none !important; }   /* the hidden attribute must always win */
#welcome-card {
  width: min(680px, 96vw);
  max-height: 92dvh; overflow-y: auto;
  background: var(--obsidian-2);
  border: 1px solid var(--gold-dim);
  border-radius: 10px;
  padding: 30px 30px 22px;
  text-align: center;
  box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 60px rgba(201,162,39,.08);
  animation: reveal-up 0.35s ease-out;
}
.w-sigil {
  width: 44px; height: 44px; margin: 0 auto 14px;
  border: 1px solid rgba(201,162,39,0.6); border-radius: 50%;
  position: relative; animation: glowpulse 5s ease-in-out infinite;
}
.w-sigil::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 8px; height: 8px; margin: -4px 0 0 -4px;
  background: var(--gold-bright); border-radius: 50%;
  box-shadow: 0 0 12px var(--gold-bright);
}
#welcome-card h2 {
  font-family: var(--display); font-weight: 700; font-size: 20px;
  letter-spacing: 0.34em; color: var(--gold-bright); margin-bottom: 8px;
}
.w-sub { font-size: 13.5px; line-height: 1.6; color: var(--paper-dim); margin-bottom: 20px; }
.w-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.w-door {
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left;
  background: var(--obsidian-3); border: 1px solid var(--line); border-radius: 7px;
  padding: 13px 15px; cursor: pointer; text-decoration: none;
  color: var(--paper); font-family: var(--sans); transition: all 0.16s;
}
.w-door:hover { border-color: var(--gold); background: rgba(201,162,39,0.08); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.w-door.wide { grid-column: 1 / -1; }
.w-door .w-ic { font-size: 19px; }
.w-door b { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--gold-bright); letter-spacing: 0.03em; }
.w-door span:last-child { font-size: 11.5px; line-height: 1.5; color: var(--paper-dim); }
.w-foot { margin-top: 16px; font-family: var(--mono); font-size: 10px; color: #59617c; }
.w-foot b { color: var(--gold); font-weight: 400; }
@media (max-width: 700px) {
  .w-grid { grid-template-columns: 1fr; }
  #welcome-card { padding: 22px 18px 16px; }
  #welcome-card h2 { font-size: 16px; letter-spacing: 0.24em; }
}

/* ============ collapsible drawer ============ */
#drawer {
  position: fixed;
  left: 0; top: 48px; bottom: 0;
  width: 300px;
  max-width: 85vw;
  background: var(--panel-bg);
  backdrop-filter: blur(6px);
  border-right: 1px solid var(--line);
  box-shadow: 24px 0 60px rgba(0,0,0,0.5);
  padding: 18px 16px 30px;
  overflow-y: auto;
  z-index: 25;
  transform: translateX(-104%);
  transition: transform 0.3s cubic-bezier(.22,1,.36,1);
}
#drawer.open { transform: translateX(0); }
.d-section { margin-bottom: 20px; }
.d-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 9px;
}
.d-row { display: flex; flex-wrap: wrap; gap: 6px; }
.d-row select { max-width: 100%; flex: 1 1 120px; }
#drawer #theme-chips { display: flex; flex-direction: column; gap: 6px; padding: 0; border: none; }
#drawer .chip { justify-content: flex-start; }
.d-legend { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--paper-dim); }
.d-legend .legend-item { display: inline-flex; align-items: center; gap: 7px; line-height: 1.5; }

/* atlas time-play + narrative tours */
#play-btn {
  position: absolute;
  left: 10px; bottom: 46px;
  z-index: 6;
  box-shadow: 0 4px 18px rgba(0,0,0,0.5), 0 0 14px rgba(201,162,39,0.15);
}
#tours-menu {
  position: absolute;
  right: 12px; top: 8px;
  z-index: 40;
  background: var(--panel-bg);
  backdrop-filter: blur(6px);
  border: 1px solid var(--gold-dim);
  border-radius: 6px;
  padding: 10px;
  width: 340px;
  max-width: 90vw;
  box-shadow: 0 14px 44px rgba(0,0,0,0.6);
}
.tour-item {
  padding: 9px 10px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(255,255,255,0.02);
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.tour-item:hover { background: rgba(201,162,39,0.1); border-left-color: var(--gold); }
.tour-item .tt { font-family: var(--display); font-weight: 600; font-size: 12.5px; color: var(--gold-bright); }
.tour-item .tb { font-size: 11.5px; color: var(--paper-dim); margin-top: 2px; line-height: 1.45; }
#tour-card {
  position: absolute;
  left: 50%; bottom: 52px;
  transform: translateX(-50%);
  z-index: 35;
  width: 560px; max-width: 92%;
  background: var(--panel-bg);
  backdrop-filter: blur(6px);
  border: 1px solid var(--gold-dim);
  border-radius: 6px;
  padding: 14px 16px 12px;
  box-shadow: 0 16px 50px rgba(0,0,0,0.65), 0 0 24px rgba(201,162,39,0.1);
  animation: reveal-up 0.25s ease-out;
}
#tour-note { font-size: 14px; line-height: 1.6; color: var(--paper); margin: 6px 0 10px; }
#tour-nav { display: flex; align-items: center; gap: 8px; }
#tour-step { font-size: 10.5px; color: #59617c; margin: 0 auto 0 4px; }
.map-year-big {
  font-family: "IBM Plex Mono", monospace;
  fill: var(--gold-bright);
  font-size: 34px;
  letter-spacing: 0.06em;
  paint-order: stroke; stroke: rgba(10,12,18,0.85); stroke-width: 6px;
}
.ignite { pointer-events: none; }
#play-speed { position: absolute; left: 150px; bottom: 46px; z-index: 6; }
#play-era {
  position: absolute; left: 10px; bottom: 88px; z-index: 6;
  font-family: var(--display); font-weight: 700;
  font-size: 21px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--gold-bright);
  text-shadow: 0 0 18px rgba(201,162,39,0.5), 0 2px 4px rgba(0,0,0,0.8);
  pointer-events: none;
}
#play-era.flash { animation: era-flash 0.9s ease-out; }
@keyframes era-flash {
  0% { transform: scale(1.5); opacity: 0; letter-spacing: 0.5em; }
  100% { transform: scale(1); opacity: 1; letter-spacing: 0.24em; }
}
#play-feed {
  position: absolute; left: 10px; top: 46px; z-index: 6;
  width: 320px; max-width: 44vw;
  display: flex; flex-direction: column; gap: 4px;
  pointer-events: none;
}
.feed-item {
  background: rgba(10,12,18,0.72);
  border-left: 3px solid var(--c, var(--gold));
  border-radius: 0 3px 3px 0;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--paper);
  animation: reveal-up 0.3s ease-out;
}
.feed-item .fy { font-family: var(--mono); font-size: 9.5px; color: var(--gold-bright); display: block; }
.feed-item:nth-child(n+4) { opacity: 0.55; }
.feed-item:nth-child(n+6) { opacity: 0.28; }
.wheel-hand { stroke: var(--gold-bright); stroke-width: 1.6; filter: drop-shadow(0 0 8px rgba(232,196,85,0.8)); pointer-events: none; }
.wheel-hand-tip { fill: var(--gold-bright); filter: drop-shadow(0 0 10px rgba(232,196,85,0.9)); pointer-events: none; }
.wheel-year-big {
  font-family: "IBM Plex Mono", monospace;
  fill: var(--gold-bright); font-size: 22px;
  paint-order: stroke; stroke: rgba(10,12,18,0.85); stroke-width: 5px;
}

/* floating status chip inside the chart */
#status {
  position: absolute;
  right: 10px; bottom: 8px;
  font-size: 10.5px;
  color: #59617c;
  background: rgba(10,12,18,0.55);
  border: 1px solid var(--line-faint);
  border-radius: 3px;
  padding: 3px 9px;
  pointer-events: none;
  z-index: 5;
}

/* ============ toolbar ============ */
#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 22px;
  border-bottom: 1px solid var(--line-faint);
}

#view-switch {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.view-btn {
  background: var(--obsidian-3);
  border: none;
  border-right: 1px solid var(--line);
  color: var(--paper-dim);
  font-family: var(--display);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.04em;
  padding: 8px 14px;
  cursor: pointer;
  transition: all 0.18s;
}
.view-btn:last-child { border-right: none; }
.view-btn:hover { color: var(--gold-bright); }
.view-btn.active {
  background: rgba(201,162,39,0.15);
  color: var(--gold-bright);
  box-shadow: inset 0 -2px 0 var(--gold);
}

#search {
  flex: 0 1 280px;
  background: var(--obsidian-3);
  border: 1px solid var(--line);
  color: var(--paper);
  font-family: var(--sans);
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 4px;
  outline: none;
  transition: border-color 0.18s, box-shadow 0.18s;
}
#search:focus { border-color: var(--gold-dim); box-shadow: 0 0 12px rgba(201,162,39,0.2); }
#search::placeholder { color: #5c637a; }

select {
  background: var(--obsidian-3);
  border: 1px solid var(--line);
  color: var(--paper);
  font-family: var(--sans);
  font-size: 12.5px;
  padding: 8px 8px;
  border-radius: 4px;
  max-width: 170px;
  transition: border-color 0.18s;
}
select:hover, select:focus { border-color: var(--gold-dim); outline: none; }

.toolbar-spacer { flex: 1; }

.tool-btn {
  background: var(--obsidian-3);
  border: 1px solid var(--line);
  color: var(--paper-dim);
  font-family: var(--display);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.04em;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  min-width: 34px;
  transition: all 0.18s;
}
.tool-btn:hover {
  border-color: var(--gold-dim);
  color: var(--gold-bright);
  box-shadow: 0 0 10px rgba(201,162,39,0.16);
}
.tool-btn.accent { border-color: var(--gold-dim); color: var(--gold); }
.tool-btn.wide { padding: 8px 14px; }

/* ============ theme chips ============ */
#theme-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 22px 9px;
  border-bottom: 1px solid var(--line-faint);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--sans);
  font-weight: 500;
  font-size: 11.5px;
  letter-spacing: 0.02em;
  color: var(--paper-dim);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 4px 11px;
  cursor: pointer;
  transition: all 0.18s;
  user-select: none;
}
.chip .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--c, var(--gold));
  box-shadow: 0 0 7px var(--c, var(--gold));
}
.chip:hover { border-color: var(--gold-dim); color: var(--paper); }
.chip.active {
  border-color: var(--c, var(--gold));
  color: var(--paper);
  background: color-mix(in srgb, var(--c, var(--gold)) 14%, transparent);
}
.chip.dimmed { opacity: 0.35; }

/* ============ stage ============ */
#stage { flex: 1; display: flex; min-height: 0; position: relative; }

#chart-wrap { flex: 1; position: relative; min-width: 0; }

#chart {
  width: 100%; height: 100%; display: block;
  cursor: crosshair;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#chart.panning { cursor: grabbing; }

/* --- SVG vocabulary --- */
.era-band { cursor: pointer; transition: filter 0.18s; }
.era-band:hover { filter: brightness(1.8); }
.era-band-label {
  font-family: "Space Grotesk", system-ui, sans-serif;
  font-weight: 500;
  fill: #8f9ab5;
  letter-spacing: 0.12em;
  pointer-events: none;
  text-transform: uppercase;
}
.era-boundary { stroke: var(--line-faint); stroke-width: 1; }
.axis-tick-label { font-family: "IBM Plex Mono", monospace; fill: #66708c; font-size: 10px; }
.axis-line { stroke: var(--line); }
.meridian { stroke: var(--gold-dim); stroke-width: 1; stroke-dasharray: 3 4; }
.meridian-label { font-family: "Space Grotesk", sans-serif; fill: var(--gold-dim); font-size: 9px; letter-spacing: 0.16em; }
.lane-label {
  font-family: "Space Grotesk", system-ui, sans-serif;
  font-weight: 500;
  fill: #4d5670;
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  pointer-events: none;
}
.lane-line { stroke: var(--line-faint); stroke-dasharray: 1 5; }

.evt { cursor: pointer; }
.evt .node-core { transition: r 0.16s cubic-bezier(.34,1.56,.64,1); }
.evt-label {
  font-family: "Inter", system-ui, sans-serif;
  fill: var(--paper-dim);
  font-size: 10.5px;
  letter-spacing: 0.01em;
  pointer-events: none;
  paint-order: stroke;
  stroke: rgba(10,12,18,0.88);
  stroke-width: 3px;
}
.evt-label.major { fill: var(--paper); font-size: 11.5px; font-weight: 500; }

.enter .evt {
  transform-box: fill-box;
  transform-origin: center;
  animation: condense 0.5s cubic-bezier(.34,1.56,.64,1) both;
}

/* the standing web of relations */
.web-line {
  stroke: var(--gold);
  stroke-width: 0.6;
  opacity: 0.10;
  pointer-events: none;
}
/* the ignited thread */
.constellation {
  stroke: var(--gold-bright);
  stroke-width: 1;
  stroke-dasharray: 3 5;
  opacity: 0.8;
  pointer-events: none;
  animation: flow 1.6s linear infinite;
}

.star { fill: #b8c4e8; pointer-events: none; }
.star.twinkle { animation-name: twinkle; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }

.time-cursor { stroke: rgba(232,196,85,0.3); stroke-width: 1; pointer-events: none; }
.time-cursor-label {
  font-family: "IBM Plex Mono", monospace;
  fill: var(--gold-bright); font-size: 10px;
  pointer-events: none;
  paint-order: stroke; stroke: rgba(10,12,18,0.9); stroke-width: 3px;
}

.ov-bg { fill: var(--obsidian-2); stroke: var(--line-faint); }
.ov-brush {
  fill: rgba(201,162,39,0.15);
  stroke: var(--gold-dim);
  stroke-width: 1;
  cursor: ew-resize;
  transition: fill 0.18s;
}
.ov-brush:hover { fill: rgba(201,162,39,0.26); }
.ov-dot { pointer-events: none; }
.ov-hit { fill: transparent; cursor: pointer; }

/* atlas */
.map-frame { fill: rgba(124,154,201,0.02); stroke: var(--line); stroke-width: 1; }
.graticule { stroke: var(--line-faint); stroke-width: 0.6; }
.graticule.equator { stroke: var(--gold-dim); stroke-dasharray: 2 5; opacity: 0.5; }
.map-land { fill: rgba(230,225,211,0.11); stroke: #6b7899; stroke-width: 0.9; }
.map-border { fill: none; stroke: #3a445c; stroke-width: 0.6; stroke-dasharray: 2 2; opacity: 0.7; }
.map-country { fill: rgba(230,225,211,0.10); stroke: #4d5a78; stroke-width: 0.7; transition: fill 0.2s; }
.map-country:hover { fill: rgba(201,162,39,0.14); stroke: var(--gold-dim); }
.map-caption {
  font-family: "Space Grotesk", sans-serif;
  fill: var(--gold-dim); font-size: 10px; letter-spacing: 0.16em;
}

/* wheel */
.wheel-ring { fill: none; stroke: var(--line-faint); stroke-dasharray: 1 5; }
.wheel-era { transition: filter 0.18s; }
.wheel-era:hover { filter: brightness(1.9); }
.wheel-era-label {
  font-family: "Space Grotesk", sans-serif;
  font-weight: 500;
  fill: #8f9ab5; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase;
  pointer-events: none;
}
.wheel-center-disc { fill: rgba(201,162,39,0.05); stroke: var(--gold-dim); stroke-width: 0.8; stroke-dasharray: 2 4; }
.wheel-center-title {
  font-family: "Space Grotesk", sans-serif;
  font-weight: 600;
  fill: var(--gold-bright); font-size: 12px; letter-spacing: 0.3em;
}
.wheel-center-sub { font-family: "IBM Plex Mono", monospace; fill: var(--paper-dim); font-size: 9px; }

/* ============ tooltip ============ */
#tooltip {
  position: absolute;
  pointer-events: none;
  background: #151927f5;
  border: 1px solid var(--gold-dim);
  border-radius: 4px;
  padding: 8px 12px;
  max-width: 280px;
  z-index: 30;
  box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  animation: reveal-up 0.14s ease-out;
}
#tooltip .tt-title { font-family: var(--display); font-weight: 500; font-size: 12.5px; color: var(--gold-bright); }
#tooltip .tt-date { font-family: var(--mono); font-size: 10px; color: var(--paper-dim); margin-top: 3px; }

/* ============ slide-in panel ============ */
#panel {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 360px;
  max-width: 88vw;
  border-left: 1px solid var(--line);
  background: var(--panel-bg);
  backdrop-filter: blur(6px);
  padding: 48px 24px 30px;
  overflow-y: auto;
  z-index: 20;
  transform: translateX(102%);
  transition: transform 0.32s cubic-bezier(.22,1,.36,1);
  box-shadow: -24px 0 60px rgba(0,0,0,0.55);
}
#panel.open { transform: translateX(0); }
#panel::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: linear-gradient(180deg, var(--gold-dim), transparent 40%, transparent 60%, var(--gold-dim));
  opacity: 0.5;
  pointer-events: none;
}

#panel-close {
  position: absolute;
  top: 10px; right: 12px;
  width: 30px; height: 30px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--paper-dim);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  transition: all 0.18s;
  z-index: 2;
}
#panel-close:hover { border-color: var(--gold-dim); color: var(--gold-bright); }

#panel-content, #panel-oracle { animation: reveal-up 0.28s ease-out; }

.kicker {
  font-family: var(--display);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

#panel-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 20px;
  line-height: 1.25;
  color: var(--paper);
  margin-bottom: 8px;
}

#panel-date { color: var(--gold-bright); font-size: 12px; margin-bottom: 14px; }

#panel-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.meta-tag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 3px 8px;
  color: var(--paper-dim);
}
.meta-tag.theme-tag { border-color: var(--c, var(--line)); color: var(--c, var(--paper-dim)); }

#panel-desc { font-size: 14.5px; line-height: 1.65; color: var(--paper); margin-bottom: 18px; }

#panel-importance { margin-bottom: 18px; }
#panel-importance .label {
  display: block; font-family: var(--display); font-weight: 500; font-size: 9.5px;
  letter-spacing: 0.2em; text-transform: uppercase; color: #59617c; margin-bottom: 6px;
}
.imp-track {
  display: block; height: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.05);
  overflow: hidden;
}
.imp-fill {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
  border-radius: 3px;
  box-shadow: 0 0 8px rgba(201,162,39,0.5);
}

#panel-source {
  display: inline-block;
  font-family: var(--display);
  font-weight: 500;
  font-size: 11.5px;
  letter-spacing: 0.08em;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid var(--gold-dim);
  padding: 7px 14px;
  border-radius: 4px;
  margin-bottom: 24px;
  transition: all 0.18s;
}
#panel-source:hover {
  background: rgba(201,162,39,0.12);
  color: var(--gold-bright);
}

#panel-related { display: flex; flex-direction: column; gap: 6px; }
.related-link {
  font-size: 13px;
  color: var(--paper-dim);
  cursor: pointer;
  padding: 6px 10px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(255,255,255,0.02);
  transition: all 0.16s;
}
.related-link:hover {
  color: var(--gold-bright);
  background: rgba(201,162,39,0.09);
  border-left-color: var(--gold);
  transform: translateX(3px);
}
.related-link .rl-date { font-family: var(--mono); font-size: 9.5px; color: #59617c; display: block; }

/* ============ oracle & era records ============ */
#panel-oracle .o-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
  color: var(--gold-bright);
  margin-bottom: 4px;
}
#panel-oracle .o-span { font-family: var(--mono); font-size: 11px; color: var(--paper-dim); margin-bottom: 16px; }
#panel-oracle .o-prose { font-size: 14.5px; line-height: 1.68; color: var(--paper); margin-bottom: 18px; }
#panel-oracle .o-prose em { color: var(--gold-bright); font-style: normal; font-weight: 500; }
#panel-oracle .o-section { margin-bottom: 18px; }
#panel-oracle .o-evt {
  display: block;
  font-size: 13px;
  color: var(--paper-dim);
  cursor: pointer;
  padding: 5px 10px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(255,255,255,0.02);
  margin-bottom: 5px;
  transition: all 0.16s;
}
#panel-oracle .o-evt:hover {
  color: var(--gold-bright);
  background: rgba(201,162,39,0.09);
  border-left-color: var(--gold);
  transform: translateX(3px);
}
#panel-oracle .o-evt .oe-date { font-family: var(--mono); font-size: 9.5px; color: #59617c; display: block; }
.o-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.o-bar-name { font-family: var(--mono); font-size: 9.5px; color: var(--paper-dim); width: 108px; flex: none; text-align: right; }
.o-bar-track { flex: 1; height: 7px; background: rgba(255,255,255,0.04); border-radius: 3px; overflow: hidden; }
.o-bar-fill {
  display: block;
  height: 100%; border-radius: 3px;
  box-shadow: 0 0 8px var(--c, var(--gold));
  background: var(--c, var(--gold));
  transition: width 0.6s cubic-bezier(.22,1,.36,1);
}
.o-bar-n { font-family: var(--mono); font-size: 9.5px; color: #59617c; width: 22px; }
.o-divider { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

/* cross-instrument jump links + help overlay */
.tx-jump {
  display: block;
  font-size: 12.5px;
  color: var(--gold);
  text-decoration: none;
  padding: 6px 10px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(201,162,39,0.04);
  margin-bottom: 5px;
  transition: all 0.16s;
}
.tx-jump:hover { color: var(--gold-bright); background: rgba(201,162,39,0.1); transform: translateX(3px); }
#panel-tx { margin-top: 18px; }
#help-overlay {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  background: var(--panel-bg);
  backdrop-filter: blur(8px);
  border: 1px solid var(--gold-dim);
  border-radius: 6px;
  padding: 18px 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 30px rgba(201,162,39,0.1);
  animation: reveal-up 0.2s ease-out;
}
#help-overlay table { border-collapse: collapse; margin: 6px 0 10px; }
#help-overlay td { padding: 3px 14px 3px 0; font-size: 13px; color: var(--paper); }
#help-overlay td:first-child { font-family: var(--mono); color: var(--gold-bright); font-size: 11.5px; white-space: nowrap; }
#help-overlay .hint { font-size: 10px; color: #59617c; line-height: 1.6; }

/* ============ legend ============ */
#legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  padding: 6px 22px;
  border-top: 1px solid var(--line);
  background: var(--obsidian-2);
  font-size: 11.5px;
  color: var(--paper-dim);
}
.legend-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--gold-dim);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
#event-count { margin-left: auto; color: #59617c; }

/* ============ responsive & a11y ============ */
@media (max-width: 900px) {
  #masthead h1 { font-size: 16px; letter-spacing: 0.22em; }
  .masthead-readout { display: none; }
  #search { flex-basis: 150px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; transition-duration: 0.001s !important; }
}

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--obsidian); }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

/* ============ the pocket archive: phones & small screens ============ */
@media (max-width: 700px) {
  /* the page may always scroll on a phone — never trap the user */
  body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  main, #stage { min-height: 64dvh; }
  #panel, #drawer, #bl-panel, #pn-panel, #as-panel { -webkit-overflow-scrolling: touch; }
  #bar { flex-wrap: wrap; padding: 6px 8px; gap: 5px; row-gap: 5px; }
  #bar-title { font-size: 13px; letter-spacing: 0.2em; }
  #bar .tool-btn, #view-switch .view-btn { padding: 5px 8px; font-size: 10px; }
  #bar #tx-link, #bar #bl-link, #bar #pn-link { padding: 5px 7px; font-size: 9px; }
  #search { flex: 1 1 110px; min-width: 90px; font-size: 12px; padding: 6px 9px; }
  .masthead-readout { display: none; }
  .toolbar-spacer { display: none; }
  #drawer { width: 100vw; max-width: 100vw; }
  #panel { width: 100vw; max-width: 100vw; }
  #masthead { padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
  #masthead h1 { font-size: 14px; }
  #masthead .tagline { display: none; }
  #play-feed { width: 58vw; font-size: 9px; }
  #play-era { font-size: 11px; }
  #status { font-size: 9px; }
  #help-overlay { width: 92vw; }
  #tour-card { width: 90vw; left: 5vw; }
  #bl-panel, #pn-panel { width: 100vw; max-width: 100vw; }
  #bl-toolbar, #pn-toolbar { padding: 6px 8px; gap: 4px; }
  #bl-mini { display: none; }
  #bl-hint, #pn-legend { display: none; }
}

/* ============================================================
   v8 — THE OVERHAUL
   · the instrument rail (src/nav.js): one nav strip on every page
   · header that never clips; readout that never wraps
   · engraved display face for mastheads (Cinzel, falls back cleanly)
   · the War Room link in the event panel
   ============================================================ */
:root { --engraved: "Cinzel", "Trajan Pro", "Space Grotesk", Georgia, serif; --allied: #4f8fd6; --axis: #d2452f; }

#rail {
  display: flex; align-items: stretch; gap: 2px;
  flex: 0 0 auto; height: 31px; padding: 0 12px;
  background: linear-gradient(180deg, rgba(6,8,13,0.86), rgba(10,12,18,0.72));
  border-bottom: 1px solid var(--line);
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  position: relative; z-index: 29;
}
#rail::-webkit-scrollbar { display: none; }
#rail a {
  display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
  padding: 0 13px;
  font-family: var(--display); font-weight: 500; font-size: 10.5px; letter-spacing: 0.17em; text-transform: uppercase;
  color: #8792ad; text-decoration: none; white-space: nowrap;
  border-bottom: 2px solid transparent; border-top: 2px solid transparent;
  transition: color 0.16s, background 0.16s, border-color 0.16s;
}
#rail a svg { opacity: 0.75; flex: 0 0 auto; }
#rail a:hover { color: var(--gold-bright); background: rgba(201,162,39,0.07); }
#rail a.here { color: var(--gold-bright); border-bottom-color: var(--gold); background: linear-gradient(180deg, transparent, rgba(201,162,39,0.10)); }
#rail a.here svg { opacity: 1; }
#rail a:focus-visible { outline: 1px solid var(--gold); outline-offset: -3px; }
#rail .new { font: 600 8px/1 var(--display); letter-spacing: 0.1em; color: #0a0c12; background: var(--gold); border-radius: 2px; padding: 2px 4px; }
.legacy-nav { display: none !important; }

/* mastheads: an engraved face for the names of things */
#masthead h1, #bar-title, #welcome-card h2 { font-family: var(--engraved); font-weight: 600; }
#masthead h1 { letter-spacing: 0.24em; font-size: 18px; }
#bar-title { letter-spacing: 0.24em; }
body.has-rail #masthead { padding-top: 9px; padding-bottom: 8px; }

/* the Archive's command bar: nothing may clip, nothing may wrap */
#view-switch { flex: 0 0 auto; }
#bar .tool-btn { flex: 0 0 auto; white-space: nowrap; }
#bar #search { min-width: 120px; }
#bar .masthead-readout { margin-left: 8px; min-width: 0; flex: 0 1 auto; }
.readout-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
#drawer { top: var(--chrome-h, 48px); }

/* chronicle labels sit in their own layer above the nodes (see core.js, v8 label pass) */
.evt-labels { pointer-events: none; }
.evt-label { stroke: rgba(10,12,18,0.94); stroke-width: 3.4px; stroke-linejoin: round; }

/* the door from a war record into the War Room */
.war-jump {
  display: block; margin: 10px 0 16px; padding: 9px 12px;
  font-family: var(--display); font-weight: 500; font-size: 11.5px; letter-spacing: 0.05em;
  color: #ffd9cf; text-decoration: none;
  background: linear-gradient(90deg, rgba(210,69,47,0.20), rgba(79,143,214,0.16));
  border: 1px solid rgba(210,69,47,0.5); border-radius: 4px;
  transition: transform 0.16s, box-shadow 0.16s;
}
.war-jump:hover { transform: translateX(3px); box-shadow: 0 0 16px rgba(210,69,47,0.28); color: #fff; }

@media (max-width: 700px) {
  #rail { height: 34px; padding: 0 4px; }
  #rail a { padding: 0 10px; font-size: 10px; letter-spacing: 0.12em; }
  .readout-line { max-width: 60vw; }
}

/* v9 — the door into the Doctrines */
.war-jump.doc-jump { color: #f6e7b4; background: linear-gradient(90deg, rgba(229,72,77,0.16), rgba(201,162,39,0.14), rgba(154,120,214,0.16)); border-color: rgba(201,162,39,0.55); }
.war-jump.doc-jump:hover { box-shadow: 0 0 16px rgba(201,162,39,0.3); }
#panel-war + #panel-doc { margin-top: -8px; }
.w-door.doc { border-color: rgba(201,162,39,0.55); background: linear-gradient(120deg, rgba(229,72,77,0.11), rgba(79,174,106,0.08), rgba(154,120,214,0.12)); }
.w-door.doc:hover { border-color: var(--gold-bright); }

/* v8 portal: the War Room door */
.w-door.war { border-color: rgba(210,69,47,0.55); background: linear-gradient(120deg, rgba(79,143,214,0.10), rgba(210,69,47,0.12)); }
.w-door.war:hover { border-color: #ff8a73; box-shadow: 0 8px 26px rgba(210,69,47,0.25); }
#bar #wr-link { font-family: var(--display); font-size: 10.5px; letter-spacing: 0.1em; color: var(--gold); text-decoration: none; border: 1px solid var(--gold-dim); border-radius: 4px; padding: 6px 10px; }

/* ============================================================
   v10 — ONE INSTRUMENT
   · one header on every page (src/nav.js): brand · instruments · search
     — the per-page mastheads are hidden once it is in place
   · page-to-page: native cross-document view transitions where the
     browser has them, a hand-made fade everywhere else
   · search everything (Ctrl/⌘ K) · first-arrival title card
   · gliding tab markers · eased view changes · quiet scrollbars
   ============================================================ */
html { background: var(--obsidian); color-scheme: dark; }
* { scrollbar-width: thin; scrollbar-color: #2b3348 transparent; }
::selection { background: rgba(201,162,39,0.34); color: #fff; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }

/* ---- the header ---- */
html.hdr-on #masthead { display: none !important; }
html.hdr-on #bar > .sigil.mini, html.hdr-on #bar-title { display: none; }
#hdr {
  flex: 0 0 auto; height: 44px; display: flex; align-items: stretch; gap: 4px;
  padding: 0 12px 0 14px; position: sticky; top: 0; z-index: 45;
  background: linear-gradient(180deg, #0c0f18, #0a0c12);
  border-bottom: 1px solid var(--line);
  view-transition-name: hdr;
}
#hdr::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--gold-dim) 22%, var(--gold) 50%, var(--gold-dim) 78%, transparent); opacity: 0.45;
}
.hdr-brand { display: flex; align-items: center; gap: 11px; flex: 0 0 auto; text-decoration: none; padding: 0 16px 0 2px; margin-right: 6px; border-right: 1px solid var(--line-faint); }
.hdr-brand b { font-family: var(--engraved); font-weight: 600; font-size: 14px; letter-spacing: 0.26em; color: var(--gold-bright); transition: text-shadow 0.2s; }
.hdr-brand:hover b { text-shadow: 0 0 14px rgba(232,196,85,0.55); }
#hdr #rail { flex: 1 1 auto; min-width: 0; height: auto; padding: 0; background: none; border: 0; gap: 0; z-index: auto; }
#hdr #rail a { border: 0; padding: 0 12px; position: relative; z-index: 1; }
#hdr #rail a:hover { background: none; }
#hdr #rail a.here { background: none; }
#rail-pill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0; opacity: 0; pointer-events: none;
  border-bottom: 2px solid var(--gold);
  background: linear-gradient(180deg, transparent 25%, rgba(201,162,39,0.13));
  transition: transform 0.42s cubic-bezier(0.3, 0.85, 0.3, 1), width 0.42s cubic-bezier(0.3, 0.85, 0.3, 1), opacity 0.2s;
}
#omni-btn {
  flex: 0 0 auto; align-self: center; display: inline-flex; align-items: center; gap: 8px; margin-left: 8px;
  height: 28px; padding: 0 9px 0 10px; cursor: pointer;
  background: var(--obsidian-3); border: 1px solid var(--line); border-radius: 14px;
  color: #8792ad; font: 500 11.5px var(--display); letter-spacing: 0.03em; white-space: nowrap;
  transition: border-color 0.16s, color 0.16s, box-shadow 0.16s;
}
#omni-btn:hover { border-color: var(--gold-dim); color: var(--gold-bright); box-shadow: 0 0 14px rgba(201,162,39,0.14); }
#omni-btn kbd, #omni kbd { font: 9.5px var(--mono); color: #7d87a1; border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; background: rgba(255,255,255,0.03); }
#hdr #rail a { letter-spacing: 0.15em; }
/* all eleven instruments must fit without scrolling, so their places never move from page to page */
#hdr #rail a i { font-style: normal; }
@media (max-width: 1900px) { #omni-btn span { display: none; } }
@media (max-width: 1700px) { #hdr #rail a { padding: 0 9px; letter-spacing: 0.11em; gap: 6px; } .hdr-brand { padding-right: 12px; margin-right: 2px; } #hdr #rail a i { display: none; } }
@media (max-width: 1500px) { #omni-btn kbd { display: none; } #omni-btn { padding: 0 9px; margin-left: 2px; } #hdr #rail a { padding: 0 7px; letter-spacing: 0.08em; gap: 5px; } }

      icon: I('<path d="M2.6 11.4L2 5.2l3.4 2.6L8 3.4l2.6 4.4L14 5.2l-.6 6.2zM3.2 13.6h9.6"/>') },
    { id: "lineage", href: "lineage.html", label: "Bloodline", tip: "The family tree — pantheon of Sumer to the lines of the Messiah",
      icon: I('<path d="M8 2v4M8 6H4v3M8 6h4v3M4 9v2M12 9v2"/><circle cx="8" cy="2.4" r="1" fill="currentColor"/><circle cx="4" cy="12.4" r="1.3"/><circle cx="12" cy="12.4" r="1.3"/>') },
    { id: "pantheons", href: "pantheons.html", label: "Pantheons", tip: "Seven divine family trees and the roads between religions",
      icon: I('<path d="M2 5.6L8 2l6 3.6M3 6.5h10M4.3 6.8v5.4M8 6.8v5.4M11.7 6.8v5.4M2.5 13h11"/>') },
    { id: "transmissions", href: "transmissions.html", label: "Transmissions", tip: "Claims of taught knowledge, against the documented record",
      icon: I('<path d="M8 1.8l1.5 4.7 4.7 1.5-4.7 1.5L8 14.2 6.5 9.5 1.8 8l4.7-1.5z"/>') },
    { id: "trial", href: "trial.html", label: "Trial", tip: "Ten questions drawn fresh from the archive",
      icon: I('<path d="M8 2.2v11.3M5 13.5h6M3 4.2h10M3 4.2L1.5 8.4h3zM13 4.2l-1.5 4.2h3z"/>') }
  ];
  const FILES = ITEMS.map(it => it.href);
  const fileOf = p => (p.split("/").pop() || "index.html").toLowerCase();
  const file = fileOf(location.pathname);
  const here = (ITEMS.find(it => it.href === file) || ITEMS[0]).id;
  const POCKET = /\/mobile\/[^/]*$/.test(location.pathname);          /* the single-file builds live in /mobile/ */
  const MAC = /Mac|iPhone|iPad/.test(navigator.platform || "");
  const reduced = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const nativeVT = location.protocol !== "file:" && "CSSViewTransitionRule" in window;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const mem = {
    get(k) { try { return sessionStorage.getItem("archivus:" + k); } catch (_) { return null; } },
    set(k, v) { try { sessionStorage.setItem("archivus:" + k, v); } catch (_) {} }
  };

  root.classList.add("hdr-on");
  if (nativeVT && !reduced) {
    /* the browser cross-fades: each page opts in from a small script in its <head>, because the rule
       must be known before the page first renders — too early for this file */
  } else if (!reduced) {
    /* no native cross-page transition here (file://, older browsers): fade the stage in by hand; the header never fades */
    root.classList.add("vtf", "arriving");
    setTimeout(() => root.classList.remove("arriving"), 520);
  }

  /* ───────────── the header ───────────── */
  const hrefFor = it => it.href + (it.id !== here ? (mem.get("hash:" + it.id) || "") : "");
  function buildHeader() {
    if ($("hdr") || !document.body) return;
    const h = document.createElement("header");
    h.id = "hdr";
    h.innerHTML =
      '<a class="hdr-brand" href="index.html" title="Archivus — begin again at the Archive"><span class="sigil mini" aria-hidden="true"></span><b>ARCHIVUS</b></a>' +
      '<nav id="rail" aria-label="Archivus instruments">' +
      ITEMS.map(it => '<a href="' + hrefFor(it) + '" data-id="' + it.id + '" title="' + it.tip + '"' + (it.id === here ? ' class="here" aria-current="page"' : "") + ">" + it.icon + "<span>" + it.label + "</span></a>").join("") +
      '<i id="rail-pill" aria-hidden="true"></i></nav>' +
      '<button id="omni-btn" type="button" title="Search every instrument at once (' + (MAC ? "⌘" : "Ctrl ") + 'K)" aria-label="Search every instrument">' +
      I('<circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3l3.4 3.4"/>') + "<span>Search everything</span><kbd>" + (MAC ? "⌘K" : "Ctrl K") + "</kbd></button>";
    document.body.insertBefore(h, document.body.firstChild);
    $("omni-btn").addEventListener("click", () => openOmni());
    const cur = h.querySelector("#rail .here"), rail = $("rail");
    if (cur && rail.scrollWidth > rail.clientWidth) rail.scrollLeft = cur.offsetLeft - (rail.clientWidth - cur.offsetWidth) / 2;
    placePill(!document.prerendering);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placePill(false));
  }
  /* the marker under the current instrument: starts where it stood on the previous page, then glides */
  function placePill(travel) {
    const rail = $("rail"), pill = $("rail-pill"), cur = rail && rail.querySelector(".here");
    if (!cur || !pill) return;
    const to = [cur.offsetLeft, cur.offsetWidth];
    const set = p => { pill.style.transform = "translateX(" + p[0] + "px)"; pill.style.width = p[1] + "px"; };
    let from = null;
    if (travel && !reduced) { try { from = JSON.parse(mem.get("pill") || "null"); } catch (_) {} }
    if (from && from[0] !== to[0]) {
      pill.style.transition = "none"; set(from); pill.style.opacity = 1;
      pill.getBoundingClientRect();                       /* commit the start position before the glide */
      pill.style.transition = "";
      requestAnimationFrame(() => set(to));
    } else { set(to); pill.style.opacity = 1; }
    if (!document.prerendering) mem.set("pill", JSON.stringify(to));
  }

  /* ───────────── memory: each instrument reopens where you left it ───────────── */
  const saveState = () => { if (!document.prerendering) mem.set("hash:" + here, location.hash.length > 1 ? location.hash : ""); };
  window.addEventListener("hashchange", saveState);
  window.addEventListener("pagehide", saveState);
  window.addEventListener("pageshow", e => {
    root.classList.remove("leaving");                      /* back/forward cache restores the page as it was left */
    if (e.persisted) document.querySelectorAll("#rail a[data-id]").forEach(a => { const it = ITEMS.find(x => x.id === a.dataset.id); if (it) a.setAttribute("href", hrefFor(it)); });
  });

  /* ───────────── leaving: instrument-to-instrument hops ───────────── */
  function go(href) {
    saveState();
    if (!root.classList.contains("vtf")) { location.href = href; return; }
    root.classList.add("leaving");
    setTimeout(() => { location.href = href; }, 130);
  }
  window.ARCHIVUS_GO = go;
  document.addEventListener("click", e => {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
    let u; try { u = new URL(a.getAttribute("href"), location.href); } catch (_) { return; }
    if (u.protocol !== location.protocol || u.host !== location.host) return;
    if (FILES.indexOf(fileOf(u.pathname)) < 0 || u.pathname === location.pathname) return;
    saveState();
    if (!root.classList.contains("vtf")) return;           /* the browser's own view transition takes it from here */
    e.preventDefault();
    go(u.href);
  });

  /* ───────────── prerender the page under the pointer (Chromium; ignored elsewhere) ───────────── */
  function speculate() {
    if (location.protocol === "file:" || !(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports("speculationrules"))) return;
    const s = document.createElement("script");
    s.type = "speculationrules";
    s.textContent = JSON.stringify({ prerender: [{ where: { selector_matches: "#rail a, .hdr-brand" }, eagerness: "moderate" }] });
    document.head.appendChild(s);
  }

  /* ───────────── a title card, the first time you enter an instrument ───────────── */
  function titleCard() {
    const mh = $("masthead"), tag = mh && mh.querySelector(".tagline"), h1 = mh && mh.querySelector("h1");
    if (!tag || reduced || mem.get("seen:" + here)) return;
    mem.set("seen:" + here, "1");
    const d = document.createElement("div");
    d.id = "arrive-card";
    d.innerHTML = "<b>" + esc((h1 ? h1.textContent : "").split("·").pop().trim()) + "</b><span>" + esc(tag.textContent.trim()) + "</span>";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 4600);
  }

  /* ───────────── gliding markers for in-page tab strips ───────────── */
  function glide(box, sel) {
    if (!box || box.querySelector(":scope > .tab-pill")) return;
    const pill = document.createElement("i");
    pill.className = "tab-pill"; pill.setAttribute("aria-hidden", "true");
    box.appendChild(pill); box.classList.add("glides");
    let first = true;
    const place = () => {
      const cur = box.querySelector(sel);
      if (!cur) { pill.style.opacity = 0; return; }
      if (first) pill.style.transition = "none";
      pill.style.width = cur.offsetWidth + "px"; pill.style.transform = "translateX(" + cur.offsetLeft + "px)"; pill.style.opacity = 1;
      if (first) { pill.getBoundingClientRect(); pill.style.transition = ""; first = false; }
    };
    new MutationObserver(place).observe(box, { attributes: true, subtree: true, attributeFilter: ["class"] });
    window.addEventListener("resize", place);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    place();
  }
  window.ARCHIVUS_GLIDE = glide;

  /* ───────────── search everything ───────────── */
  const KINDS = { go: ["Instrument", "#e8c455"], ev: ["Record", "#c9a227"], "do": ["Doctrine", "#e5484d"], th: ["Forerunner", "#d8c690"], ba: ["Battle", "#ff7a66"],
    le: ["Leader", "#5b9be0"], bl: ["Bloodline", "#b48ef0"], gd: ["God", "#5bc8dd"], tx: ["Transmission", "#62c073"], cn: ["Country", "#49c9b8"], cu: ["Seizure", "#e08a3c"] };
  const WHERE = { ev: "The Archive", "do": "Doctrines", th: "Doctrines", ba: "War Room", le: "War Room", bl: "Bloodline", gd: "Pantheons", tx: "Transmissions", cn: "Realms", cu: "Coups" };
  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const rec = r => ({ l: r[0], k: r[1], h: r[2], s: r[3] || "", w: r[4] || 0, nl: norm(r[0]), ns: norm(r[3] || "") });
  const GO = ITEMS.map(it => rec([it.label.replace(/<[^>]+>/g, ""), "go", it.href, it.tip, 9]));
  const om = { el: null, idx: null, state: "idle", hits: [], sel: 0, back: null };
  function loadIndex() {
    if (om.state !== "idle") return;
    om.state = "loading";
    const s = document.createElement("script");
    s.src = (POCKET ? "../" : "") + "src/data/omni.js";
    s.onload = () => { om.idx = (window.ARCHIVUS_OMNI || []).map(rec); om.state = "ready"; paintOmni(); };
    s.onerror = () => { om.idx = []; om.state = "missing"; paintOmni(); };
    document.head.appendChild(s);
  }
  function find(q) {
    const toks = norm(q).split(/\s+/).filter(Boolean), nq = toks.join(" "), out = [];
    if (!toks.length) return out;
    const pool = GO.concat(om.idx || []);
    for (let p = 0; p < pool.length; p++) {
      const r = pool[p]; let sc = 0, ok = true;
      for (let t = 0; t < toks.length; t++) {
        const i = r.nl.indexOf(toks[t]);
        if (i === 0) sc += 0; else if (i > 0 && /[\s\-·(,/'’:]/.test(r.nl[i - 1])) sc += 1; else if (i > 0) sc += 2.5;
        else if (r.ns.indexOf(toks[t]) >= 0) sc += 4; else { ok = false; break; }
      }
      if (!ok) continue;
      if (r.nl === nq) sc -= 3; else if (r.nl.indexOf(nq) === 0) sc -= 1.5;
      out.push([sc - r.w * 0.07 + r.nl.length * 0.004, r]);
    }
    out.sort((a, b) => a[0] - b[0]);
    return out.slice(0, 40).map(x => x[1]);
  }
  const recent = () => { try { return (JSON.parse(localStorage.getItem("archivus:recent") || "[]") || []).map(rec); } catch (_) { return []; } };
  function remember(r) {
    if (r.k === "go") return;
    try {
      const a = (JSON.parse(localStorage.getItem("archivus:recent") || "[]") || []).filter(x => x[2] !== r.h);
      a.unshift([r.l, r.k, r.h, r.s]);
      localStorage.setItem("archivus:recent", JSON.stringify(a.slice(0, 7)));
    } catch (_) {}
  }
  function paintOmni() {
    if (!om.el || om.el.hidden) return;
    const q = $("omni-q").value.trim(), list = $("omni-list");
    let h = "";
    const row = (r, i) => '<button type="button" class="om-row' + (i === om.sel ? " on" : "") + '" data-i="' + i + '"><i style="--k:' + KINDS[r.k][1] + '">' + KINDS[r.k][0] + "</i><b>" + esc(r.l) + "</b><span>" + esc(r.s) + "</span><em>" + (WHERE[r.k] || "open") + " ⟶</em></button>";
    if (!q) {
      const rc = recent();
      om.hits = rc.concat(GO);
      if (rc.length) h += '<div class="om-h">Recently opened</div>' + rc.map((r, i) => row(r, i)).join("");
      h += '<div class="om-h">The instruments</div>' + GO.map((r, i) => row(r, i + rc.length)).join("");
    } else {
      om.hits = find(q);
      h = om.hits.length ? om.hits.map(row).join("") : '<div class="om-none">' + (om.state === "loading" ? "Opening the index…" : "Nothing by that name in any instrument.") + "</div>";
    }
    if (om.state === "missing") h += '<div class="om-none">The full index is not available in this copy — instruments only.</div>';
    list.innerHTML = h;
    const on = list.querySelector(".om-row.on"); if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
    $("omni-count").textContent = om.state === "ready" ? om.idx.length.toLocaleString() + " entries across eleven instruments" : om.state === "loading" ? "opening the index…" : "";
  }
  function openOmni(seed) {
    if (!om.el) {
      const d = document.createElement("div");
      d.id = "omni"; d.hidden = true;
      d.innerHTML = '<div id="omni-box" role="dialog" aria-modal="true" aria-label="Search every instrument"><div id="omni-top">' + I('<circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3l3.4 3.4"/>') +
        '<input id="omni-q" type="text" autocomplete="off" spellcheck="false" placeholder="Search every instrument — a record, a doctrine, a battle, a god…" aria-label="Search every instrument"><kbd>Esc</kbd></div>' +
        '<div id="omni-list" role="listbox"></div><div id="omni-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span id="omni-count"></span></div></div>';
      document.body.appendChild(d);
      om.el = d;
      d.addEventListener("mousedown", e => { if (e.target === d) closeOmni(); });
      $("omni-q").addEventListener("input", () => { om.sel = 0; paintOmni(); });
      $("omni-list").addEventListener("click", e => { const b = e.target.closest(".om-row"); if (b) pick(om.hits[+b.dataset.i]); });
      $("omni-list").addEventListener("mousemove", e => { const b = e.target.closest(".om-row"); if (b && +b.dataset.i !== om.sel) { om.sel = +b.dataset.i; $("omni-list").querySelectorAll(".om-row").forEach(x => x.classList.toggle("on", x === b)); } });
    }
    om.back = document.activeElement;
    om.el.hidden = false; root.classList.add("omni-open");
    const q = $("omni-q"); q.value = seed || ""; om.sel = 0;
    loadIndex(); paintOmni();
    q.focus();
  }
  function closeOmni() {
    if (!om.el || om.el.hidden) return;
    om.el.hidden = true; root.classList.remove("omni-open");
    if (om.back && om.back.focus) { try { om.back.focus(); } catch (_) {} }
  }
  function pick(r) {
    if (!r) return;
    remember(r); closeOmni();
    const parts = r.h.split("#");
    if (fileOf(parts[0]) === file) { if (parts[1]) location.hash = parts[1]; return; }      /* already on that instrument */
    go(r.h);
  }
  window.ARCHIVUS_SEARCH = openOmni;
  /* capture phase: the palette owns the keyboard while it is open, and Ctrl/⌘ K works on every page */
  document.addEventListener("keydown", e => {
    const open = om.el && !om.el.hidden;
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === "k" || e.key === "K")) { e.preventDefault(); e.stopPropagation(); if (open) closeOmni(); else openOmni(); return; }
    if (!open) return;
    e.stopPropagation();
    if (e.key === "Escape") { e.preventDefault(); closeOmni(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (om.hits.length) { om.sel = (om.sel + (e.key === "ArrowDown" ? 1 : om.hits.length - 1)) % om.hits.length; paintOmni(); } }
    else if (e.key === "Enter") { e.preventDefault(); pick(om.hits[om.sel]); }
    else if (e.key === "Tab") { e.preventDefault(); }
  }, true);

  /* ───────────── once the page is parsed ───────────── */
  /* ───────────── long views, one section at a time (v11) ─────────────
     The War Room and the Doctrines have reading views that ran to many screens. Any scrolling view
     (.wr-scroll) whose content is cut by section headings (.wr-h, or the Manifesto's .mf-sec) now
     gets a row of section chips pinned to its top and shows one section at a time — the headings
     double as a table of contents. "All" restores the single long page. Nothing is removed from the
     page: the other sections are only hidden, and a link that scrolls to something inside one
     opens that section first. Views re-rendered by their instrument are re-cut automatically. */
  const PG = new WeakMap();
  const pgAll = () => { try { return localStorage.getItem("archivus-pager") === "all"; } catch (_) { return false; } };
  const pgIsBreak = el => el.matches && el.matches(".wr-h, .mf-sec");
  const pgLabel = el => { const hd = el.matches(".mf-sec") && el.querySelector("header"), t = (hd ? Array.from(hd.children).map(c => c.textContent).join(" · ") : el.textContent).replace(/\s+/g, " ").trim().split(" — ")[0]; return t.length > 34 ? t.slice(0, 32).replace(/\s+\S*$/, "") + "…" : t; };
  function pgCut(sec) {
    const box = sec.querySelector(":scope > .dc-doc") || sec, st = PG.get(sec) || { page: 0 };
    const kids = Array.from(box.children).filter(k => !k.classList.contains("pg-bar")), heads = kids.filter(pgIsBreak);
    let bar = sec.querySelector(":scope > .pg-bar");
    if (heads.length < 2) { if (bar) bar.remove(); kids.forEach(k => k.classList.remove("pg-off")); st.obs && st.obs.takeRecords(); return; }
    let g = 0, seen = false; kids.forEach(k => { if (pgIsBreak(k)) { if (seen) g++; seen = true; } k._pg = g; });
    if (st.page !== "all" && !(st.page <= g)) st.page = 0;
    kids.forEach(k => k.classList.toggle("pg-off", st.page !== "all" && k._pg !== st.page));
    if (!bar) { bar = document.createElement("div"); bar.className = "pg-bar"; bar.setAttribute("role", "tablist"); sec.insertBefore(bar, sec.firstChild); }
    bar.innerHTML = heads.map((h, i) => '<button type="button" class="chipbtn' + (i === st.page ? " on" : "") + '" data-pg="' + i + '">' + pgLabel(h).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</button>").join("") +
      '<button type="button" class="chipbtn pg-all' + (st.page === "all" ? " on" : "") + '" data-pg="all" title="Every section on one long page">All</button>';
    PG.set(sec, st);
    st.obs && st.obs.takeRecords();                          /* our own edits are not a re-render */
  }
  function paginate() {
    document.querySelectorAll(".wr-scroll").forEach(sec => {
      if (PG.has(sec)) return;
      const st = { page: pgAll() ? "all" : 0 }; PG.set(sec, st);
      sec.addEventListener("click", e => {
        const b = e.target.closest(".pg-bar [data-pg]"); if (!b) return;
        st.page = b.dataset.pg === "all" ? "all" : +b.dataset.pg;
        try { if (st.page === "all") localStorage.setItem("archivus-pager", "all"); else localStorage.removeItem("archivus-pager"); } catch (_) {}   /* "All" is remembered as a preference */
        pgCut(sec); sec.scrollTop = 0;
      });
      st.obs = new MutationObserver(ms => { if (ms.some(m => m.target === sec || (m.target.classList && m.target.classList.contains("dc-doc") && m.target.parentNode === sec))) pgCut(sec); });
      st.obs.observe(sec, { childList: true, subtree: true });
      pgCut(sec);
    });
    /* a jump to something inside a hidden section opens that section first */
    const siv = Element.prototype.scrollIntoView;
    Element.prototype.scrollIntoView = function () {
      const sec = this.closest && this.closest(".wr-scroll"), st = sec && PG.get(sec);
      if (st) { pgCut(sec); const off = this.closest(".pg-off"); if (off) { st.page = off._pg; pgCut(sec); } }   /* cut first: the view may have just been re-rendered */
      return siv.apply(this, arguments);
    };
  }

  function ready() {
    buildHeader();
    /* the older per-page link buttons are redundant now — hidden, not deleted (no-script fallback) */
    document.querySelectorAll("#bar > a[href], #masthead a[href], #as-bar a[href], #cx-bar a[href]").forEach(a => {
      if (FILES.indexOf(fileOf((a.getAttribute("href") || "").split("#")[0])) >= 0) a.classList.add("legacy-nav");
    });
    document.body.classList.add("has-rail");
    /* overlays that hang below the chrome (the Archive's filter drawer) read its height from here */
    const hdr = $("hdr"), bar = $("bar");
    const setH = () => root.style.setProperty("--chrome-h", ((hdr ? hdr.offsetHeight : 0) + (bar ? bar.offsetHeight : 0)) + "px");
    setH(); window.addEventListener("resize", setH);
    if (window.ResizeObserver && bar) new ResizeObserver(setH).observe(bar);
    glide($("wr-tabs"), "button.on");
    paginate();
    speculate();
    if (document.prerendering) document.addEventListener("prerenderingchange", () => { placePill(true); titleCard(); }, { once: true });
    else titleCard();
  }
  buildHeader();                                             /* runs at the top of <body>: the header exists before first paint */
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ready); else ready();
})();

</script>

  <header id="masthead">
    <div class="sigil" aria-hidden="true"></div>
    <div class="masthead-text">
      <h1>ARCHIVUS · THE CODEX</h1>
      <p class="tagline">every record of the archive, legible — a book bound along the winding path of time</p>
    </div>
    <a id="tx-link" href="index.html">⟵ The Archive</a>
  </header>

  <nav id="cx-bar">
    <button id="cx-toc-btn" class="tool-btn accent">Contents</button>
    <button id="cx-first" class="tool-btn" title="First folio">|◀</button>
    <button id="cx-prev" class="tool-btn" title="Previous spread (←)">◀</button>
    <button id="cx-next" class="tool-btn" title="Next spread (→)">▶</button>
    <button id="cx-last" class="tool-btn" title="Last folio">▶|</button>
    <input id="cx-search" type="search" placeholder="Find a record… ⏎">
    <select id="cx-era"><option value="">All eras</option></select>
    <select id="cx-theme"><option value="">All themes</option></select>
    <select id="cx-region"><option value="">All regions</option></select>
    <a id="pn-link" href="astrolabe.html">Astrolabe</a>

    phases: [
      { n: "The July Crisis", s: "1914-06-28", e: "1914-08-04", d: "Gavrilo Princip shoots the Habsburg heir in Sarajevo. Vienna, armed with Berlin's 'blank cheque', sends Serbia an ultimatum designed to be refused. Russia mobilizes for Serbia, Germany for Austria, France for Russia. Germany's only war plan runs through neutral Belgium — and that brings in Britain. In thirty-seven days a murder becomes a world war." },
      { n: "The war of movement", s: "1914-08-04", e: "1914-11-22", d: "Germany's right wing sweeps through Belgium toward Paris and is stopped on the Marne. Both armies race north trying to outflank each other until they hit the sea at Ypres. In the east, Hindenburg destroys a Russian army at Tannenberg while the Russians maul Austria in Galicia. By November a continuous trench line runs 700 km from Switzerland to the Channel." },
      { n: "Deadlock and a widening war", s: "1914-11-22", e: "1915-12-31", d: "The Ottomans, Italy and Bulgaria join; the war spreads to Gallipoli, the Caucasus, Mesopotamia and Africa. Poison gas appears at Ypres, a U-boat sinks the Lusitania, and the Ottoman government destroys its Armenian population. Every Allied offensive in the west fails, while in the east a German-Austrian breakthrough at Gorlice drives Russia out of Poland and Serbia is overrun." },
      { n: "The year of attrition", s: "1916-01-01", e: "1916-12-31", d: "Verdun, the Somme, the Brusilov offensive: three battles, more than two million casualties, and no decision. Falkenhayn tries to bleed France white; Haig's army loses 57,000 men on a single morning; Brusilov nearly breaks Austria. At Jutland the fleets finally meet and the blockade holds. Romania enters and is crushed. Hindenburg and Ludendorff take control of Germany." },
      { n: "Revolution, mutiny and America", s: "1917-01-01", e: "1918-03-03", d: "Germany gambles on unrestricted submarine warfare and brings the United States into the war. The Tsar falls in March; half the French army mutinies after the Nivelle offensive; the British drown at Passchendaele; Italy breaks at Caporetto. In November the Bolsheviks seize power and sue for peace. At Brest-Litovsk, Russia signs away a third of its population." },
      { n: "Germany's last gamble", s: "1918-03-03", e: "1918-07-18", d: "With Russia out, Ludendorff has a few months of numerical superiority before the Americans arrive in force. Five offensives from March to July tear open the trench lines for the first time since 1914 and reach the Marne again — but they win ground, not the war, and cost Germany nearly a million irreplaceable men." },
      { n: "The Hundred Days and collapse", s: "1918-07-18", e: "1918-11-11", d: "Foch's counterstroke on the Marne, then Amiens — 'the black day of the German Army'. Tanks, aircraft, artillery and infantry finally work together and the Allies advance without pause. Bulgaria quits in September, the Ottomans in October, Austria-Hungary disintegrates, the German fleet mutinies and the Kaiser flees. The guns stop at 11 a.m. on 11 November." },
      { n: "Armistice to Versailles", s: "1918-11-11", e: "1919-06-28", d: "The blockade continues while the victors meet in Paris. New states rise from the wreckage of four empires; the influenza pandemic kills more than the war did. On 28 June 1919 — five years to the day after Sarajevo — Germany signs the Treaty of Versailles in the Hall of Mirrors." }
    ],

      { id: "liege", n: "Battle of Liège", s: "1914-08-05", e: "1914-08-16", at: [50.64,5.57], k: "siege", w: "B", d: "The first battle of the war. Belgium's ring of forts delays the German right wing for days until 42 cm siege howitzers smash them one by one.", f: "Belgium's resistance turns British opinion", u: W + "Battle_of_Li%C3%A8ge" },
      { id: "tannenberg", n: "Battle of Tannenberg", s: "1914-08-26", e: "1914-08-30", at: [53.5,20.1], k: "battle", w: "B", d: "Hindenburg and Ludendorff encircle and destroy Samsonov's Russian Second Army in East Prussia. Samsonov shoots himself; the victors become national idols.", f: "c. 92,000 Russians captured", u: W + "Battle_of_Tannenberg", ar: [6, "war", "Europe", "German Empire", ["ww1", "marne1914"]] },
      { id: "lemberg", n: "Battle of Galicia (Lemberg)", s: "1914-08-23", e: "1914-09-11", at: [49.84,24.03], k: "battle", w: "A", d: "Russia routs the Austro-Hungarian armies and takes Lemberg. The Habsburg army loses much of its professional core in three weeks and never fully recovers.", f: "c. 400,000 Austro-Hungarian casualties", u: W + "Battle_of_Galicia" },
      { id: "marne1914", n: "First Battle of the Marne", s: "1914-09-05", e: "1914-09-12", at: [48.95,3.3], k: "battle", w: "A", d: "With the Germans 40 km from Paris, Joffre turns his retreating armies and strikes the gap between two German armies. The Schlieffen Plan fails; Germany will have to fight a long two-front war.", f: "c. 2 million men engaged · c. 500,000 casualties", u: W + "First_Battle_of_the_Marne", ar: [8, "war", "Europe", "France", ["ww1", "franzferdinand", "verdun"]] },
      { id: "ypres1", n: "First Battle of Ypres", s: "1914-10-19", e: "1914-11-22", at: [50.85,2.88], k: "battle", w: "A", d: "The last attempt to turn a flank. The old British regular army is all but destroyed holding the town; the trench line is now continuous to the sea.", f: "End of the war of movement in the west", u: W + "First_Battle_of_Ypres" },
      { id: "tsingtao", n: "Siege of Tsingtao", s: "1914-10-31", e: "1914-11-07", at: [36.07,120.38], k: "siege", w: "A", d: "Japanese and British troops take Germany's naval base in China — the war's only major battle in East Asia, and the seed of the Shandong dispute.", u: W + "Siege_of_Tsingtao" },
      { id: "falklands1914", n: "Battle of the Falkland Islands", s: "1914-12-08", at: [-52.5,-56.5], k: "naval", w: "A", d: "British battlecruisers hunt down von Spee's cruiser squadron, which had destroyed a British force off Coronel a month earlier.", f: "4 German cruisers sunk", u: W + "Battle_of_the_Falkland_Islands" },
      { id: "sarikamish", n: "Battle of Sarikamish", s: "1914-12-22", e: "1915-01-17", at: [40.33,42.57], k: "battle", w: "A", d: "Enver Pasha's winter offensive into the Russian Caucasus freezes to death in the mountains. He blames the Armenians.", f: "Most of an Ottoman army of c. 100,000 lost", u: W + "Battle_of_Sarikamish" },
      { id: "ypres2", n: "Second Ypres — poison gas", s: "1915-04-22", e: "1915-05-25", at: [50.9,2.93], k: "battle", w: "—", d: "Germany releases 170 tonnes of chlorine against French colonial and Canadian troops: the first large-scale use of lethal gas. Within months both sides are using it.", f: "First mass chemical attack", u: W + "Second_Battle_of_Ypres", ar: [6, "war", "Europe", null, ["ww1", "somme"]] },
      { id: "armenian1915", n: "The Armenian Genocide begins", s: "1915-04-24", at: [41.01,28.98], k: "atrocity", ref: "armenian", d: "Armenian leaders are rounded up in Constantinople; deportations and massacres across Anatolia follow. Around a million Armenians are killed.", u: W + "Armenian_genocide" },
      { id: "gallipoli", n: "Gallipoli campaign", s: "1915-02-19", e: "1916-01-09", at: [40.2,26.35], k: "battle", w: "B", d: "An Allied attempt to force the Dardanelles and knock out the Ottomans ends in eight months of slaughter on the beaches. It makes the reputation of Mustafa Kemal and haunts Australia and New Zealand.", f: "c. 500,000 casualties, both sides", u: W + "Gallipoli_campaign", ar: [6, "war", "West Asia / Middle East", "Ottoman Empire", ["ww1", "ataturk"]] },
      { id: "lusitania", n: "Sinking of the Lusitania", s: "1915-05-07", at: [51.42,-8.55], k: "naval", d: "U-20 torpedoes the Cunard liner off Ireland. 1,198 die, 128 of them American. Germany backs off unrestricted submarine warfare — for two years.", f: "1,198 dead", u: W + "Sinking_of_the_RMS_Lusitania", ar: [6, "war", "Europe", null, ["ww1", "usentry1917", "titanic"]] },
      { id: "gorlice", n: "Gorlice–Tarnów offensive", s: "1915-05-02", e: "1915-06-22", at: [49.66,21.16], k: "battle", w: "B", d: "Mackensen's breakthrough in Galicia unhinges the whole Russian front. In the 'Great Retreat' that follows, Russia loses Poland, Lithuania and some two million men.", f: "Front moves up to 500 km east", u: W + "Gorlice%E2%80%93Tarn%C3%B3w_offensive" },
      { id: "isonzo", n: "The Isonzo battles", s: "1915-06-23", e: "1917-09-12", at: [45.98,13.62], k: "battle", w: "—", d: "Cadorna attacks the same river line eleven times in two years, gaining a few kilometres of limestone for half of Italy's total war dead.", f: "11 offensives · c. 1 million casualties", u: W + "Battles_of_the_Isonzo" },
      { id: "kut", n: "Siege of Kut", s: "1915-12-07", e: "1916-04-29", at: [32.5,45.82], k: "siege", w: "B", d: "After overreaching toward Baghdad, Townshend's Anglo-Indian division is besieged for 147 days and starved into surrender.", f: "c. 13,000 surrender", u: W + "Siege_of_Kut" },
      { id: "verdun", n: "Battle of Verdun", s: "1916-02-21", e: "1916-12-18", at: [49.2,5.42], k: "battle", w: "A", d: "Falkenhayn attacks a fortress France cannot abandon, intending to bleed its army to death. For 300 days the two armies grind each other down over a few square kilometres. 'They shall not pass.'", f: "c. 700,000 casualties · c. 300,000 dead", u: W + "Battle_of_Verdun", ar: [8, "war", "Europe", "France", ["ww1", "somme", "marne1914"]] },
      { id: "jutland", n: "Battle of Jutland", s: "1916-05-31", e: "1916-06-01", at: [56.7,5.9], k: "naval", w: "—", d: "The only full clash of the dreadnought fleets: 250 ships in the North Sea. Britain loses more ships and men, but the German fleet returns to port and never challenges the blockade again.", f: "Britain: 14 ships, 6,094 dead · Germany: 11 ships, 2,551 dead", u: W + "Battle_of_Jutland", ar: [6, "war", "Europe", null, ["ww1", "lusitania"]] },
      { id: "brusilov", n: "Brusilov offensive", s: "1916-06-04", e: "1916-09-20", at: [50.75,25.33], k: "battle", w: "A", d: "Russia's greatest feat of arms: a broad-front attack without a long bombardment shatters the Austro-Hungarian line. It forces Germany to strip Verdun — and costs Russia so much that it feeds the revolution.", f: "Over 1 million casualties per side (est.)", u: W + "Brusilov_offensive", ar: [6, "war", "Europe", "Russian Empire", ["ww1", "russianrev"]] },
      { id: "arabrevolt", n: "The Arab Revolt", s: "1916-06-10", e: "1918-10-01", at: [21.42,39.83], k: "revolt", w: "A", d: "Sharif Hussein of Mecca rises against the Ottomans on a British promise of an Arab kingdom. His son Faisal, advised by T. E. Lawrence, takes Aqaba and rides into Damascus — as Britain and France quietly divide the same lands between themselves.", u: W + "Arab_Revolt", ar: [6, "war", "West Asia / Middle East", null, ["ww1", "balfour"]] },
      { id: "somme", n: "Battle of the Somme", s: "1916-07-01", e: "1916-11-18", at: [50.02,2.7], k: "battle", w: "—", d: "The British army's bloodiest day — 57,470 casualties, 19,240 of them dead, before nightfall on 1 July — opens a 141-day offensive that advances ten kilometres. Tanks go into action for the first time on 15 September.", f: "Over 1 million casualties", u: W + "Battle_of_the_Somme", ar: [8, "war", "Europe", null, ["ww1", "verdun"]] },
      { id: "bucharest1916", n: "Fall of Bucharest", s: "1916-12-06", at: [44.43,26.1], k: "battle", w: "B", d: "Falkenhayn and Mackensen converge on Romania from the mountains and the Danube. Its oil and grain keep the Central Powers fighting.", u: W + "Romania_in_World_War_I" },
      { id: "baghdad1917", n: "Fall of Baghdad", s: "1917-03-11", at: [33.31,44.36], k: "battle", w: "A", d: "Maude's rebuilt army avenges Kut and takes the city the Ottomans had held for four centuries.", u: W + "Fall_of_Baghdad_(1917)" },
      { id: "febrev", n: "February Revolution — the Tsar abdicates", s: "1917-03-08", e: "1917-03-15", at: [59.94,30.31], k: "revolt", ref: "russianrev", d: "Bread riots in Petrograd become a mutiny. Nicholas II abdicates; a Provisional Government tries to keep Russia in the war.", u: W + "February_Revolution" },
      { id: "usentry1917", n: "The United States enters the war", s: "1917-04-06", at: [38.9,-77.04], k: "diplo", d: "Germany resumes sinking neutral ships on sight (1 Feb) and is caught offering Mexico the American Southwest in the Zimmermann Telegram. Wilson asks Congress for war 'to make the world safe for democracy'.", f: "2 million U.S. troops in France by Nov 1918", u: W + "American_entry_into_World_War_I", ar: [8, "war", "North America", "United States", ["ww1", "lusitania", "armistice1918"]] },
      { id: "arras", n: "Arras and Vimy Ridge", s: "1917-04-09", e: "1917-05-16", at: [50.38,2.77], k: "battle", w: "A", d: "The Canadian Corps storms Vimy Ridge in a model set-piece attack; the wider offensive bogs down.", u: W + "Battle_of_Arras_(1917)" },
      { id: "nivelle", n: "Nivelle offensive and the mutinies", s: "1917-04-16", e: "1917-05-09", at: [49.44,3.62], k: "battle", w: "B", d: "Nivelle promises a breakthrough on the Chemin des Dames in 48 hours and delivers 187,000 casualties. Units in half the French divisions refuse to attack; Pétain restores the army with leave, food and no more offensives.", u: W + "Nivelle_offensive" },
      { id: "passchendaele", n: "Passchendaele (Third Ypres)", s: "1917-07-31", e: "1917-11-10", at: [50.9,3.02], k: "battle", w: "—", d: "Haig's Flanders offensive drowns in the wettest autumn in decades. Men and mules vanish in shell-holes of liquid mud for eight kilometres of ground.", f: "c. 500,000 casualties, both sides", u: W + "Battle_of_Passchendaele", ar: [6, "war", "Europe", null, ["ww1", "somme"]] },

      { id: "octrev", n: "October Revolution", s: "1917-11-07", at: [59.95,30.33], k: "revolt", ref: "russianrev", d: "Lenin — sent home through Germany in a sealed train — overthrows the Provisional Government. His first decree is on peace.", u: W + "October_Revolution" },
      { id: "cambrai", n: "Battle of Cambrai", s: "1917-11-20", e: "1917-12-07", at: [50.17,3.23], k: "battle", w: "—", d: "476 British tanks attack without a preliminary bombardment and break the Hindenburg Line in hours — the shape of battles to come. A German counter-attack retakes the ground.", f: "First mass tank attack", u: W + "Battle_of_Cambrai_(1917)" },
      { id: "jerusalem1917", n: "Jerusalem falls to Allenby", s: "1917-12-09", at: [31.78,35.22], k: "battle", w: "A", d: "After breaking the Gaza–Beersheba line, the Egyptian Expeditionary Force ends four centuries of Ottoman rule in the city. Allenby enters on foot. The Balfour Declaration is five weeks old.", u: W + "Battle_of_Jerusalem", ar: [5, "war", "West Asia / Middle East", "British Empire", ["ww1", "balfour", "arabrevolt"]] },
      { id: "brestlitovsk", n: "Treaty of Brest-Litovsk", s: "1918-03-03", at: [52.1,23.7], k: "diplo", d: "Bolshevik Russia buys peace by surrendering Poland, the Baltic lands, Finland and Ukraine — a third of its population and most of its coal. Germany can now move fifty divisions west.", f: "Annulled by the armistice eight months later", u: W + "Treaty_of_Brest-Litovsk", ar: [7, "law", "Europe", null, ["ww1", "russianrev", "springoffensive"]] },

      { id: "megiddo", n: "Battle of Megiddo", s: "1918-09-19", e: "1918-09-25", at: [32.58,35.18], k: "battle", w: "A", d: "Allenby's cavalry and aircraft destroy three Ottoman armies in a week. Damascus falls on 1 October, Aleppo on the 25th.", u: W + "Battle_of_Megiddo_(1918)" },
      { id: "vardar", n: "Vardar offensive — Bulgaria quits", s: "1918-09-15", e: "1918-09-29", at: [41.03,21.93], k: "battle", w: "A", d: "Serbian and French troops break the Macedonian front at Dobro Pole. Bulgaria signs an armistice within two weeks — the first crack in the Central Powers.", u: W + "Vardar_offensive" },
      { id: "meuseargonne", n: "Meuse–Argonne offensive", s: "1918-09-26", e: "1918-11-11", at: [49.3,5.03], k: "battle", w: "A", d: "The largest battle in American history to that date: 1.2 million U.S. soldiers fight through the Argonne forest toward Sedan. Captain Harry Truman commands an artillery battery.", f: "26,277 Americans killed", u: W + "Meuse%E2%80%93Argonne_offensive" },
      { id: "vittorioveneto", n: "Battle of Vittorio Veneto", s: "1918-10-24", e: "1918-11-03", at: [45.98,12.3], k: "battle", w: "A", d: "A year to the day after Caporetto, Italy crosses the Piave. The Austro-Hungarian army disintegrates along with its empire.", u: W + "Battle_of_Vittorio_Veneto" },
      { id: "kiel", n: "Kiel mutiny — the Kaiser falls", s: "1918-11-03", e: "1918-11-09", at: [54.32,10.13], k: "revolt", d: "Ordered out for a last suicidal battle, the High Seas Fleet mutinies. Revolution spreads to Berlin; a republic is proclaimed and Wilhelm II flees to the Netherlands.", u: W + "Kiel_mutiny" },
