.tiles2 span { font: 9.5px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 5px; }
.tiles2 em { font: normal 11.5px/1.45 var(--sans); color: #a8a494; display: block; margin-top: 5px; }
.chart { width: 100%; display: block; background: var(--obsidian-2); border: 1px solid var(--line); border-radius: 6px; }
.chart text { font: 10px var(--mono); fill: #8d96af; }
.chart .gl { stroke: rgba(255,255,255,.06); } .chart .lab { font: 10.5px var(--display); fill: #d6d1c2; letter-spacing: .04em; }
.chart .mk { stroke: rgba(232,196,85,.4); stroke-dasharray: 2 4; } .chart .mkt { fill: rgba(232,196,85,.85); font-size: 9.5px; }
.chart .hit { cursor: pointer; } .chart .hit:hover { filter: brightness(1.35); }
.cleg { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 11px var(--display); color: var(--paper-dim); margin: 8px 0 4px; }
.cleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; } 
.mv { display: grid; grid-template-columns: minmax(96px, 150px) 1fr 52px; gap: 4px 9px; align-items: center; font-size: 12.5px; }
.mv button { background: none; border: 0; color: var(--paper); text-align: right; cursor: pointer; font: 12.5px var(--display); padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv button:hover { color: var(--gold-bright); }
.mv .tr { height: 9px; background: #151a27; border-radius: 2px; overflow: hidden; } .mv .tr i { display: block; height: 100%; border-radius: 2px; }
.mv span { font: 11px var(--mono); }
.tl { display: grid; grid-template-columns: max-content 1fr; gap: 0 16px; max-width: 1040px; }
.tl .d { font: 11px var(--mono); color: var(--gold-bright); padding: 10px 0; border-bottom: 1px solid var(--line-faint); text-align: right; white-space: nowrap; }
.tl .t { padding: 9px 0 10px; border-bottom: 1px solid var(--line-faint); font-size: 13px; line-height: 1.58; color: #cfc9b8; }
.tl .t b { font-family: var(--display); font-weight: 600; color: var(--paper); margin-right: 8px; font-size: 13.5px; }
.tl .t .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
.tl .t a, .srcs a, .rec .st a { color: var(--gold); text-decoration: none; border-bottom: 1px dotted var(--gold-dim); font: 10.5px var(--mono); margin-left: 6px; white-space: nowrap; }
.tl .yr { grid-column: 1 / -1; font: 600 15px var(--engraved); letter-spacing: .2em; color: var(--gold-bright); padding: 20px 0 5px; border-bottom: 1px solid var(--gold-dim); }
.rec .st { padding: 10px 14px; font-size: 13px; line-height: 1.6; color: var(--paper); border-bottom: 1px solid var(--line); }
.rec .who { margin-left: auto; font: 10.5px var(--mono); color: #8d96af; text-align: right; }
.rec ul { margin: 0; padding-left: 16px; } .rec li { margin-bottom: 6px; }
.rec .claim { padding: 11px 14px; font: 14px/1.6 Georgia, "Times New Roman", serif; color: #f1ecdc; border-bottom: 1px solid var(--line); }
.rec footer b { color: var(--gold); font: 9.5px var(--display); letter-spacing: .18em; text-transform: uppercase; margin-right: 8px; }
.rec footer.w { font: 12px/1.6 var(--sans); color: #a8a494; }
.srcs { font: 11.5px/1.9 var(--sans); color: #a8a494; max-width: 1040px; } .srcs a { font-size: 11px; margin: 0 14px 0 0; }
.olist { max-width: 980px; padding-left: 20px; } .olist li { font-size: 13.5px; line-height: 1.62; color: #cfc9b8; margin-bottom: 8px; }
.sp { display: grid; grid-template-columns: max-content 1fr; gap: 0 16px; max-width: 980px; }

.sp dd { font-size: 13px; line-height: 1.55; color: #cfc9b8; padding: 7px 0 8px; border-bottom: 1px solid var(--line-faint); }
.parts { width: 100%; border-collapse: collapse; font-size: 12.5px; max-width: 1040px; }
.parts th { font: 9.5px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--gold-dim); }
.parts th:first-child { text-align: left; }
.parts td { padding: 7px 10px; border-bottom: 1px solid var(--line-faint); color: #cfc9b8; font: 11.5px var(--mono); text-align: right; }
.parts td:first-child { font: 13px var(--sans); text-align: left; color: var(--paper); }
.parts td.chg { font-weight: 600; }

/* the coups */
.cu-strip { width: 100%; display: block; }
.cu-dot { cursor: pointer; stroke: #0a0c12; stroke-width: 1; transition: opacity .18s; }
.cu-dot:hover { stroke: #fff; } .cu-dot.sel { stroke: var(--gold-bright); stroke-width: 2.2; } .cu-dot.dim { opacity: .12; }
.cu-dot.fail { fill-opacity: .18; stroke-width: 1.6; }
.cu-row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 0 14px; padding: 9px 0 10px; border-bottom: 1px solid var(--line-faint); cursor: pointer; }

.cu-row .y { font: 600 14px var(--engraved); color: var(--gold-bright); text-align: right; padding-top: 1px; }
.cu-row b { font: 600 13.5px var(--display); color: var(--paper); margin-right: 8px; }

.cu-row .tag { margin-top: 5px; }
.tag.ok { border-color: rgba(73,201,184,.5); color: var(--free); } .tag.no { border-color: rgba(162,59,51,.9); color: #ff9a8c; } .tag.br { border-color: var(--gold-dim); color: var(--gold-bright); }
.mx { border-collapse: collapse; font-size: 12px; } 
.mx th { font: 9.5px var(--display); letter-spacing: .08em; color: var(--gold); padding: 5px 7px; text-align: center; vertical-align: bottom; max-width: 92px; line-height: 1.3; font-weight: 500; }
.mx th:first-child, .mx td:first-child { text-align: left; white-space: nowrap; max-width: none; }
.mx td { padding: 5px 7px; border-top: 1px solid var(--line-faint); text-align: center; color: #cfc9b8; }
.mx td:first-child { color: var(--paper); font-family: var(--display); }
.mx tr.go { cursor: pointer; } .mx tr.go:hover td { background: rgba(201,162,39,.07); }
.mx .y { font: 11px var(--mono); color: var(--gold-bright); }
.mx .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.mx tfoot td { border-top: 1px solid var(--gold-dim); font: 11px var(--mono); color: var(--gold-bright); }
.mx-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--obsidian-2); -webkit-overflow-scrolling: touch; }
.trend { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.trend > div { background: var(--obsidian-2); border: 1px solid var(--line); border-left: 2px solid var(--tc, var(--gold)); border-radius: 5px; padding: 12px 14px; }
.trend b { font: 600 13.5px var(--display); color: var(--paper); display: block; margin-bottom: 5px; }
.trend b small { font: 11px var(--mono); color: var(--gold-bright); margin-right: 8px; }
.trend p { font-size: 12.5px; line-height: 1.58; color: #cfc9b8; }
.heat td.c { font: 11px var(--mono); min-width: 34px; color: var(--paper); cursor: pointer; }
.heat td.c:hover { outline: 1px solid var(--gold); }

@media (max-width: 860px) {
  .rl-map { height: 56dvh; flex: none; } #nc-wrap { height: 86vw; min-height: 340px; max-height: 68dvh; flex: none; } #lg-wrap { max-height: 74dvh; flex: none; }
  .two { grid-template-columns: 1fr; } .cc-big b { font-size: 22px; }
  .tl, .sp { grid-template-columns: 1fr; } .tl .d { text-align: left; border-bottom: 0; padding-bottom: 0; } .sp dt { border-bottom: 0; padding-bottom: 0; }
  .rec .who { display: none; } .cu-row { grid-template-columns: 54px minmax(0, 1fr); gap: 0 10px; }
  .lg td.hide-s, .lg th.hide-s { display: none; }
}

/* ---------- one screen per section: a chip row, then a pane that fills the view ---------- */
.secs { gap: 6px; } .secs .sec-t { font: 600 13px var(--engraved); letter-spacing: .2em; color: var(--gold-bright); margin-right: 10px; white-space: nowrap; }
.secs .sec-n { margin-left: auto; font: 10.5px var(--mono); color: #66708c; }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 14px clamp(12px, 2vw, 26px) 14px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
.pane .lead { font-size: 13.5px; line-height: 1.6; color: #cfc9b8; max-width: 120ch; margin: 0; }
.pane .tiles2 { margin: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; flex: 1; min-height: 0; }
.grid2.even { grid-template-columns: 1fr 1fr; } .grid2.md { grid-template-columns: minmax(230px, .8fr) minmax(0, 2fr); }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: 10px; }
.col.scroll { overflow: auto; }
.chart-host { flex: 1; min-height: 150px; position: relative; }
.chart-host svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pane .callout { margin: 0; max-width: none; font-size: 12.5px; line-height: 1.55; }
.pane h4 { font: 600 12px var(--engraved); letter-spacing: .2em; color: var(--gold-bright); text-transform: uppercase; margin: 0; }
.pane h4 small { font: 400 10.5px var(--mono); letter-spacing: 0; text-transform: none; color: #66708c; margin-left: 10px; }
.pane .parts td { padding: 5px 9px; } .pane .parts td:first-child { font-size: 12.5px; }
.pane .tbl td { padding: 6px 10px; } 
.mlist { display: flex; flex-direction: column; gap: 4px; overflow: auto; min-height: 0; }
.mlist button { text-align: left; background: var(--obsidian-2); border: 1px solid var(--line); border-left: 2px solid var(--line); border-radius: 4px; color: var(--paper); cursor: pointer; padding: 8px 11px; font: 600 13px var(--display); transition: all .15s; }
.mlist button small { display: block; font: 400 11.5px/1.45 var(--sans); color: #8d96af; margin-top: 3px; }
.mlist button:hover { border-color: var(--gold-dim); } .mlist button.on { border-color: var(--gold); border-left-color: var(--gold-bright); background: rgba(201,162,39,.1); }
.picks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.picks button { text-align: left; background: var(--obsidian-2); border: 1px solid var(--line); border-top: 2px solid var(--line); border-radius: 5px; color: #cfc9b8; cursor: pointer; padding: 10px 12px 11px; font: 12.5px/1.5 var(--sans); transition: all .15s; }
.picks button b { display: block; font: 600 13.5px var(--display); color: var(--paper); margin-bottom: 2px; } .picks button small { display: block; font: 10px var(--mono); color: #8d96af; margin-bottom: 6px; }
.picks button:hover { border-color: var(--gold-dim); } .picks button.on { border-color: var(--gold); border-top-color: var(--gold-bright); background: rgba(201,162,39,.09); color: var(--paper); }
.pane .rec { margin: 0; } .pane .rec .cols.c3 { grid-template-columns: 1fr 1fr .8fr; }
.tl-card { background: var(--obsidian-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px 18px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 18px; align-items: start; }
.tl-card .sd-t { font-size: 20px; } .tl-card .sd-p { font-size: 14.5px; max-width: 110ch; }
.tl-card .step { background: none; border: 1px solid var(--line); border-radius: 50%; width: 36px; height: 36px; color: var(--gold); cursor: pointer; font-size: 15px; align-self: center; }
.tl-card .step:hover { border-color: var(--gold); color: var(--gold-bright); }
.ev-d { cursor: pointer; stroke: #0a0c12; stroke-width: 1.2; } .ev-d:hover { stroke: #fff; } .ev-d.sel { stroke: var(--gold-bright); stroke-width: 2.6; } .ev-d.dim { opacity: .2; }
.lane-t { font: 10.5px var(--display); fill: #a8a494; letter-spacing: .04em; cursor: pointer; } .lane-t.on { fill: var(--gold-bright); font-weight: 600; }
.pane .srcs { max-width: none; font-size: 11px; line-height: 1.8; }
.pane .olist { margin: 0; max-width: none; } .pane .olist li { font-size: 13px; margin-bottom: 7px; }
.pane .sp { max-width: none; } .pane .sp dd { font-size: 12.5px; }
.pane .mv { grid-template-columns: minmax(96px, 170px) 1fr 52px; gap: 3px 9px; }
.pane .mx td, .pane .mx th { padding: 4px 7px; }
/* the map: year plate and the rank ribbon */
.rl-year { left: 10px; top: 10px; padding: 5px 10px 5px 6px; } .rl-year.off { display: none; }
.rank { flex: 0 0 auto; padding: 6px 12px 5px; border-top: 1px solid var(--line-faint); background: #0a0c12; }
.rk-bars { display: flex; align-items: flex-end; gap: 1px; height: 46px; }
.rk-bars i { flex: 1 1 0; min-width: 0; border-radius: 1px 1px 0 0; cursor: pointer; min-height: 3px; }
.rk-bars i:hover { outline: 1px solid #fff; } .rk-bars i.sel { outline: 2px solid var(--gold-bright); outline-offset: 1px; }
.rk-k { display: flex; justify-content: space-between; gap: 12px; font: 9.5px var(--mono); color: #66708c; margin-top: 4px; white-space: nowrap; overflow: hidden; }
@media (max-width: 860px) {
  .pane { overflow: visible; flex: none; } .grid2, .grid2.even, .grid2.md { grid-template-columns: 1fr; } .picks { grid-template-columns: 1fr; }
  .chart-host { flex: none; height: 240px; } .pane .rec .cols.c3 { grid-template-columns: 1fr; } .tl-card { grid-template-columns: 1fr; } .tl-card .step { display: none; }
  .secs .sec-t { flex: 1 1 100%; } .rk-bars { height: 34px; }
}

/* ---------- the coups: roll, studies, dashboard ---------- */
.cu-list { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--obsidian-2); }
.cu-li { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 0 10px; align-items: baseline; padding: 5px 10px; border-bottom: 1px solid var(--line-faint); cursor: pointer; font-size: 12.5px; color: #cfc9b8; }
.cu-li:hover { background: rgba(201,162,39,.07); } .cu-li.sel { background: rgba(201,162,39,.14); }
.cu-li .y { font: 11px var(--mono); color: var(--gold-bright); text-align: right; } .cu-li b { font: 500 13px var(--display); color: var(--paper); margin-right: 7px; } .cu-li small { color: #7d87a1; font-size: 11px; }
.okd { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid; vertical-align: -1px; }
.okd.o1 { background: currentColor; } .okd.o2 { background: linear-gradient(90deg, currentColor 50%, transparent 50%); } 
.heat { width: 100%; } .heat th { cursor: pointer; } .heat th:hover { color: var(--gold-bright); } .heat th.on, .heat td.on:first-child { color: var(--gold-bright); }
.heat td.c.sel { outline: 2px solid var(--gold-bright); outline-offset: -2px; } .heat td:first-child { cursor: pointer; }
.heat td.z { color: #2a3145; cursor: default; }
.rt { display: inline-block; min-width: 16px; text-align: center; font: 600 10px var(--mono); color: #0a0c12; background: #8d96af; border-radius: 3px; padding: 1px 3px; }
.cond { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.cond > div { background: var(--obsidian-2); border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px 8px; min-width: 0; }
.cond b { font: 600 11.5px var(--display); color: var(--paper); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cond .bar3 { display: grid; grid-template-columns: 30px 1fr 30px; gap: 2px 6px; align-items: center; font: 9.5px var(--mono); color: #8d96af; margin-top: 5px; }
.cond .bar3 .tr { height: 6px; background: #1a2030; border-radius: 3px; overflow: hidden; } .cond .bar3 .tr i { display: block; height: 100%; border-radius: 3px; }
.dash { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 10px; flex: 1; min-height: 0; }
.dash > div { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--obsidian-2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px 8px; }
.dash h4 { font-size: 11px; letter-spacing: .16em; } .dash p { font: 11.5px/1.45 var(--sans); color: #a8a494; margin: 4px 0 0; }
.dash .chart-host { min-height: 70px; } .dash .chart { background: none; border: 0; }
.dash p b { color: var(--paper); font-weight: 600; }
.pane .trend { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } .pane .trend > div { padding: 10px 12px; } .pane .trend p { font-size: 12px; line-height: 1.5; }
.ag { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.ag button { text-align: left; background: var(--obsidian-2); border: 1px solid var(--line); border-left: 2px solid #9a7fd1; border-radius: 4px; color: #cfc9b8; cursor: pointer; padding: 8px 11px; font: 12px/1.45 var(--sans); }
.ag button b { display: block; font: 600 13px var(--display); color: var(--paper); } .ag button small { font: 10.5px var(--mono); color: var(--gold-bright); margin-right: 8px; } .ag button:hover { border-color: var(--gold-dim); }
.yb { cursor: pointer; } .yb:hover rect { filter: brightness(1.4); } .yb.sel rect.bg { fill: rgba(232,196,85,.16); }
@media (max-width: 1250px) { .cond { grid-template-columns: repeat(4, minmax(0, 1fr)); } .pane .trend { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .dash { grid-template-columns: 1fr; grid-auto-rows: auto; } .dash .chart-host { height: 170px; flex: none; } .pane .trend, .cond { grid-template-columns: 1fr 1fr; } .cu-list { max-height: 60dvh; flex: none; } #ro-strip { height: 300px; flex: none !important; } }
.chart text.lane-t { font: 10.5px var(--display); letter-spacing: .03em; }
.heat { table-layout: fixed; } .heat th { font-size: 9px; letter-spacing: .02em; padding: 3px 2px 5px; } .heat th:first-child, .heat td:first-child { width: 118px; }
.heat td { padding: 0 !important; height: 21px; } .heat td:first-child { padding: 0 6px !important; font-size: 11.5px; }
.cases { width: 100%; table-layout: fixed; } .cases th, .cases td { padding: 3px 4px !important; }
.cases th:first-child, .cases td:first-child { width: 46px; } .cases th:nth-child(3), .cases td:nth-child(3) { width: 24px; } .cases th:last-child, .cases td:last-child { width: 22px; }
.cases .f { width: 27px; font: 8.5px var(--mono); letter-spacing: 0; }

.cases th.nm { color: var(--gold); }


/* ---- the United States: the long arc (v13.1) ---- */

.chart text.era-t { font: 9px var(--display); letter-spacing: .03em; text-transform: uppercase; fill: #a8a494; cursor: pointer; } .chart text.era-t:hover, .chart text.era-t.on { fill: var(--gold-bright); }
.strip-scroll { min-width: 0; } .chips.tp { gap: 5px; } .chips.tp .chipbtn { font-size: 11.5px; text-transform: none; letter-spacing: 0; }
.rec header .who { font-size: 11px; }
@media (max-width: 1100px) { .strip-scroll { overflow-x: auto; } .strip-scroll .chart-host { min-width: 980px; } }
.pane p.srcs { display: flex; flex-wrap: wrap; gap: 4px 2px; } .pane p.srcs a { white-space: normal; }

/* the seizure map in the Coups' two studies (v17) */
.sz-bar { padding: 0; gap: 8px 16px; flex-wrap: wrap; align-items: center; border: 0; }

:root:where([data-k]){--obsidian:var(--k0);--obsidian-2:var(--k1);--obsidian-3:var(--k2);--paper:var(--k3);--paper-dim:var(--k4);--gold:var(--k5);--gold-bright:var(--k6);--gold-dim:var(--k7);--indigo:var(--k8);--line:var(--k9);--line-faint:var(--k10);--panel-bg:var(--k11)}

    var(--obsidian);color:var(--k3)}

/* ---- src/themes-extra.css ---- */
/* ============================================================
   ARCHIVUS — colourways, by hand. Appended verbatim to the generated src/themes.css
   by tools/build-themes.js. Two kinds of thing live here and nothing else:
     1. the colourway switch itself — its swatches show the three pages as they are,
        so they must NOT pass through the rule;
     2. the few places where the rule needs help, each with its reason.
   ============================================================ */
#tone { flex: 0 0 auto; align-self: center; display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 0 8px; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--obsidian-3); }
#tone button { width: 14px; height: 14px; border-radius: 50%; padding: 0; cursor: pointer; border: 1px solid #868b98; transition: transform .15s; }
#tone button:hover { transform: scale(1.18); }
#tone button[data-tone="blue"] { background: linear-gradient(135deg, #1d2f57 50%, #0a0c12 50%); }
#tone button[data-tone="black"] { background: #000; }
#tone button[data-tone="white"] { background: #fff; }
#tone button.on { box-shadow: 0 0 0 2px var(--obsidian-3), 0 0 0 3.5px var(--gold); }
#tone button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
/* a narrow header shows only the current swatch; pressing it steps to the next colourway */
@media (max-width: 1700px) {
  #tone { gap: 0; padding: 0 7px; margin: 0 8px 0 6px; } #tone button:not(.on) { display: none; }
  /* alone, a black disc on black or a white one on white says nothing: the lone button shows all three, and a gold rim */
  #tone button.on { background: conic-gradient(from -60deg, #1d2f57 0 33.4%, #fff 0 66.7%, #000 0); border-color: var(--gold); box-shadow: none; width: 15px; height: 15px; }
}
@media (max-width: 935px) { #tone { border: 0; background: none; padding: 0 4px; margin: 0 4px 0 0; } }

/* ---------- exceptions: where the general rule is not enough ---------- */
/* on white an accent is already deepened to hold 4.5:1; fading it again would undo that */
html[data-theme="white"] .as-blood text,
html[data-theme="white"] .pn-plate-title { opacity: 1; }

    { id: "iran", n: "United States & Israel – Iran", rg: "Middle East", lv: 4, tr: "up", trBy: "CFR", ty: "War between states", since: 2026, at: [27.0, 56.2], where: ["Iran"],

    { id: "syria", n: "Syria after Assad", rg: "Middle East", lv: 4, tr: "flat", trBy: "CFR", ty: "Post-war violence and occupation", since: 2011, at: [35.2, 38.6], where: ["Syria"],

    { id: "sudan", n: "Sudan: army – Rapid Support Forces", rg: "Africa", lv: 5, tr: "up", trBy: "CFR", ty: "Civil war", since: 2023, at: [13.2, 29.4], where: ["Sudan"],

    { id: "sahel", n: "The Sahel: JNIM and Islamic State against the juntas", rg: "Africa", lv: 5, tr: "up", trBy: "CFR", ty: "Insurgency", since: 2012, at: [14.3, -2.6], where: ["Mali", "Burkina Faso", "Niger"],

  <script>
/* ============================================================
   ARCHIVUS — shared kit for the Realms and the Coups (v11).
   Small helpers both instruments use: escaping, colour ramps,
   the year slider, hash state, tooltips, a pan-and-zoom world
   map drawn from assets/world2.js, and a few SVG chart parts.
   ============================================================ */
(function () {
  "use strict";
  const K = window.ARCHIVUS_KIT = {};
  const NS = "http://www.w3.org/2000/svg";
  K.$ = id => document.getElementById(id);
  K.esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  K.REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  K.MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.fmt = (v, d) => v == null ? "—" : (+v).toFixed(d == null ? 2 : d);
  K.signed = (v, d) => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d == null ? 2 : d);
  K.pop = p => p == null ? "—" : p >= 1e9 ? (p / 1e9).toFixed(2) + " bn" : p >= 1e6 ? (p / 1e6).toFixed(p >= 1e7 ? 0 : 1) + " m" : Math.round(p / 1e3) + " k";
  K.link = (u, t) => '<a href="' + K.esc(u) + '" target="_blank" rel="noopener">' + K.esc(t) + "</a>";
  /* a host name to show beside a source link */
  K.host = u => { try { return new URL(u).hostname.replace(/^www\.|^en\./, ""); } catch (_) { return "source"; } };

  /* colour ramp through hex stops; t in 0…1 */
  K.ramp = stops => {
    const rgb = stops.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
    return t => {
      t = K.clamp(t, 0, 1) * (rgb.length - 1);
      const i = Math.min(rgb.length - 2, Math.floor(t)), f = t - i, a = rgb[i], b = rgb[i + 1];
      return "rgb(" + [0, 1, 2].map(k => Math.round(a[k] + (b[k] - a[k]) * f)).join(",") + ")";
    };
  };

  /* hash state: #k=v&k=v — replaceState so the back button leaves the instrument */
  K.hash = {
    read() { const q = {}; location.hash.replace(/^#/, "").split("&").forEach(kv => { const i = kv.indexOf("="); if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); }); return q; },
    write(o) {
      const h = "#" + Object.keys(o).filter(k => o[k] != null && o[k] !== "").map(k => k + "=" + encodeURIComponent(o[k])).join("&");
      K.hash.self = h;
      try { history.replaceState(null, "", h); } catch (_) { location.hash = h; }
    }
  };

  /* year slider with a play button (same control as the Doctrines) */
  K.yearCtl = (host, o) => {
    host.innerHTML = '<button class="chipbtn yc-play" title="Play through time">▶</button><input type="range" aria-label="Year"><span class="yc-v"></span>';
    const r = host.querySelector("input"), v = host.querySelector(".yc-v"), b = host.querySelector(".yc-play");
    let timer = null;
    const show = () => { r.min = o.min; r.max = o.max; r.value = o.get(); v.textContent = o.label ? o.label(o.get()) : o.get(); };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; b.textContent = "▶"; b.classList.remove("on"); } };
    r.addEventListener("input", () => { stop(); o.set(+r.value); show(); });
    b.addEventListener("click", () => {
      if (timer) return stop();
      if (o.get() >= o.max) o.set(o.from || o.min);
      b.textContent = "❚❚"; b.classList.add("on");
      timer = setInterval(() => { const y = Math.min(o.max, o.get() + (o.rate || 1)); o.set(y); show(); if (y >= o.max) stop(); }, o.ms || 70);
      show();
    });
    show();
    return { show, stop, off(d) { stop(); r.disabled = b.disabled = !!d; host.classList.toggle("off", !!d); } };
  };

  /* tooltip that follows the pointer inside a positioned wrapper */
  K.tip = (el, wrap) => ({
    show(html, e) {
      el.innerHTML = html; el.hidden = false;
      const b = wrap.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
      let x = e.clientX - b.left + 14, y = e.clientY - b.top + 14;
      if (x + w > b.width - 6) x = e.clientX - b.left - w - 12;
      if (y + h > b.height - 6) y = e.clientY - b.top - h - 12;
      el.style.left = Math.max(4, x) + "px"; el.style.top = Math.max(4, y) + "px";
    },
    hide() { el.hidden = true; }
  });

  /* tabs: #wr-tabs buttons[data-v] ↔ sections #v-<id>; number keys switch */
  K.tabs = (get, set) => {
    const box = K.$("wr-tabs"), btns = Array.from(box.querySelectorAll("button"));
    const paint = () => {
      btns.forEach(b => { const on = b.dataset.v === get(); b.classList.toggle("on", on); b.setAttribute("aria-selected", on); K.$("v-" + b.dataset.v).hidden = !on; });
      if (window.ARCHIVUS_GLIDE) window.ARCHIVUS_GLIDE(box, "button.on");

    document.addEventListener("keydown", e => {
      if (e.target.closest("input, textarea, select") || e.ctrlKey || e.metaKey || e.altKey) return;
      const i = "123456789".indexOf(e.key); if (i >= 0 && btns[i]) set(btns[i].dataset.v);
    });
    return { paint, ids: btns.map(b => b.dataset.v) };
  };

  /* quick-find box: #dc-q → a dropdown of matches (uses #dc-hits styles) */
  K.finder = (input, search, pick) => {
    let box = null, hits = [], sel = 0;
    const close = () => { if (box) { box.remove(); box = null; } };
    const paint = () => {
      if (!hits.length) return close();
      if (!box) { box = document.createElement("div"); box.id = "dc-hits"; document.body.appendChild(box); box.addEventListener("mousedown", e => { const b = e.target.closest("button"); if (b) { e.preventDefault(); choose(+b.dataset.i); } }); }
      const r = input.getBoundingClientRect();
      box.style.left = Math.max(6, Math.min(r.left, innerWidth - 300)) + "px"; box.style.top = r.bottom + 4 + "px"; box.style.width = Math.max(260, r.width) + "px";
      box.innerHTML = hits.map((h, i) => '<button type="button" data-i="' + i + '"' + (i === sel ? ' class="on"' : "") + ">" + K.esc(h.label) + "<small>" + K.esc(h.sub || "") + "</small></button>").join("");
    };
    const choose = i => { const h = hits[i]; if (!h) return; input.value = ""; close(); input.blur(); pick(h); };
    input.addEventListener("input", () => { const q = input.value.trim().toLowerCase(); hits = q ? search(q).slice(0, 12) : []; sel = 0; paint(); });
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { sel = Math.min(hits.length - 1, sel + 1); paint(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); paint(); e.preventDefault(); }
      else if (e.key === "Enter") choose(sel);
      else if (e.key === "Escape") { input.value = ""; close(); input.blur(); }
    });
    input.addEventListener("blur", () => setTimeout(close, 120));
    document.addEventListener("keydown", e => { if (e.key === "/" && !e.target.closest("input, textarea")) { e.preventDefault(); input.focus(); } });
  };

  /* ------------------------------------------------------------
     the world map: one <path> per country, coloured by a callback.
     Pan by dragging, zoom with the wheel, pinch or the buttons.
     o: { map: name→iso, tipEl, wrap, onPick(iso, element), tipFor(iso, name), onView() — called whenever the view moves }
     ------------------------------------------------------------ */
  K.worldMap = (svg, o) => {
    /* The shapes are plate carrée (1° = 1 unit both ways), which squashes the mid-latitudes where most
       countries are. Stretching north–south by 1.22 gives the equirectangular projection true at about
       35°, and fills a typical panel better. SY applies to everything drawn in the two groups. */
    const SY = 1.22, HOME = { x: 8, y: 6 * SY, w: 348, h: 142 * SY };   /* crop Antarctica and the empty Pacific edge */
    let view = Object.assign({}, HOME), anim = 0;
    const g = document.createElementNS(NS, "g"); svg.appendChild(g);
    const over = document.createElementNS(NS, "g"); svg.appendChild(over);
    g.setAttribute("transform", "scale(1," + SY + ")"); over.setAttribute("transform", "scale(1," + SY + ")");
    const paths = {};
    (window.ARCHIVUS_COUNTRIES || []).forEach(c => {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", c.d); p.setAttribute("class", "at-c");
      const iso = o.map[c.n]; if (iso) { p.dataset.iso = iso; (paths[iso] = paths[iso] || []).push(p); }
      p.dataset.n = c.n; g.appendChild(p);
    });
    const apply = () => { svg.setAttribute("viewBox", [view.x, view.y, view.w, view.h].map(v => v.toFixed(3)).join(" ")); if (o.onView) o.onView(); };
    const clampView = v => {
      const ar = HOME.w / HOME.h; v.w = K.clamp(v.w, 14, HOME.w); v.h = v.w / ar;
      v.x = K.clamp(v.x, HOME.x - 4, HOME.x + HOME.w + 4 - v.w); v.y = K.clamp(v.y, HOME.y - 4, HOME.y + HOME.h + 4 - v.h); return v;
    };
    const tween = to => {
      cancelAnimationFrame(anim); to = clampView(to);
      if (K.REDUCED) { view = to; return apply(); }
      const from = Object.assign({}, view), t0 = performance.now();
      const step = now => {
        const t = Math.min(1, (now - t0) / 320), e = 1 - Math.pow(1 - t, 3);
        ["x", "y", "w", "h"].forEach(k => { view[k] = from[k] + (to[k] - from[k]) * e; }); apply();
        if (t < 1) anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    };
    const toMap = e => { const b = svg.getBoundingClientRect(), s = Math.max(view.w / b.width, view.h / b.height); return [view.x + view.w / 2 + (e.clientX - b.left - b.width / 2) * s, view.y + view.h / 2 + (e.clientY - b.top - b.height / 2) * s, s]; };
    const zoom = (f, e, smooth) => {
      const p = e ? toMap(e) : [view.x + view.w / 2, view.y + view.h / 2];
      const w = K.clamp(view.w * f, 14, HOME.w), k = w / view.w;
      const to = { x: p[0] - (p[0] - view.x) * k, y: p[1] - (p[1] - view.y) * k, w, h: view.h * k };
      if (smooth) tween(to); else { cancelAnimationFrame(anim); view = clampView(to); apply(); }

        pinch = d; moved = 9; return;
      }
      const s = toMap(e)[2]; moved += Math.abs(e.clientX - prev.clientX) + Math.abs(e.clientY - prev.clientY);
      if (moved > 4) { svg.classList.add("drag"); cancelAnimationFrame(anim); view.x -= (e.clientX - prev.clientX) * s; view.y -= (e.clientY - prev.clientY) * s; clampView(view); apply(); if (o.tip) o.tip.hide(); }
      ptr.set(e.pointerId, e);
    });
    const up = e => {
      if (!ptr.has(e.pointerId)) return;
      ptr.delete(e.pointerId); svg.classList.remove("drag");
      if (moved <= 4 && e.type === "pointerup") { const t = document.elementFromPoint(e.clientX, e.clientY); const iso = t && t.dataset && t.dataset.iso; if (o.onPick) o.onPick(iso || null, t); }
    };
    svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
    svg.addEventListener("pointerleave", () => { if (o.tip) o.tip.hide(); });
    function hover(e) {
      if (!o.tip) return;
      const t = e.target, html = t && t.dataset && t.dataset.n ? o.tipFor(t.dataset.iso || null, t.dataset.n) : null;
      if (html) o.tip.show(html, e); else o.tip.hide();
    }

      paths, over, SY,
      /* fn(iso) → colour, or null for "no data" */
      paint(fn) { Object.keys(paths).forEach(iso => { const c = fn(iso); paths[iso].forEach(p => { p.style.fill = c || ""; p.classList.toggle("on", !!c); }); }); },
      select(iso) { g.querySelectorAll(".sel").forEach(p => p.classList.remove("sel")); (paths[iso] || []).forEach(p => { p.classList.add("sel"); g.appendChild(p); }); },
      focus(iso) {

  /* ---------------- boot ---------------- */
  function applyHash() {
    if (location.hash === K.hash.self && built.boot) return;
    const q = K.hash.read();
    if (q.v && tabs.ids.indexOf(q.v) >= 0) st.v = q.v;
    st.l = LENS.some(l => l[0] === q.l) ? q.l : "wars"; st.b = BBY[q.b] ? q.b : null; if (st.b) st.l = "blocs"; st.k = KD[q.k] ? q.k : null;
    clear(); if (WBY[q.d]) st.d = q.d; else if (CBY[q.w]) st.w = q.w; else if (F[q.c]) st.c = q.c; else if (SBY[q.s]) st.s = q.s; else if (BBY[q.g]) st.g = q.g;
    built.boot = 1; sync(true); if (st.v === "board" && picked()) setTimeout(fly, 60);
  }
  function boot() {
    tabs = K.tabs(() => st.v, go);
    $("dc-side").addEventListener("click", e => {
      if (e.target.closest("a")) return;
      if (e.target.closest(".sd-x")) { clear(); return sync(); }
      const g = e.target.closest("[data-go]"); if (g) { st.v = g.dataset.go; sync(); return setTimeout(fly, 80); }
      const ln = e.target.closest("[data-lens]"); if (ln) { st.v = "board"; st.l = "blocs"; st.b = ln.dataset.lens; return sync(); }
      for (const k of ["d", "w", "c", "g", "s"]) { const b = e.target.closest("[data-" + k + "]"); if (b) { clear(); st[k] = b.dataset[k]; sync(); if (st.v === "board") fly(); return; } }
    });
    document.addEventListener("keydown", e => {
      if (e.target.closest("input, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "Escape" && picked()) { clear(); return sync(); }
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (d && st.d) { const n = W[WBY[st.d].ix + d]; if (n) { st.d = n.id; sync(); } }            /* ← → walk the wire: newer, older */
    });
    const hay = [];
    W.forEach(w => hay.push([(w.t + " " + w.x + " " + (w.w || []).join(" ")).toLowerCase(), { label: w.t, sub: fd(w.d, w.approx) + " · " + KD[w.k][0], k: "d", id: w.id }]));
    Object.keys(F).forEach(n => hay.push([(n + " " + nm(n)).toLowerCase(), { label: nm(n), sub: "Country", k: "c", id: n }]));
    BL.forEach(b => hay.push([(b.n + " " + b.full).toLowerCase(), { label: b.full, sub: b.kind, k: "g", id: b.id }]));
