<title>ARCHIVUS — The Realms</title>
<meta name="description" content="Every country scored: Freedom House and V-Dem side by side, the form of government, the ideology each government claims, who is rising and who is sliding, coups and overthrows — and the United States in detail.">
<meta name="color-scheme" content="dark">
<script>
/* ============================================================
   ARCHIVUS — colourways (v12)
   Three of them, switched from the header and remembered:
     blue   the original observatory: deep navy, parchment ink, brass
     black  true black and neutral greys — the same instrument with the blue taken out
     white  a light page: dark ink, brass darkened until it reads

   HOW IT WORKS. The original palette stays the single source of truth: every stylesheet,
   every data file and every drawing routine still names the colours of the blue colourway.
   The other two are DERIVED from it by one rule, applied to every colour wherever it appears:

       keep each colour's contrast against the page, measured against the new page.

   On black that re-anchors greys and drains the blue from them. On white it mirrors
   lightness: what stood out as light-on-dark stands out equally as dark-on-light, so any
   two colours that were legible against each other still are (their contrast ratio is
   preserved exactly by the mirror). Three adjustments are layered on top:
     · text is never left below 4.5:1 against its panel (WCAG AA), in any colourway —
       including the original, where a few dim labels are lifted;
     · accents are not mirrored all the way (pure mirroring turns gold to brown): above 3:1
       the mirror is compressed, so gold lands near 5:1 — and an accent maps the same way
       whatever it is used for, so a legend swatch always matches the mark it explains;
     · shadows stay shadows.

   This file is that rule (ARCHIVUS_THEME.map), used in three places:
     1. tools/build-themes.js runs it over every stylesheet to generate src/themes.css;
     2. in the browser, for the two derived colourways, it re-tones colours that scripts
        write straight into the page (inline styles, SVG fill/stroke) as they are inserted;
     3. and colours drawn on <canvas>.
   It loads in <head>, before anything paints, so there is no flash of the wrong colourway.
   ============================================================ */
(function (root) {
  "use strict";
  const BG = { blue: [10, 12, 18], black: [0, 0, 0], white: [255, 255, 255] };
  const NAMES = { blue: "Blue — the original", black: "Black", white: "White" };
  const ORDER = ["blue", "black", "white"];
  /* shared stylesheets beyond styles.css, per page: w wars.css · d doctrines.css · r realms.css
     (tools/build-themes.js checks this table against the pages and refuses to build if it is stale) */
  const SHEETS = { wars: "w", doctrines: "w d", realms: "w d r", coups: "w d r" };

  /* ---------- colour arithmetic ---------- */
  const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };

  /* ---------- the rule ----------

     variable, used both ways) · shadow.   c = [r, g, b, a].  Returns [r, g, b, a]. */
  const L0 = lum(BG.blue);
  /* text is held a little above 4.5:1 against the page, so that it still clears 4.5:1 (WCAG AA) on the panels,
     which sit a shade off the page — a wider shade on white, where panels are told apart by tone alone */
  const FLOOR = { blue: 5.1, black: 5.1, white: 5.6 };
  const RANGE = (21 - 1) / (ratio(1, L0) - 1);                  /* black has more room than navy: stretch so white stays white */

    if (!BG[theme]) return c;
    if (role === "shadow") return theme === "white" && c[0] + c[1] + c[2] < 60 ? [c[0], c[1], c[2], +(c[3] * 0.3).toFixed(3)] : c;   /* dark shadows soften on a light page */

    const L = lum(rgb), n = neutral(rgb);
    const was = ratio(L, L0), sunk = L < L0;                    /* contrast against the original page; sunk = darker than it */
    const text = role === "ink" && was >= 2.2 && a > 0.55;      /* real text — not dark ink sitting on an accent, not a faint watermark */
    if (theme === "blue") return text && was < INK ? withLum(rgb, 1, INK * (L0 + 0.05) - 0.05).concat(a) : c;
    if (theme === "black") {
      if (!n) return text && ratio(L, 0) < INK ? withLum(rgb, 1, INK * 0.05 - 0.05).concat(a) : c;
      const full = 1 + (was - 1) * RANGE, want = sunk ? 1 : text ? Math.max(full, INK) : full, warm = toLab(rgb)[2] > 0.012 && L > 0.3;
      return withLum(rgb, warm ? 0.45 : 0, Math.min(1, want * 0.05 - 0.05)).concat(a);
    }

    let want = sunk ? (L0 + 0.05) / (L + 0.05) : was;
    if (n) { if (text) want = Math.max(want, INK); want = Math.min(want, 17.5); }
    else {                                                      /* an accent looks the same whatever it is used for, so legends match marks */
      want = want <= 3 ? want : 3 + (want - 3) * 0.35;
      if (text) want = Math.max(want, INK);
      /* a mark — a country on a map, a bar, a legend chip — that was dim on navy would mirror to a pale wash on white.
         Where its own colour allows, it is held to 3:1 against the page, the standard for graphics (WCAG 1.4.11): the red
         end of a scale reads as red. Not further, or what was quiet on navy would shout. (Faint tints, under 1.3:1, still mirror.) */
      if (role === "mark" && !sunk) { const own = Math.min(ratio(1, L), 3.2), t = Math.max(0, Math.min(1, (was - 1.3) / 0.6)); if (own > want) want += t * (own - want); }
    }
    return withLum(rgb, !n ? 1.08 : toLab(rgb)[2] > 0.008 ? 0.5 : 0.2, 1.05 / want - 0.05).concat(a);   /* greys keep a trace of their temperature */
  }

  /* ---------- reading and writing CSS colours ---------- */
  const RX = /#[0-9a-fA-F]{3,8}\b|rgba?\([^)]*\)|\b(?:white|black)\b(?!-)/g;
  function parse(s) {
    if (s[0] === "#") {
      let h = s.slice(1); if (h.length === 3 || h.length === 4) h = h.replace(/./g, "$&$&");
      if (h.length !== 6 && h.length !== 8) return null;
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
    }
    if (s === "white") return [255, 255, 255, 1];
    if (s === "black") return [0, 0, 0, 1];
    const m = s.match(/-?[\d.]+%?/g);
    if (!m || m.length < 3 || /var\(|calc\(/.test(s)) return null;
    const n = m.map((v, i) => v.slice(-1) === "%" ? parseFloat(v) / 100 * (i < 3 ? 255 : 1) : parseFloat(v));

  }
  const hex = v => (v < 16 ? "0" : "") + Math.round(v).toString(16);
  const css = c => c[3] >= 0.999 ? "#" + hex(c[0]) + hex(c[1]) + hex(c[2]) : "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," + +c[3].toFixed(3) + ")";
  const cache = {};
  function tone(str, role, theme) {
    const k = theme + role + str; if (cache[k] !== undefined) return cache[k];
    const c = parse(str); return (cache[k] = c ? css(map(c, role, theme)) : str);

  const mapValue = (value, role, theme) => value.replace(RX, m => tone(m, role, theme));

  function roleOf(prop, text) {
    if (prop === "color" || prop === "-webkit-text-fill-color" || prop === "caret-color" || prop.indexOf("text-decoration") === 0) return "ink";
    if (prop === "fill" || prop === "stroke") return text ? "ink" : "mark";
    if (prop.indexOf("shadow") >= 0 || prop === "filter") return "shadow";
    if (prop.indexOf("background") === 0) return "surface";
    if (prop.indexOf("--") === 0) return "var";
    return "mark";
  }

  const API = { BG, NAMES, ORDER, SHEETS, map, parse, css, tone, mapValue, roleOf, lum, ratio, neutral, RX };
  if (typeof module !== "undefined" && module.exports) { module.exports = API; return; }

     in the browser
     ============================================================ */

  html.setAttribute("data-theme", theme);
  const page = (root.location.pathname.split("/").pop() || "index.html").replace(/\.html?$/, "") || "index";
  html.setAttribute("data-page", page);
  html.setAttribute("data-k", "s " + (SHEETS[page] || ""));    /* which shared stylesheets this page loads: scopes the generated twins */
  API.current = theme;
  API.set = t => {                                           /* the page is redrawn from scratch: charts bake their colours in */
    if (!BG[t] || t === theme) return;
    try { root.localStorage.setItem(KEY, t); } catch (_) {}
    const u = new URL(root.location.href); u.searchParams.delete("theme");
    if (u.href !== root.location.href) root.location.replace(u.href); else root.location.reload();
  };
  root.ARCHIVUS_THEME = API;
  const metas = () => {
    const cs = doc.querySelector('meta[name="color-scheme"]'), tc = doc.querySelector('meta[name="theme-color"]');
    if (cs) cs.content = theme === "white" ? "light" : "dark";
    if (tc) tc.content = css(BG[theme].concat(1));

  const done = new WeakMap();                                /* element → what we last wrote, so our own edits are not re-toned */
  const DECL = /(^|;)\s*([-\w]+)\s*:\s*([^;]+)/g;
  function retone(el) {

      /* a colour handed to the stylesheet as a variable (style="--c:…") is usually the element's text and border at once */
      const chip = !el.firstChild;                           /* an element with nothing in it is a swatch, a bar or a dot: its background is a mark */
      const w = s.replace(DECL, (m, pre, prop, val) => pre + prop + ":" + mapValue(val, prop.indexOf("--") === 0 ? "ink" : chip && (prop === "background" || prop === "background-color") ? "mark" : roleOf(prop, isText), theme));

  const C2D = root.CanvasRenderingContext2D && root.CanvasRenderingContext2D.prototype;
  if (C2D) {

    ["fillStyle", "strokeStyle", "shadowColor"].forEach(p => {
      const d = Object.getOwnPropertyDescriptor(C2D, p); if (!d || !d.set) return;

      const f = C2D[fn], p = fn === "fillText" ? "fillStyle" : "strokeStyle";
      C2D[fn] = function () {
        const r = raw.get(this), v = r && r[p];
        if (typeof v !== "string") return f.apply(this, arguments);
        r["set" + p].call(this, mapValue(v, "ink", theme));
        const out = f.apply(this, arguments);
        r["set" + p].call(this, mapValue(v, "mark", theme));

<style>
/* ============================================================
   ARCHIVUS — v0.5 "Lens"
   Dark observatory. Modern instrument typography:
   Space Grotesk (structure) · Inter (reading) · IBM Plex Mono (data)
   ============================================================ */

:root {
  --obsidian:      #0a0c12;
  --obsidian-2:    #0e1119;
  --obsidian-3:    #131826;
  --paper:         #e6e1d3;
  --paper-dim:     #a8a494;
  --gold:          #c9a227;
  --gold-bright:   #e8c455;
  --gold-dim:      #6e5c1f;
  --indigo:        #7c9ac9;
  --line:          #262c3b;
  --line-faint:    #181d29;
  --panel-bg:      #10131dfa;
  --sans: "Inter", system-ui, sans-serif;
  --display: "Space Grotesk", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body { height: 100dvh; }        /* dynamic viewport: tracks the phone's address bar */

body {
  background:
    radial-gradient(ellipse 130% 75% at 50% -12%, #151d33 0%, transparent 55%),
    radial-gradient(ellipse 85% 55% at 88% 112%, #1c1324 0%, transparent 60%),
    var(--obsidian);
  color: var(--paper);
  font-family: var(--sans);
  font-size: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.mono { font-family: var(--mono); font-size: 0.82em; letter-spacing: 0.03em; }

/* ============ motion ============ */
@keyframes glowpulse {
  0%, 100% { box-shadow: 0 0 8px rgba(201,162,39,0.35); }
  50%      { box-shadow: 0 0 20px rgba(232,196,85,0.7); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%, 100% { opacity: 0.04; } 50% { opacity: 0.45; } }
@keyframes condense { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes reveal-up {
  from { transform: translateY(8px); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}

/* ============ masthead ============ */
#masthead {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 22px 10px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(201,162,39,0.05), transparent);
  position: relative;
}
#masthead::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -2px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim) 25%, var(--gold) 50%, var(--gold-dim) 75%, transparent);
  opacity: 0.5;
  pointer-events: none;
}

/* pure-geometry sigil: ring, orbit, nucleus */
.sigil {
  position: relative;
  width: 34px; height: 34px;
  border: 1px solid rgba(201,162,39,0.55);
  border-radius: 50%;
  animation: glowpulse 6s ease-in-out infinite;
}
.sigil::before {
  content: "";
  position: absolute; inset: -5px;
  border: 1px dashed rgba(201,162,39,0.3);
  border-radius: 50%;
  animation: spin 50s linear infinite;
}
.sigil::after {
  content: "";
  position: absolute; left: 50%; top: 50%;
  width: 6px; height: 6px; margin: -3px 0 0 -3px;
  background: var(--gold-bright);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--gold-bright);
}

#masthead h1 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 19px;
  letter-spacing: 0.34em;
  color: var(--gold-bright);
}
.tagline {
  color: var(--paper-dim);
  font-size: 12px;
  letter-spacing: 0.06em;
  margin-top: 1px;
}

#tx-link {
  margin-left: auto;
  font-family: var(--display);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid var(--gold-dim);
  border-radius: 4px;
  padding: 7px 14px;
  transition: all 0.18s;
}
#tx-link:hover { color: var(--gold-bright); box-shadow: 0 0 12px rgba(201,162,39,0.22); }
#bl-link, #pn-link, #cx-link, #tr-link {
  margin-left: 8px;
  font-family: var(--display);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid var(--gold-dim);
  border-radius: 4px;
  padding: 7px 14px;
  transition: all 0.18s;
}
#bl-link:hover, #pn-link:hover, #cx-link:hover { color: var(--gold-bright); box-shadow: 0 0 12px rgba(201,162,39,0.22); }

.masthead-readout { margin-left: 16px; text-align: right; }
.readout-line { font-family: var(--display); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.readout-line.mono { font-family: var(--mono); color: var(--paper-dim); font-size: 11px; margin-top: 3px; text-transform: none; }

/* ============ single command bar (main app) ============ */
#bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(201,162,39,0.05), transparent);
  position: relative;
  z-index: 30;
  flex-wrap: nowrap;
}
#bar::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -2px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim) 25%, var(--gold) 50%, var(--gold-dim) 75%, transparent);
  opacity: 0.5;
  pointer-events: none;
}
#bar-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.3em;
  color: var(--gold-bright);
  margin-right: 4px;
}
.sigil.mini { width: 24px; height: 24px; }
.sigil.mini::before { inset: -4px; }
.sigil.mini::after { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; }
#bar .masthead-readout { margin-left: 4px; }
#bar #search { flex: 0 1 220px; }
#bar #tx-link, #bar #bl-link, #bar #pn-link, #bar #cx-link, #bar #tr-link { margin-left: 0; padding: 6px 10px; font-size: 10.5px; }
#bar .sigil.mini { cursor: pointer; }

/* ============ the portal (welcome overlay) ============ */
#welcome {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(7, 9, 15, 0.93);
  display: flex; align-items: center; justify-content: center;
  padding: 18px;
  overflow-y: auto;
}
#welcome[hidden] { display: none !important; }   /* the hidden attribute must always win */
#welcome-card {
  width: min(680px, 96vw);
  max-height: 92dvh; overflow-y: auto;
  background: var(--obsidian-2);
  border: 1px solid var(--gold-dim);
  border-radius: 10px;
  padding: 30px 30px 22px;
  text-align: center;
  box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 60px rgba(201,162,39,.08);
  animation: reveal-up 0.35s ease-out;
}
.w-sigil {
  width: 44px; height: 44px; margin: 0 auto 14px;
  border: 1px solid rgba(201,162,39,0.6); border-radius: 50%;
  position: relative; animation: glowpulse 5s ease-in-out infinite;
}
.w-sigil::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 8px; height: 8px; margin: -4px 0 0 -4px;
  background: var(--gold-bright); border-radius: 50%;
  box-shadow: 0 0 12px var(--gold-bright);
}
#welcome-card h2 {
  font-family: var(--display); font-weight: 700; font-size: 20px;
  letter-spacing: 0.34em; color: var(--gold-bright); margin-bottom: 8px;
}
.w-sub { font-size: 13.5px; line-height: 1.6; color: var(--paper-dim); margin-bottom: 20px; }
.w-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.w-door {
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left;
  background: var(--obsidian-3); border: 1px solid var(--line); border-radius: 7px;
  padding: 13px 15px; cursor: pointer; text-decoration: none;
  color: var(--paper); font-family: var(--sans); transition: all 0.16s;
}
.w-door:hover { border-color: var(--gold); background: rgba(201,162,39,0.08); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.w-door.wide { grid-column: 1 / -1; }
.w-door .w-ic { font-size: 19px; }
.w-door b { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--gold-bright); letter-spacing: 0.03em; }
.w-door span:last-child { font-size: 11.5px; line-height: 1.5; color: var(--paper-dim); }
.w-foot { margin-top: 16px; font-family: var(--mono); font-size: 10px; color: #59617c; }
.w-foot b { color: var(--gold); font-weight: 400; }
@media (max-width: 700px) {
  .w-grid { grid-template-columns: 1fr; }
  #welcome-card { padding: 22px 18px 16px; }
  #welcome-card h2 { font-size: 16px; letter-spacing: 0.24em; }
}

/* ============ collapsible drawer ============ */
#drawer {
  position: fixed;
  left: 0; top: 48px; bottom: 0;
  width: 300px;
  max-width: 85vw;
  background: var(--panel-bg);
  backdrop-filter: blur(6px);
  border-right: 1px solid var(--line);
  box-shadow: 24px 0 60px rgba(0,0,0,0.5);
  padding: 18px 16px 30px;
  overflow-y: auto;
  z-index: 25;
  transform: translateX(-104%);
  transition: transform 0.3s cubic-bezier(.22,1,.36,1);
}
#drawer.open { transform: translateX(0); }
.d-section { margin-bottom: 20px; }
.d-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 9px;
}
.d-row { display: flex; flex-wrap: wrap; gap: 6px; }
.d-row select { max-width: 100%; flex: 1 1 120px; }
#drawer #theme-chips { display: flex; flex-direction: column; gap: 6px; padding: 0; border: none; }
#drawer .chip { justify-content: flex-start; }
.d-legend { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--paper-dim); }
.d-legend .legend-item { display: inline-flex; align-items: center; gap: 7px; line-height: 1.5; }

/* atlas time-play + narrative tours */
#play-btn {
  position: absolute;
  left: 10px; bottom: 46px;
  z-index: 6;
  box-shadow: 0 4px 18px rgba(0,0,0,0.5), 0 0 14px rgba(201,162,39,0.15);
}
#tours-menu {
  position: absolute;
  right: 12px; top: 8px;
  z-index: 40;
  background: var(--panel-bg);
  backdrop-filter: blur(6px);
  border: 1px solid var(--gold-dim);
  border-radius: 6px;
  padding: 10px;
  width: 340px;
  max-width: 90vw;
  box-shadow: 0 14px 44px rgba(0,0,0,0.6);
}
.tour-item {
  padding: 9px 10px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(255,255,255,0.02);
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.tour-item:hover { background: rgba(201,162,39,0.1); border-left-color: var(--gold); }
.tour-item .tt { font-family: var(--display); font-weight: 600; font-size: 12.5px; color: var(--gold-bright); }
.tour-item .tb { font-size: 11.5px; color: var(--paper-dim); margin-top: 2px; line-height: 1.45; }
#tour-card {
  position: absolute;
  left: 50%; bottom: 52px;
  transform: translateX(-50%);
  z-index: 35;
  width: 560px; max-width: 92%;
  background: var(--panel-bg);
  backdrop-filter: blur(6px);
  border: 1px solid var(--gold-dim);
  border-radius: 6px;
  padding: 14px 16px 12px;
  box-shadow: 0 16px 50px rgba(0,0,0,0.65), 0 0 24px rgba(201,162,39,0.1);
  animation: reveal-up 0.25s ease-out;
}
#tour-note { font-size: 14px; line-height: 1.6; color: var(--paper); margin: 6px 0 10px; }
#tour-nav { display: flex; align-items: center; gap: 8px; }
#tour-step { font-size: 10.5px; color: #59617c; margin: 0 auto 0 4px; }
.map-year-big {
  font-family: "IBM Plex Mono", monospace;
  fill: var(--gold-bright);
  font-size: 34px;
  letter-spacing: 0.06em;
  paint-order: stroke; stroke: rgba(10,12,18,0.85); stroke-width: 6px;
}
.ignite { pointer-events: none; }
#play-speed { position: absolute; left: 150px; bottom: 46px; z-index: 6; }
#play-era {
  position: absolute; left: 10px; bottom: 88px; z-index: 6;
  font-family: var(--display); font-weight: 700;
  font-size: 21px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--gold-bright);
  text-shadow: 0 0 18px rgba(201,162,39,0.5), 0 2px 4px rgba(0,0,0,0.8);
  pointer-events: none;
}
#play-era.flash { animation: era-flash 0.9s ease-out; }
@keyframes era-flash {
  0% { transform: scale(1.5); opacity: 0; letter-spacing: 0.5em; }
  100% { transform: scale(1); opacity: 1; letter-spacing: 0.24em; }
}
#play-feed {
  position: absolute; left: 10px; top: 46px; z-index: 6;
  width: 320px; max-width: 44vw;
  display: flex; flex-direction: column; gap: 4px;
  pointer-events: none;
}
.feed-item {
  background: rgba(10,12,18,0.72);
  border-left: 3px solid var(--c, var(--gold));
  border-radius: 0 3px 3px 0;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--paper);
  animation: reveal-up 0.3s ease-out;
}
.feed-item .fy { font-family: var(--mono); font-size: 9.5px; color: var(--gold-bright); display: block; }
.feed-item:nth-child(n+4) { opacity: 0.55; }
.feed-item:nth-child(n+6) { opacity: 0.28; }
.wheel-hand { stroke: var(--gold-bright); stroke-width: 1.6; filter: drop-shadow(0 0 8px rgba(232,196,85,0.8)); pointer-events: none; }
.wheel-hand-tip { fill: var(--gold-bright); filter: drop-shadow(0 0 10px rgba(232,196,85,0.9)); pointer-events: none; }
.wheel-year-big {
  font-family: "IBM Plex Mono", monospace;
  fill: var(--gold-bright); font-size: 22px;
  paint-order: stroke; stroke: rgba(10,12,18,0.85); stroke-width: 5px;
}

/* floating status chip inside the chart */
#status {
  position: absolute;
  right: 10px; bottom: 8px;
  font-size: 10.5px;
  color: #59617c;
  background: rgba(10,12,18,0.55);
  border: 1px solid var(--line-faint);
  border-radius: 3px;
  padding: 3px 9px;
  pointer-events: none;
  z-index: 5;
}

/* ============ toolbar ============ */
#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 22px;
  border-bottom: 1px solid var(--line-faint);
}

#view-switch {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.view-btn {
  background: var(--obsidian-3);
  border: none;
  border-right: 1px solid var(--line);
  color: var(--paper-dim);
  font-family: var(--display);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.04em;
  padding: 8px 14px;
  cursor: pointer;
  transition: all 0.18s;
}
.view-btn:last-child { border-right: none; }
.view-btn:hover { color: var(--gold-bright); }
.view-btn.active {
  background: rgba(201,162,39,0.15);
  color: var(--gold-bright);
  box-shadow: inset 0 -2px 0 var(--gold);
}

#search {
  flex: 0 1 280px;
  background: var(--obsidian-3);
  border: 1px solid var(--line);
  color: var(--paper);
  font-family: var(--sans);
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 4px;
  outline: none;
  transition: border-color 0.18s, box-shadow 0.18s;
}
#search:focus { border-color: var(--gold-dim); box-shadow: 0 0 12px rgba(201,162,39,0.2); }
#search::placeholder { color: #5c637a; }

select {
  background: var(--obsidian-3);
  border: 1px solid var(--line);
  color: var(--paper);
  font-family: var(--sans);
  font-size: 12.5px;
  padding: 8px 8px;
  border-radius: 4px;
  max-width: 170px;
  transition: border-color 0.18s;
}
select:hover, select:focus { border-color: var(--gold-dim); outline: none; }

.toolbar-spacer { flex: 1; }

.tool-btn {
  background: var(--obsidian-3);
  border: 1px solid var(--line);
  color: var(--paper-dim);
  font-family: var(--display);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.04em;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  min-width: 34px;
  transition: all 0.18s;
}
.tool-btn:hover {
  border-color: var(--gold-dim);
  color: var(--gold-bright);
  box-shadow: 0 0 10px rgba(201,162,39,0.16);
}
.tool-btn.accent { border-color: var(--gold-dim); color: var(--gold); }
.tool-btn.wide { padding: 8px 14px; }

/* ============ theme chips ============ */
#theme-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 22px 9px;
  border-bottom: 1px solid var(--line-faint);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--sans);
  font-weight: 500;
  font-size: 11.5px;
  letter-spacing: 0.02em;
  color: var(--paper-dim);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 4px 11px;
  cursor: pointer;
  transition: all 0.18s;
  user-select: none;
}
.chip .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--c, var(--gold));
  box-shadow: 0 0 7px var(--c, var(--gold));
}
.chip:hover { border-color: var(--gold-dim); color: var(--paper); }
.chip.active {
  border-color: var(--c, var(--gold));
  color: var(--paper);
  background: color-mix(in srgb, var(--c, var(--gold)) 14%, transparent);
}
.chip.dimmed { opacity: 0.35; }

/* ============ stage ============ */
#stage { flex: 1; display: flex; min-height: 0; position: relative; }

#chart-wrap { flex: 1; position: relative; min-width: 0; }

#chart {
  width: 100%; height: 100%; display: block;
  cursor: crosshair;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#chart.panning { cursor: grabbing; }

/* --- SVG vocabulary --- */
.era-band { cursor: pointer; transition: filter 0.18s; }
.era-band:hover { filter: brightness(1.8); }
.era-band-label {
  font-family: "Space Grotesk", system-ui, sans-serif;
  font-weight: 500;
  fill: #8f9ab5;
  letter-spacing: 0.12em;
  pointer-events: none;
  text-transform: uppercase;
}
.era-boundary { stroke: var(--line-faint); stroke-width: 1; }
.axis-tick-label { font-family: "IBM Plex Mono", monospace; fill: #66708c; font-size: 10px; }
.axis-line { stroke: var(--line); }
.meridian { stroke: var(--gold-dim); stroke-width: 1; stroke-dasharray: 3 4; }
.meridian-label { font-family: "Space Grotesk", sans-serif; fill: var(--gold-dim); font-size: 9px; letter-spacing: 0.16em; }
.lane-label {
  font-family: "Space Grotesk", system-ui, sans-serif;
  font-weight: 500;
  fill: #4d5670;
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  pointer-events: none;
}
.lane-line { stroke: var(--line-faint); stroke-dasharray: 1 5; }

.evt { cursor: pointer; }
.evt .node-core { transition: r 0.16s cubic-bezier(.34,1.56,.64,1); }
.evt-label {
  font-family: "Inter", system-ui, sans-serif;
  fill: var(--paper-dim);
  font-size: 10.5px;
  letter-spacing: 0.01em;
  pointer-events: none;
  paint-order: stroke;
  stroke: rgba(10,12,18,0.88);
  stroke-width: 3px;
}
.evt-label.major { fill: var(--paper); font-size: 11.5px; font-weight: 500; }

.enter .evt {
  transform-box: fill-box;
  transform-origin: center;
  animation: condense 0.5s cubic-bezier(.34,1.56,.64,1) both;
}

/* the standing web of relations */
.web-line {
  stroke: var(--gold);
  stroke-width: 0.6;
  opacity: 0.10;
  pointer-events: none;
}
/* the ignited thread */
.constellation {
  stroke: var(--gold-bright);
  stroke-width: 1;
  stroke-dasharray: 3 5;
  opacity: 0.8;
  pointer-events: none;
  animation: flow 1.6s linear infinite;
}

.star { fill: #b8c4e8; pointer-events: none; }
.star.twinkle { animation-name: twinkle; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }

.time-cursor { stroke: rgba(232,196,85,0.3); stroke-width: 1; pointer-events: none; }
.time-cursor-label {
  font-family: "IBM Plex Mono", monospace;
  fill: var(--gold-bright); font-size: 10px;
  pointer-events: none;
  paint-order: stroke; stroke: rgba(10,12,18,0.9); stroke-width: 3px;
}

.ov-bg { fill: var(--obsidian-2); stroke: var(--line-faint); }
.ov-brush {
  fill: rgba(201,162,39,0.15);
  stroke: var(--gold-dim);
  stroke-width: 1;
  cursor: ew-resize;
  transition: fill 0.18s;
}
.ov-brush:hover { fill: rgba(201,162,39,0.26); }
.ov-dot { pointer-events: none; }
.ov-hit { fill: transparent; cursor: pointer; }

/* atlas */
.map-frame { fill: rgba(124,154,201,0.02); stroke: var(--line); stroke-width: 1; }
.graticule { stroke: var(--line-faint); stroke-width: 0.6; }
.graticule.equator { stroke: var(--gold-dim); stroke-dasharray: 2 5; opacity: 0.5; }
.map-land { fill: rgba(230,225,211,0.11); stroke: #6b7899; stroke-width: 0.9; }
.map-border { fill: none; stroke: #3a445c; stroke-width: 0.6; stroke-dasharray: 2 2; opacity: 0.7; }
.map-country { fill: rgba(230,225,211,0.10); stroke: #4d5a78; stroke-width: 0.7; transition: fill 0.2s; }
.map-country:hover { fill: rgba(201,162,39,0.14); stroke: var(--gold-dim); }
.map-caption {
  font-family: "Space Grotesk", sans-serif;
  fill: var(--gold-dim); font-size: 10px; letter-spacing: 0.16em;
}

/* wheel */
.wheel-ring { fill: none; stroke: var(--line-faint); stroke-dasharray: 1 5; }
.wheel-era { transition: filter 0.18s; }
.wheel-era:hover { filter: brightness(1.9); }
.wheel-era-label {
  font-family: "Space Grotesk", sans-serif;
  font-weight: 500;
  fill: #8f9ab5; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase;
  pointer-events: none;
}
.wheel-center-disc { fill: rgba(201,162,39,0.05); stroke: var(--gold-dim); stroke-width: 0.8; stroke-dasharray: 2 4; }
.wheel-center-title {
  font-family: "Space Grotesk", sans-serif;
  font-weight: 600;
  fill: var(--gold-bright); font-size: 12px; letter-spacing: 0.3em;
}
.wheel-center-sub { font-family: "IBM Plex Mono", monospace; fill: var(--paper-dim); font-size: 9px; }

/* ============ tooltip ============ */
#tooltip {
  position: absolute;
  pointer-events: none;
  background: #151927f5;
  border: 1px solid var(--gold-dim);
  border-radius: 4px;
  padding: 8px 12px;
  max-width: 280px;
  z-index: 30;
  box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  animation: reveal-up 0.14s ease-out;
}
#tooltip .tt-title { font-family: var(--display); font-weight: 500; font-size: 12.5px; color: var(--gold-bright); }
#tooltip .tt-date { font-family: var(--mono); font-size: 10px; color: var(--paper-dim); margin-top: 3px; }

/* ============ slide-in panel ============ */
#panel {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 360px;
  max-width: 88vw;
  border-left: 1px solid var(--line);
  background: var(--panel-bg);
  backdrop-filter: blur(6px);
  padding: 48px 24px 30px;
  overflow-y: auto;
  z-index: 20;
  transform: translateX(102%);
  transition: transform 0.32s cubic-bezier(.22,1,.36,1);
  box-shadow: -24px 0 60px rgba(0,0,0,0.55);
}
#panel.open { transform: translateX(0); }
#panel::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: linear-gradient(180deg, var(--gold-dim), transparent 40%, transparent 60%, var(--gold-dim));
  opacity: 0.5;
  pointer-events: none;
}

#panel-close {
  position: absolute;
  top: 10px; right: 12px;
  width: 30px; height: 30px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--paper-dim);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  transition: all 0.18s;
  z-index: 2;
}
#panel-close:hover { border-color: var(--gold-dim); color: var(--gold-bright); }

#panel-content, #panel-oracle { animation: reveal-up 0.28s ease-out; }

.kicker {
  font-family: var(--display);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

#panel-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 20px;
  line-height: 1.25;
  color: var(--paper);
  margin-bottom: 8px;
}

#panel-date { color: var(--gold-bright); font-size: 12px; margin-bottom: 14px; }

#panel-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.meta-tag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 3px 8px;
  color: var(--paper-dim);
}
.meta-tag.theme-tag { border-color: var(--c, var(--line)); color: var(--c, var(--paper-dim)); }

#panel-desc { font-size: 14.5px; line-height: 1.65; color: var(--paper); margin-bottom: 18px; }

#panel-importance { margin-bottom: 18px; }
#panel-importance .label {
  display: block; font-family: var(--display); font-weight: 500; font-size: 9.5px;
  letter-spacing: 0.2em; text-transform: uppercase; color: #59617c; margin-bottom: 6px;
}
.imp-track {
  display: block; height: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.05);
  overflow: hidden;
}
.imp-fill {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
  border-radius: 3px;
  box-shadow: 0 0 8px rgba(201,162,39,0.5);
}

#panel-source {
  display: inline-block;
  font-family: var(--display);
  font-weight: 500;
  font-size: 11.5px;
  letter-spacing: 0.08em;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid var(--gold-dim);
  padding: 7px 14px;
  border-radius: 4px;
  margin-bottom: 24px;
  transition: all 0.18s;
}
#panel-source:hover {
  background: rgba(201,162,39,0.12);
  color: var(--gold-bright);
}

#panel-related { display: flex; flex-direction: column; gap: 6px; }
.related-link {
  font-size: 13px;
  color: var(--paper-dim);
  cursor: pointer;
  padding: 6px 10px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(255,255,255,0.02);
  transition: all 0.16s;
}
.related-link:hover {
  color: var(--gold-bright);
  background: rgba(201,162,39,0.09);
  border-left-color: var(--gold);
  transform: translateX(3px);
}
.related-link .rl-date { font-family: var(--mono); font-size: 9.5px; color: #59617c; display: block; }

/* ============ oracle & era records ============ */
#panel-oracle .o-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
  color: var(--gold-bright);
  margin-bottom: 4px;
}
#panel-oracle .o-span { font-family: var(--mono); font-size: 11px; color: var(--paper-dim); margin-bottom: 16px; }
#panel-oracle .o-prose { font-size: 14.5px; line-height: 1.68; color: var(--paper); margin-bottom: 18px; }
#panel-oracle .o-prose em { color: var(--gold-bright); font-style: normal; font-weight: 500; }
#panel-oracle .o-section { margin-bottom: 18px; }
#panel-oracle .o-evt {
  display: block;
  font-size: 13px;
  color: var(--paper-dim);
  cursor: pointer;
  padding: 5px 10px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(255,255,255,0.02);
  margin-bottom: 5px;
  transition: all 0.16s;
}
#panel-oracle .o-evt:hover {
  color: var(--gold-bright);
  background: rgba(201,162,39,0.09);
  border-left-color: var(--gold);
  transform: translateX(3px);
}
#panel-oracle .o-evt .oe-date { font-family: var(--mono); font-size: 9.5px; color: #59617c; display: block; }
.o-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.o-bar-name { font-family: var(--mono); font-size: 9.5px; color: var(--paper-dim); width: 108px; flex: none; text-align: right; }
.o-bar-track { flex: 1; height: 7px; background: rgba(255,255,255,0.04); border-radius: 3px; overflow: hidden; }
.o-bar-fill {
  display: block;
  height: 100%; border-radius: 3px;
  box-shadow: 0 0 8px var(--c, var(--gold));
  background: var(--c, var(--gold));
  transition: width 0.6s cubic-bezier(.22,1,.36,1);
}
.o-bar-n { font-family: var(--mono); font-size: 9.5px; color: #59617c; width: 22px; }
.o-divider { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

/* cross-instrument jump links + help overlay */
.tx-jump {
  display: block;
  font-size: 12.5px;
  color: var(--gold);
  text-decoration: none;
  padding: 6px 10px;
  border-left: 2px solid var(--gold-dim);
  background: rgba(201,162,39,0.04);
  margin-bottom: 5px;
  transition: all 0.16s;
}
.tx-jump:hover { color: var(--gold-bright); background: rgba(201,162,39,0.1); transform: translateX(3px); }
#panel-tx { margin-top: 18px; }
#help-overlay {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  background: var(--panel-bg);
  backdrop-filter: blur(8px);
  border: 1px solid var(--gold-dim);
  border-radius: 6px;
  padding: 18px 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 30px rgba(201,162,39,0.1);
  animation: reveal-up 0.2s ease-out;
}
#help-overlay table { border-collapse: collapse; margin: 6px 0 10px; }
#help-overlay td { padding: 3px 14px 3px 0; font-size: 13px; color: var(--paper); }
#help-overlay td:first-child { font-family: var(--mono); color: var(--gold-bright); font-size: 11.5px; white-space: nowrap; }
#help-overlay .hint { font-size: 10px; color: #59617c; line-height: 1.6; }

/* ============ legend ============ */
#legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  padding: 6px 22px;
  border-top: 1px solid var(--line);
  background: var(--obsidian-2);
  font-size: 11.5px;
  color: var(--paper-dim);
}
.legend-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--gold-dim);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
#event-count { margin-left: auto; color: #59617c; }

/* ============ responsive & a11y ============ */
@media (max-width: 900px) {
  #masthead h1 { font-size: 16px; letter-spacing: 0.22em; }
  .masthead-readout { display: none; }
  #search { flex-basis: 150px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; transition-duration: 0.001s !important; }
}

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--obsidian); }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

/* ============ the pocket archive: phones & small screens ============ */
@media (max-width: 700px) {
  /* the page may always scroll on a phone — never trap the user */
  body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  main, #stage { min-height: 64dvh; }
  #panel, #drawer, #bl-panel, #pn-panel, #as-panel { -webkit-overflow-scrolling: touch; }
  #bar { flex-wrap: wrap; padding: 6px 8px; gap: 5px; row-gap: 5px; }
  #bar-title { font-size: 13px; letter-spacing: 0.2em; }
  #bar .tool-btn, #view-switch .view-btn { padding: 5px 8px; font-size: 10px; }
  #bar #tx-link, #bar #bl-link, #bar #pn-link { padding: 5px 7px; font-size: 9px; }
  #search { flex: 1 1 110px; min-width: 90px; font-size: 12px; padding: 6px 9px; }
  .masthead-readout { display: none; }
  .toolbar-spacer { display: none; }
  #drawer { width: 100vw; max-width: 100vw; }
  #panel { width: 100vw; max-width: 100vw; }
  #masthead { padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
  #masthead h1 { font-size: 14px; }
  #masthead .tagline { display: none; }
  #play-feed { width: 58vw; font-size: 9px; }
  #play-era { font-size: 11px; }
  #status { font-size: 9px; }
  #help-overlay { width: 92vw; }
  #tour-card { width: 90vw; left: 5vw; }
  #bl-panel, #pn-panel { width: 100vw; max-width: 100vw; }
  #bl-toolbar, #pn-toolbar { padding: 6px 8px; gap: 4px; }
  #bl-mini { display: none; }
  #bl-hint, #pn-legend { display: none; }
}

/* ============================================================
   v8 — THE OVERHAUL
   · the instrument rail (src/nav.js): one nav strip on every page
   · header that never clips; readout that never wraps
   · engraved display face for mastheads (Cinzel, falls back cleanly)
   · the War Room link in the event panel
   ============================================================ */
:root { --engraved: "Cinzel", "Trajan Pro", "Space Grotesk", Georgia, serif; --allied: #4f8fd6; --axis: #d2452f; }

#rail {
  display: flex; align-items: stretch; gap: 2px;
  flex: 0 0 auto; height: 31px; padding: 0 12px;
  background: linear-gradient(180deg, rgba(6,8,13,0.86), rgba(10,12,18,0.72));
  border-bottom: 1px solid var(--line);
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  position: relative; z-index: 29;
}
#rail::-webkit-scrollbar { display: none; }
#rail a {
  display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
  padding: 0 13px;
  font-family: var(--display); font-weight: 500; font-size: 10.5px; letter-spacing: 0.17em; text-transform: uppercase;
  color: #8792ad; text-decoration: none; white-space: nowrap;
  border-bottom: 2px solid transparent; border-top: 2px solid transparent;
  transition: color 0.16s, background 0.16s, border-color 0.16s;
}
#rail a svg { opacity: 0.75; flex: 0 0 auto; }
#rail a:hover { color: var(--gold-bright); background: rgba(201,162,39,0.07); }
#rail a.here { color: var(--gold-bright); border-bottom-color: var(--gold); background: linear-gradient(180deg, transparent, rgba(201,162,39,0.10)); }
#rail a.here svg { opacity: 1; }
#rail a:focus-visible { outline: 1px solid var(--gold); outline-offset: -3px; }
#rail .new { font: 600 8px/1 var(--display); letter-spacing: 0.1em; color: #0a0c12; background: var(--gold); border-radius: 2px; padding: 2px 4px; }
.legacy-nav { display: none !important; }

/* mastheads: an engraved face for the names of things */
#masthead h1, #bar-title, #welcome-card h2 { font-family: var(--engraved); font-weight: 600; }
#masthead h1 { letter-spacing: 0.24em; font-size: 18px; }
#bar-title { letter-spacing: 0.24em; }
body.has-rail #masthead { padding-top: 9px; padding-bottom: 8px; }

/* the Archive's command bar: nothing may clip, nothing may wrap */
#view-switch { flex: 0 0 auto; }
#bar .tool-btn { flex: 0 0 auto; white-space: nowrap; }
#bar #search { min-width: 120px; }
#bar .masthead-readout { margin-left: 8px; min-width: 0; flex: 0 1 auto; }
.readout-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
#drawer { top: var(--chrome-h, 48px); }

/* chronicle labels sit in their own layer above the nodes (see core.js, v8 label pass) */
.evt-labels { pointer-events: none; }
.evt-label { stroke: rgba(10,12,18,0.94); stroke-width: 3.4px; stroke-linejoin: round; }

/* the door from a war record into the War Room */
.war-jump {
  display: block; margin: 10px 0 16px; padding: 9px 12px;
  font-family: var(--display); font-weight: 500; font-size: 11.5px; letter-spacing: 0.05em;
  color: #ffd9cf; text-decoration: none;
  background: linear-gradient(90deg, rgba(210,69,47,0.20), rgba(79,143,214,0.16));
  border: 1px solid rgba(210,69,47,0.5); border-radius: 4px;
  transition: transform 0.16s, box-shadow 0.16s;
}
.war-jump:hover { transform: translateX(3px); box-shadow: 0 0 16px rgba(210,69,47,0.28); color: #fff; }

@media (max-width: 700px) {
  #rail { height: 34px; padding: 0 4px; }
  #rail a { padding: 0 10px; font-size: 10px; letter-spacing: 0.12em; }
  .readout-line { max-width: 60vw; }
}

/* v9 — the door into the Doctrines */
.war-jump.doc-jump { color: #f6e7b4; background: linear-gradient(90deg, rgba(229,72,77,0.16), rgba(201,162,39,0.14), rgba(154,120,214,0.16)); border-color: rgba(201,162,39,0.55); }
.war-jump.doc-jump:hover { box-shadow: 0 0 16px rgba(201,162,39,0.3); }
#panel-war + #panel-doc { margin-top: -8px; }
.w-door.doc { border-color: rgba(201,162,39,0.55); background: linear-gradient(120deg, rgba(229,72,77,0.11), rgba(79,174,106,0.08), rgba(154,120,214,0.12)); }
.w-door.doc:hover { border-color: var(--gold-bright); }

/* v8 portal: the War Room door */
.w-door.war { border-color: rgba(210,69,47,0.55); background: linear-gradient(120deg, rgba(79,143,214,0.10), rgba(210,69,47,0.12)); }
.w-door.war:hover { border-color: #ff8a73; box-shadow: 0 8px 26px rgba(210,69,47,0.25); }
#bar #wr-link { font-family: var(--display); font-size: 10.5px; letter-spacing: 0.1em; color: var(--gold); text-decoration: none; border: 1px solid var(--gold-dim); border-radius: 4px; padding: 6px 10px; }

/* ============================================================
   v10 — ONE INSTRUMENT
   · one header on every page (src/nav.js): brand · instruments · search
     — the per-page mastheads are hidden once it is in place
   · page-to-page: native cross-document view transitions where the
     browser has them, a hand-made fade everywhere else
   · search everything (Ctrl/⌘ K) · first-arrival title card
   · gliding tab markers · eased view changes · quiet scrollbars
   ============================================================ */
html { background: var(--obsidian); color-scheme: dark; }
* { scrollbar-width: thin; scrollbar-color: #2b3348 transparent; }
::selection { background: rgba(201,162,39,0.34); color: #fff; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }

/* ---- the header ---- */
html.hdr-on #masthead { display: none !important; }
html.hdr-on #bar > .sigil.mini, html.hdr-on #bar-title { display: none; }
#hdr {
  flex: 0 0 auto; height: 44px; display: flex; align-items: stretch; gap: 4px;
  padding: 0 12px 0 14px; position: sticky; top: 0; z-index: 45;
  background: linear-gradient(180deg, #0c0f18, #0a0c12);
  border-bottom: 1px solid var(--line);
  view-transition-name: hdr;
}
#hdr::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--gold-dim) 22%, var(--gold) 50%, var(--gold-dim) 78%, transparent); opacity: 0.45;
}
.hdr-brand { display: flex; align-items: center; gap: 11px; flex: 0 0 auto; text-decoration: none; padding: 0 16px 0 2px; margin-right: 6px; border-right: 1px solid var(--line-faint); }
.hdr-brand b { font-family: var(--engraved); font-weight: 600; font-size: 14px; letter-spacing: 0.26em; color: var(--gold-bright); transition: text-shadow 0.2s; }
.hdr-brand:hover b { text-shadow: 0 0 14px rgba(232,196,85,0.55); }
#hdr #rail { flex: 1 1 auto; min-width: 0; height: auto; padding: 0; background: none; border: 0; gap: 0; z-index: auto; }
#hdr #rail a { border: 0; padding: 0 12px; position: relative; z-index: 1; }
#hdr #rail a:hover { background: none; }
#hdr #rail a.here { background: none; }
#rail-pill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0; opacity: 0; pointer-events: none;
  border-bottom: 2px solid var(--gold);
  background: linear-gradient(180deg, transparent 25%, rgba(201,162,39,0.13));
  transition: transform 0.42s cubic-bezier(0.3, 0.85, 0.3, 1), width 0.42s cubic-bezier(0.3, 0.85, 0.3, 1), opacity 0.2s;
}
#omni-btn {
  flex: 0 0 auto; align-self: center; display: inline-flex; align-items: center; gap: 8px; margin-left: 8px;
  height: 28px; padding: 0 9px 0 10px; cursor: pointer;
  background: var(--obsidian-3); border: 1px solid var(--line); border-radius: 14px;
  color: #8792ad; font: 500 11.5px var(--display); letter-spacing: 0.03em; white-space: nowrap;
  transition: border-color 0.16s, color 0.16s, box-shadow 0.16s;
}
#omni-btn:hover { border-color: var(--gold-dim); color: var(--gold-bright); box-shadow: 0 0 14px rgba(201,162,39,0.14); }
#omni-btn kbd, #omni kbd { font: 9.5px var(--mono); color: #7d87a1; border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; background: rgba(255,255,255,0.03); }
#hdr #rail a { letter-spacing: 0.15em; }
/* all eleven instruments must fit without scrolling, so their places never move from page to page */
#hdr #rail a i { font-style: normal; }
@media (max-width: 1900px) { #omni-btn span { display: none; } }
@media (max-width: 1700px) { #hdr #rail a { padding: 0 9px; letter-spacing: 0.11em; gap: 6px; } .hdr-brand { padding-right: 12px; margin-right: 2px; } #hdr #rail a i { display: none; } }
@media (max-width: 1500px) { #omni-btn kbd { display: none; } #omni-btn { padding: 0 9px; margin-left: 2px; } #hdr #rail a { padding: 0 7px; letter-spacing: 0.08em; gap: 5px; } }
@media (max-width: 1400px) { .hdr-brand b { display: none; } .hdr-brand { padding-right: 9px; } #hdr #rail a { letter-spacing: 0.06em; } }
@media (max-width: 1300px) { #hdr #rail a { padding: 0 6px; letter-spacing: 0.04em; font-size: 10px; } #hdr #rail a svg { display: none; } }
@media (max-width: 1080px) { #hdr #rail a { padding: 0 5px; letter-spacing: 0.02em; font-size: 9.5px; } }
@media (max-width: 840px) { #hdr #rail a { padding: 0 3.5px; letter-spacing: 0; } }   /* room for the colourway switch (v12) */
@media (max-width: 700px) { #hdr { height: 42px; padding: 0 8px 0 10px; } #hdr #rail { height: auto; padding: 0; } }

/* ---- page to page ---- */
/* the opt-in rule itself (@view-transition { navigation: auto }) is added by src/nav.js, and only on http(s):
   on file:// the browser has nothing to transition to and logs an aborted transition on every hop */
::view-transition-old(root) { animation: vt-out 0.15s ease-in both; }
::view-transition-new(root) { animation: vt-in 0.3s ease-out both; }
::view-transition-old(hdr) { display: none; }          /* the header is the same object on both pages: no cross-fade, */
::view-transition-new(hdr) { animation: none; }         /* just the live one, with its marker gliding */
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; } }
@keyframes arrive { from { opacity: 0; } }
html.vtf.arriving body > :not(#hdr):not(script):not(#omni) { animation: arrive 0.32s ease-out backwards; }
html.vtf.leaving body > :not(#hdr):not(#omni) { opacity: 0; transition: opacity 0.12s ease-in; }
@media (prefers-reduced-motion: reduce) { #rail-pill, .tab-pill { transition: none !important; } }

/* ---- gliding markers for tab strips ---- */
.glides { position: relative; }
.glides > button.on, #wr-tabs.glides button.on { border-bottom-color: transparent; }
.tab-pill { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; opacity: 0; background: var(--gold); pointer-events: none; box-shadow: 0 0 10px rgba(232,196,85,0.5);
  transition: transform 0.32s cubic-bezier(0.3, 0.85, 0.3, 1), width 0.32s cubic-bezier(0.3, 0.85, 0.3, 1), opacity 0.2s; }

/* ---- views ease in rather than cut ---- */
@keyframes view-in { from { opacity: 0; transform: translateY(5px); } }
@media (prefers-reduced-motion: no-preference) { .wr-view:not([hidden]) { animation: view-in 0.26s ease-out; } }

/* ---- the first-arrival title card ---- */
#arrive-card {
  position: fixed; left: 0; bottom: 92px; z-index: 44; pointer-events: none; max-width: min(640px, 92vw);
  padding: 14px 70px 15px 22px; border-left: 2px solid var(--gold);
  background: linear-gradient(90deg, rgba(8,10,16,0.94) 55%, rgba(8,10,16,0));
  animation: card-pass 4.5s ease both;
}
#arrive-card b { display: block; font-family: var(--engraved); font-weight: 600; font-size: 21px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold-bright); }
#arrive-card span { display: block; margin-top: 5px; font-family: var(--display); font-size: 13px; letter-spacing: 0.03em; color: var(--paper-dim); }
@keyframes card-pass { 0% { opacity: 0; transform: translateX(-14px); } 9%, 78% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(-8px); } }

/* ---- search everything ---- */
#omni { position: fixed; inset: 0; z-index: 200; display: flex; justify-content: center; align-items: flex-start; padding-top: 11vh; background: rgba(4,5,9,0.62); backdrop-filter: blur(3px); animation: vt-in 0.14s ease-out; }
#omni[hidden] { display: none; }
#omni-box { width: min(680px, 94vw); background: #0e1119; border: 1px solid var(--gold-dim); border-radius: 10px; box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 40px rgba(201,162,39,0.08); overflow: hidden; animation: view-in 0.18s ease-out; }
#omni-top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--gold); }
#omni-top svg { width: 16px; height: 16px; flex: 0 0 auto; }
#omni-q { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--paper); font: 15px var(--sans); }
#omni-q::placeholder { color: #66708c; }
#omni-list { max-height: min(56vh, 520px); overflow-y: auto; padding: 4px 0; }
.om-h { padding: 9px 16px 4px; font: 9px var(--display); letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); }
.om-row { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; color: var(--paper); cursor: pointer; padding: 7px 14px 7px 12px; font: 13.5px var(--sans); }
.om-row.on { background: rgba(201,162,39,0.1); border-left-color: var(--gold); }
.om-row i { flex: 0 0 92px; font: normal 9px var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--k); }
.om-row b { flex: 0 1 auto; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52%; }
.om-row span { flex: 1 1 0; min-width: 0; font-size: 11.5px; color: #8d96af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.om-row em { flex: 0 0 auto; font: normal 10px var(--mono); color: #66708c; }
.om-row.on em { color: var(--gold-bright); }
.om-none { padding: 16px; font-size: 13px; color: #8d96af; }
#omni-foot { display: flex; gap: 16px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); font: 10.5px var(--display); color: #7d87a1; }
#omni-count { margin-left: auto; font-family: var(--mono); font-size: 10px; }
@media (max-width: 700px) { #omni { padding-top: 6vh; } .om-row i { flex-basis: 70px; } .om-row em { display: none; } .om-row span { display: none; } .om-row b { max-width: none; flex: 1; } #arrive-card { bottom: 70px; } #arrive-card b { font-size: 16px; } }

/* ============================================================
   v11 — SEEN AT A GLANCE
   · the Archive: a reading of whatever is in view stays docked
     beside the chart on wide screens (src/core.js, "the standing
     digest"); lane names are legible; the portal fits one screen
   · every instrument: long reading views are cut into sections,
     one screen each, by a pinned row of section chips (src/nav.js)
   ============================================================ */
#dock-btn { display: none; }
@media (min-width: 1180px) {
  #dock-btn { display: inline-flex; }
  body.docked #panel { position: relative; transform: none; transition: none; flex: 0 0 336px; width: 336px; max-width: none; box-shadow: none; padding: 16px 18px 14px; z-index: 5; }
  body.docked #panel #panel-close { top: 10px; right: 10px; }

/* ============================================================
   ARCHIVUS — colourways, by hand. Appended verbatim to the generated src/themes.css
   by tools/build-themes.js. Two kinds of thing live here and nothing else:
     1. the colourway switch itself — its swatches show the three pages as they are,
        so they must NOT pass through the rule;
     2. the few places where the rule needs help, each with its reason.
   ============================================================ */
#tone { flex: 0 0 auto; align-self: center; display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 0 8px; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--obsidian-3); }
#tone button { width: 14px; height: 14px; border-radius: 50%; padding: 0; cursor: pointer; border: 1px solid #868b98; transition: transform .15s; }
#tone button:hover { transform: scale(1.18); }
#tone button[data-tone="blue"] { background: linear-gradient(135deg, #1d2f57 50%, #0a0c12 50%); }
#tone button[data-tone="black"] { background: #000; }
#tone button[data-tone="white"] { background: #fff; }
#tone button.on { box-shadow: 0 0 0 2px var(--obsidian-3), 0 0 0 3.5px var(--gold); }
#tone button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
/* a narrow header shows only the current swatch; pressing it steps to the next colourway */
@media (max-width: 1560px) {
  #tone { gap: 0; padding: 0 7px; margin: 0 8px 0 6px; } #tone button:not(.on) { display: none; }
  /* alone, a black disc on black or a white one on white says nothing: the lone button shows all three, and a gold rim */
  #tone button.on { background: conic-gradient(from -60deg, #1d2f57 0 33.4%, #fff 0 66.7%, #000 0); border-color: var(--gold); box-shadow: none; width: 15px; height: 15px; }
}
@media (max-width: 840px) { #tone { border: 0; background: none; padding: 0 4px; margin: 0 4px 0 0; } }

/* ---------- exceptions: where the general rule is not enough ---------- */
/* on white an accent is already deepened to hold 4.5:1; fading it again would undo that */
html[data-theme="white"] .as-blood text,
html[data-theme="white"] .pn-plate-title { opacity: 1; }

  <script>
/* ============================================================
   ARCHIVUS — the frame (v10; eleven instruments since v11)
   ------------------------------------------------------------
   Eleven pages that should feel like one instrument. This script
   is the first thing in every <body> and gives every page

     · ONE HEADER, identical everywhere: brand, the eleven
       instruments, and a search-everything button. It is in
       place before the page paints, so nothing shifts. The
       per-page mastheads stay in the markup as a no-script
       fallback and are hidden (styles.css, "v10").
     · A GLIDING MARKER under the current instrument: it starts
       where it stood on the page you came from and slides over.
     · SOFT PAGE CHANGES. Browsers with cross-document view
       transitions cross-fade natively (see @view-transition in
       styles.css) and prerender the page you hover; everywhere
       else — including file:// — the stage fades out and in.
     · MEMORY. Each instrument's last deep link is remembered

    st.obs && st.obs.takeRecords();                          /* our own edits are not a re-render */
  }
  function paginate() {
    document.querySelectorAll(".wr-scroll").forEach(sec => {
      if (PG.has(sec)) return;
      const st = { page: pgAll() ? "all" : 0 }; PG.set(sec, st);
      sec.addEventListener("click", e => {
        const b = e.target.closest(".pg-bar [data-pg]"); if (!b) return;
        st.page = b.dataset.pg === "all" ? "all" : +b.dataset.pg;
        try { if (st.page === "all") localStorage.setItem("archivus-pager", "all"); else localStorage.removeItem("archivus-pager"); } catch (_) {}   /* "All" is remembered as a preference */
        pgCut(sec); sec.scrollTop = 0;
      });
      st.obs = new MutationObserver(ms => { if (ms.some(m => m.target === sec || (m.target.classList && m.target.classList.contains("dc-doc") && m.target.parentNode === sec))) pgCut(sec); });
      st.obs.observe(sec, { childList: true, subtree: true });
      pgCut(sec);
    });
    /* a jump to something inside a hidden section opens that section first */
    const siv = Element.prototype.scrollIntoView;
    Element.prototype.scrollIntoView = function () {
      const sec = this.closest && this.closest(".wr-scroll"), st = sec && PG.get(sec);
      if (st) { pgCut(sec); const off = this.closest(".pg-off"); if (off) { st.page = off._pg; pgCut(sec); } }   /* cut first: the view may have just been re-rendered */

    buildHeader();

    const hdr = $("hdr"), bar = $("bar");

    setH(); window.addEventListener("resize", setH);
    if (window.ResizeObserver && bar) new ResizeObserver(setH).observe(bar);
    glide($("wr-tabs"), "button.on");
    paginate();
    speculate();
    if (document.prerendering) document.addEventListener("prerenderingchange", () => { placePill(true); titleCard(); }, { once: true });

  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ready); else ready();

   ARCHIVUS — shared kit for the Realms and the Coups (v11).

    [["STATE-RUN · UNFREE", L + 10, T + qf + 8, "start", "#e5484d"], ["MARKET · UNFREE", L + pw - 10, T + qf + 8, "end", "#c77c3a"], ["STATE-RUN · FREE", L + 10, T + ph - 12, "start", "#5b93b8"], ["MARKET · FREE", L + pw - 10, T + ph - 12, "end", "#49c9b8"]]

      h = '<p class="lead">Serious observers disagree about the direction of the country, and that disagreement is itself the most important fact. Each reading is given with the evidence its holders cite, the evidence against it, and what would tell you it is right. None is the archive\'s own.</p>'
        + '<div class="picks">' + U.theses.map((x, i) => '<button data-ur="' + i + '"' + (i === st.ur ? ' class="on"' : "") + "><b>" + (i + 1) + ". " + esc(x.n) + "</b><small>" + esc(x.who) + "</small>" + esc(x.claim) + "</button>").join("") + "</div>"
        + '<article class="rec"><div class="cols c3"><div class="pro"><div class="mf-k">Evidence cited for</div><ul>' + t.pro.map(x => "<li>" + esc(x) + "</li>").join("") + '</ul></div><div class="con"><div class="mf-k">Evidence cited against</div><ul>' + t.con.map(x => "<li>" + esc(x) + "</li>").join("") + '</ul></div><div><div class="mf-k" style="color:var(--gold)">Watch for</div><ul>' + t.watch.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div></div><footer>" + srcLinks(t.u) + "</footer></article>";
    } else {
      h = '<div class="grid2 even"><div class="col"><h4>What the readings share<small>the nearest thing to settled ground</small></h4><ol class="olist">' + U.shared.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol></div>"
        + '<div class="col"><h4>Signposts<small>dated tests that will favour one reading over another</small></h4><dl class="sp">' + U.signposts.map(x => "<dt>" + esc(x[0]) + "</dt><dd>" + esc(x[1]) + "</dd>").join("") + "</dl></div></div>"
        + '<h4>Sources</h4><p class="srcs">' + Object.keys(U.src).map(k => K.link(U.src[k][1], U.src[k][0])).join("") + '</p><p class="wr-note" style="max-width:none">Events after ' + esc(U.asOf) + " are not included; election figures were still being counted when read.</p>";
    }
    pane.innerHTML = h; pane.scrollTop = 0;
    if (st.us === "now") chartIn("us-chart", usChart); else if (st.us === "time") chartIn("us-strip", usStrip);
  }

  /* ---------------- the side panel ---------------- */
  function spark(c) {
    const W = 330, H = 74, n = c.hl.length, x = i => 2 + i / (n - 1) * (W - 4), y = v => 4 + (1 - v) * 48;
    let segs = [], cur = [];
    c.hl.forEach((v, i) => { if (v < 0) { if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(v / 100)]); }); if (cur.length) segs.push(cur);
    let h = '<line class="ax" x1="2" x2="' + (W - 2) + '" y1="52" y2="52"/>';
    segs.forEach(s => { h += '<path class="ar" d="' + K.path(s) + "L" + s[s.length - 1][0].toFixed(1) + " 52L" + s[0][0].toFixed(1) + ' 52Z"/><path class="ln" d="' + K.path(s) + '"/>'; });
    /* the regime class of each year as a strip under the line */
    const w = (W - 4) / n; for (let i = 0; i < n; i++) if (c.hr[i] !== "-") h += '<rect x="' + (2 + i * w).toFixed(1) + '" y="55" width="' + (w + .4).toFixed(1) + '" height="5" fill="' + ROW[+c.hr[i]][1] + '"/>';
    [1900, 1950, 2000].forEach(yr => { h += '<text x="' + x(yr - Y0) + '" y="71">' + yr + "</text>"; }); h += '<text x="' + (W - 2) + '" y="71" text-anchor="end">' + LAST + "</text>";
    return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="Liberal democracy index since 1900">' + h + "</svg>";
  }
  const meter = (label, v, max, col) => "<span>" + label + '</span><div class="tr"><i style="width:' + (v == null ? 0 : K.clamp(v / max * 100, 0, 100)).toFixed(0) + "%" + (col ? ";background:" + col : "") + '"></i></div><span class="v">' + (v == null ? "—" : K.fmt(v, max > 1 ? 1 : 2)) + "</span>";
  function card(c) {
    const f = NT.forms[formOf(c)], note = NT.note[c.id];
    let h = '<button class="sd-x" title="Close (Esc)" aria-label="Close">×</button><div class="sd-k">' + esc(c.rg || (formOf(c) === "TE" ? "Territory" : "Small state")) + '</div><div class="sd-t">' + esc(c.n) + '</div><div class="sd-d">' + esc(f ? f[0] : "") + (c.pop ? " · " + K.pop(c.pop) + " people" : "") + "</div>";
    h += '<div class="cc-big">' + (c.fh ? '<div><span class="k">Freedom House 2026</span><b>' + c.fh[0] + '<small> /100</small></b><span class="pill ' + c.fh[1] + '">' + FHS[c.fh[1]][0] + "</span><em>Political rights " + c.fh[2] + "/40 · civil liberties " + c.fh[3] + "/60</em></div>" : "")
      + (c.ldi != null ? '<div><span class="k">V-Dem ' + LAST + "</span><b>" + K.fmt(c.ldi) + '</b><span class="pill" style="color:' + ROW[c.row][1] + ";border-color:" + ROW[c.row][1] + '">' + ROW[c.row][0] + "</span><em>Liberal democracy, 0–1 · rank " + (ranked.indexOf(c) + 1) + " of " + ranked.length + "</em></div>" : "") + "</div>";
    if (f) h += '<p class="hint" style="margin-top:6px">' + esc(f[0]) + ": " + esc(f[1].charAt(0).toLowerCase() + f[1].slice(1)) + "</p>";
    if (note) h += '<div class="sd-k">In brief</div><p class="sd-p">' + esc(note.t) + "</p>" + (note.d ? '<div class="sd-links"><a href="doctrines.html#v=compass&i=' + note.d + '">The doctrine, in the Doctrines ⟶</a></div>' : "") + (c.id === "USA" ? '<div class="sd-links"><a href="#v=usa" data-go="usa">The United States in detail ⟶</a></div>' : "");
    if (c.fhOnly) return h + '<p class="hint">V-Dem does not cover this state, so only the Freedom House score is shown.</p>';
    h += '<div class="sd-k">Liberal democracy since 1900</div>' + spark(c) + '<dl class="kv" style="margin-top:6px"><dt>1 year</dt><dd class="mono ' + (c.d1 < -0.02 ? "dn" : c.d1 > 0.02 ? "up" : "") + '">' + K.signed(c.d1) + '</dd><dt>5 years</dt><dd class="mono ' + (c.d5 < -0.02 ? "dn" : c.d5 > 0.02 ? "up" : "") + '">' + K.signed(c.d5) + '</dd><dt>10 years</dt><dd class="mono ' + (c.d10 < -0.02 ? "dn" : c.d10 > 0.02 ? "up" : "") + '">' + K.signed(c.d10) + "</dd></dl>";
    h += '<div class="sd-k">What the score is made of</div><div class="meter">' + meter("Clean elections", c.edi, 1) + meter("Civil liberties", c.civ, 1) + meter("Free expression", c.fx, 1) + meter("Rule of law", c.rule, 1) + meter("Courts constrain the executive", c.jud, 1) + meter("Legislature constrains it", c.leg, 1) + meter("Civil society", c.cs, 1) + meter("Corruption", c.corr, 1, "#ff7a66") + "</div>";
    if (c.ideo) {
      h += '<div class="sd-k">In whose name it rules</div><p class="sd-p" style="font-size:12.5px">' + (c.ideo[0] < 2 ? "The government makes no strong ideological claim" : "The government promotes an ideology that experts class as <b style=\"color:var(--paper)\">" + esc(c.ideo[1].split("").map(k => IDEO[k][0].toLowerCase()).join(", ") || "of no listed type") + "</b>") + ".</p>"
        + '<div class="meter" style="margin-top:6px">' + meter("An ideology", c.ideo[0], 4) + meter("The leader's person", c.lead, 4) + meter("Performance: growth, order", c.perf, 4) + meter("Law and procedure", c.law, 4) + '</div><p class="hint">V-Dem expert scores, 0–4, for how far each claim is used to justify rule (' + c.ideoY + ").</p>";
    }
    h += '<div class="sd-k">The economy</div><div class="meter">' + meter("Private ownership of capital", c.own, 4) + meter("Property rights", c.prop, 1) + "</div>";
    h += '<div class="sd-k">Pressure signals · ' + c.sig.length + " of 6</div>" + SIGK.map(s => '<div class="sg-row' + (c.sig.indexOf(s) >= 0 ? " on" : "") + '"><i></i>' + SIG[s] + "</div>").join("") + '<p class="hint">Observed conditions, not a forecast. Polarisation ' + K.fmt(c.pol, 1) + " and political violence " + K.fmt(c.viol, 1) + " on 0–4 scales.</p>";
    h += '<div class="sd-k">Coups and overthrows</div><p class="sd-p" style="font-size:12.5px">' + (c.pt[0] ? c.pt[0] + " coup attempt" + (c.pt[0] > 1 ? "s" : "") + " since 1950, " + c.pt[1] + " successful" + (c.pt[2] ? " — the last in " + c.pt[2] : "") + "." : "No coup attempt recorded since 1950.") + (c.lf ? " The last government to end by force: " + esc(c.lf[2]) + ", " + c.lf[0] + " (" + ENDT[c.lf[1]].toLowerCase() + ")." : "") + "</p>";
    h += '<div class="sd-links"><a href="coups.html#v=record&c=' + c.id + '">Its record in the Coups ⟶</a>' + K.link("https://freedomhouse.org/country/scores", "Freedom House") + K.link("https://www.v-dem.net/", "V-Dem") + "</div>";
    return h;
  }
  const INTRO = {
    map: ["THE MAP", "Every country coloured by one measure at a time. Start with the Freedom House score; switch to regime type or liberal democracy and drag the year back to watch the century. Click a country to open it."],
    compass: ["THE COMPASS OF NATIONS", "The Doctrines chart places ideas; this one places states. Across: who owns the economy and how safe property is. Down: how free politics are. Most of the world sits on a diagonal — but not all of it: note the market economies near the top."],
    ledger: ["THE LEDGER", "All " + C.length + " countries and territories in one table. Sort by any column; filter by region or status."],
    drift: ["THE DRIFT", "Direction rather than position: who has moved, where strain is showing, and where governments have fallen by force. Four sections, one screen each — step with ← →."]
  };
  function renderSide() {
    const side = $("dc-side"), c = st.c && BY[st.c];
    if (st.v === "usa" || (!c && innerWidth <= 860)) { side.hidden = true; return; }
    side.hidden = false;
    if (c) { side.innerHTML = '<div class="dc-card">' + card(c) + "</div>"; side.scrollTop = 0; return; }
    const t = INTRO[st.v];
    side.innerHTML = '<div class="dc-card intro"><div class="sd-k">' + t[0] + '</div><p>' + t[1] + "</p>"
      + '<div class="q" style="border-color:#49c9b8"><b style="color:#49c9b8">Freedom House</b><span>Scores political rights (0–40) and civil liberties (0–60) for ' + C.filter(x => x.fh).length + " countries and territories. This is the 2026 edition, describing 2025.</span></div>"
      + '<div class="q" style="border-color:#e8c455"><b style="color:#e8c455">V-Dem</b><span>Several thousand country experts code hundreds of indicators back to 1789; ' + C.filter(x => x.ldi != null).length + " countries are covered. Regime type, the components, ideology and drift all come from it.</span></div>"
      + '<div class="q" style="border-color:#9a7fd1"><b style="color:#9a7fd1">The archive\'s notes</b><span>Form of government and the short briefs are hand-written; they are marked as such.</span></div>'
      + '<p style="margin-top:12px">These are measurements made by people, and people argue with them. Where two independent scorers agree, the picture is probably sound; where a score surprises you, open the country and look at what it is made of.</p>'
      + '<div class="sd-k">Start with</div>' + ["USA", "CHN", "IND", "RUS", "IRN", "HUN", "BFA", "SYR"].map(i => '<button class="nchip" data-iso="' + i + '">' + esc(BY[i].n) + "</button>").join("") + "</div>";
  }

  /* ---------------- boot ---------------- */
  function applyHash() {
    if (location.hash === K.hash.self && built.boot) return;
    const q = K.hash.read();
    if (q.v && tabs.ids.indexOf(q.v) >= 0) st.v = q.v;
    if (q.s && st.v === "usa" && USS.some(x => x[0] === q.s)) st.us = q.s;
    if (q.s && st.v === "drift" && DRS.some(x => x[0] === q.s)) st.ds = q.s;
    if (q.m && MODES[q.m]) st.m = q.m;
    if (q.y && +q.y >= Y0 && +q.y <= LAST) st.y = +q.y;
    st.c = q.c && BY[q.c] ? q.c : null;
    built.boot = 1; sync(true);
    if (st.c && st.v === "map") setTimeout(() => map.focus(st.c), 60);
  }
  function boot() {
    tabs = K.tabs(() => st.v, go);
    $("dc-side").addEventListener("click", e => {
      if (e.target.closest(".sd-x")) return pick(null);
      const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); st.c = null; return go(g.dataset.go); }
      const b = e.target.closest("[data-iso]"); if (b) pick(b.dataset.iso);
    });
    document.addEventListener("keydown", e => {
      if (e.target.closest("input, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "Escape" && st.c) return pick(null);
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0; if (!d) return;
      if (st.v === "usa" && st.us === "time") return usStep(d);           /* ← → walk the timeline … */
      const secs = st.v === "usa" ? USS : st.v === "drift" ? DRS : null;  /* … or step between sections */
      if (secs) { const k = st.v === "usa" ? "us" : "ds", i = secs.findIndex(x => x[0] === st[k]) + d; if (secs[i]) { st[k] = secs[i][0]; sync(); } }
    });
    let rt = 0; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (st.v === "usa" || st.v === "drift") render(st.v); renderSide(); }, 140); });
    K.finder($("dc-q"), q => C.filter(c => c.n.toLowerCase().indexOf(q) >= 0 || c.id.toLowerCase() === q).sort((a, b) => (a.n.toLowerCase().indexOf(q) - b.n.toLowerCase().indexOf(q)) || (b.pop || 0) - (a.pop || 0))
      .map(c => ({ label: c.n, sub: c.fh ? "FH " + c.fh[0] + " · " + FHS[c.fh[1]][0] : "", id: c.id })), h => pick(h.id));
    window.addEventListener("hashchange", applyHash);
    applyHash();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
</html>
