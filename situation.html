/* ---------- THE SITUATION (v18). Page shell, tabs, map, side panel and chips come from the shared sheets. ---------- */

.sit .rl-leg svg { width: 14px; height: 14px; display: inline-block; vertical-align: -3px; margin-right: 5px; } .sit .rl-leg .lg-h { display: block; font: 9.5px var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 6px 0 0; } .sit .rl-leg small a { color: var(--gold); text-decoration: none; border-bottom: 1px dotted var(--gold-dim); }

.st-pin.sel .o { fill-opacity: .4; stroke-width: 2.4; } .st-pin.dim, .st-sx.dim, .st-wd.dim { opacity: .28; }
.st-pin text, .st-sx text, .st-wd text, .st-nk text { font: 600 10.5px var(--display); fill: #f1ecdc; paint-order: stroke; stroke: #0a0c12; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; letter-spacing: .02em; }
.st-sx path { fill: #0a0c12; stroke-width: 1.8; vector-effect: non-scaling-stroke; } .st-sx.sel path { stroke-width: 3; }
.st-wd { opacity: var(--o, 1); } .st-wd .wc { stroke: #0a0c12; stroke-width: 1.2; vector-effect: non-scaling-stroke; } .st-wd .wh { fill: none; stroke-width: 1.3; vector-effect: non-scaling-stroke; opacity: .7; }
.st-wd.sel { opacity: 1; } .st-wd.sel .wh { stroke-width: 2.4; opacity: 1; }
@media (prefers-reduced-motion: no-preference) { .st-wd.new:not(.sel) .wh { animation: st-pulse 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; } }

.st-nk .o { fill: rgba(232,196,85,.1); stroke: #e8c455; stroke-width: 1.4; vector-effect: non-scaling-stroke; } .st-nk .i { fill: #e8c455; fill-opacity: .8; } .st-nk text { fill: #e8c455; font: 600 10.5px var(--mono); letter-spacing: 0; }

.ws-lab button { flex: 1; min-height: 0; display: flex; align-items: center; gap: 7px; background: none; border: 0; color: var(--paper-dim); cursor: pointer; padding: 0 10px; font: 10px var(--display); letter-spacing: .14em; text-transform: uppercase; text-align: left; }
.ws-lab button:hover, .ws-lab button.on { color: var(--gold-bright); } .ws-lab button.off { opacity: .4; } .ws-lab i { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; } .ws-lab small { margin-left: auto; font: 10px var(--mono); letter-spacing: 0; color: #8d96af; }
.ws-plot { flex: 1; min-width: 0; position: relative; margin: 6px 26px 20px 14px; }
.ws-rows { position: absolute; inset: 0; display: flex; flex-direction: column; } .ws-rows i { flex: 1; border-bottom: 1px solid var(--line-faint); } .ws-rows i:last-child { border-bottom-color: var(--line); }

.bl-card:hover { border-color: var(--gold-dim); border-top-color: var(--c); } .bl-card.sel { border-color: var(--gold); border-top-color: var(--c); background: rgba(201,162,39,.1); }
.bl-card b { font: 700 17px var(--engraved); letter-spacing: .08em; color: var(--c); } .bl-card i { font: normal 12px var(--mono); color: var(--paper); align-self: center; } .bl-card span { grid-column: 1 / -1; font: 12px var(--display); color: var(--paper); } .bl-card small { grid-column: 1 / -1; font: 10px var(--mono); color: #8d96af; }

<body class="wr dc rl sit">
  <!-- the frame: one header on every page, in place before first paint (see src/nav.js) -->
  <script src="src/nav.js"></script>
  <header id="masthead">
    <div class="sigil" aria-hidden="true"></div>
    <div class="masthead-text">
      <h1>ARCHIVUS · THE SITUATION</h1>
      <p class="tagline">the world as it stands — wars, blocs, sanctions, ballots, arsenals and straits on one map, with ninety days of dated events under it</p>
    </div>
    <a id="tx-link" href="index.html">⟵ The Archive</a>
  </header>
  <nav id="wr-bar" aria-label="Views">
    <div id="wr-tabs" role="tablist">
      <button role="tab" data-v="board" title="The present on one map, read through five lenses">The Board</button>
      <button role="tab" data-v="wire" data-kin="board" title="Every dated event of the last ninety days, each with its source">The Wire</button>
      <button role="tab" data-v="blocs" title="Who sits in which alliance, who is under sanctions, who holds the bomb: one ledger">The Blocs</button>
      <button role="tab" data-v="ballots" title="The elections of 2026 and what they decided">The Ballots</button>
      <button role="tab" class="minor" data-v="method" title="What each layer rests on, and every source">Method &amp; sources</button>
    </div>
    <div id="dc-find"><input id="dc-q" type="search" placeholder="Find a country, an event, a bloc or a strait…  ( / )" autocomplete="off" aria-label="Find a country, an event, a bloc or a strait"></div>
  </nav>
  <main id="dc-main">
    <div id="dc-stage">
      <!-- THE BOARD -->
      <section id="v-board" class="wr-view dc-view">
        <div class="dc-bar">
          <div class="chips" id="sb-lens" role="group" aria-label="Lens"></div>
          <div class="chips" id="sb-sub" role="group" aria-label="Bloc" hidden></div>
          <div class="chips" id="sb-lay" role="group" aria-label="Marks"></div>
          <span class="wr-note" id="sb-n"></span>
        </div>
        <div class="rl-map" id="sb-wrap">
          <svg id="sb" role="img" aria-label="World map of the present: wars, blocs, sanctions, ballots, arsenals, straits and dated events"></svg>
          <div class="rl-zoom"><button class="chipbtn" id="sb-zi" title="Zoom in">+</button><button class="chipbtn" id="sb-zo" title="Zoom out">−</button><button class="chipbtn" id="sb-zr" title="Reset the view">⟲</button></div>
          <div id="sb-leg" class="plate rl-leg"></div>
          <div id="sb-tip" class="plate rl-tip" hidden></div>
        </div>
        <div id="sb-leg2" class="plate rl-leg"></div><!-- the legend again, below the map on a phone -->
        <div id="sb-wire" aria-label="The wire: ninety days of dated events, by kind"></div>
      </section>
      <!-- THE WIRE -->
      <section id="v-wire" class="wr-view dc-view" hidden>
        <div class="dc-bar"><div class="chips" id="wi-k" role="group" aria-label="Kind of event"></div><span class="wr-note" id="wi-n"></span></div>
        <div class="pane"><div id="wi-list" class="wl"></div></div>
      </section>
      <!-- THE BLOCS -->
      <section id="v-blocs" class="wr-view dc-view" hidden>
        <div class="dc-bar"><span class="wr-note" id="bl-n"></span></div>
        <div class="pane"><div class="bl-cards" id="bl-cards"></div><div class="st-tbl-wrap" id="bl-wrap"></div></div>
      </section>
      <!-- THE BALLOTS -->
      <section id="v-ballots" class="wr-view dc-view" hidden>
        <div class="dc-bar"><span class="wr-note" id="ba-n"></span></div>
        <div class="pane"><div class="ba-grid"><div class="st-tbl-wrap" id="ba-wrap"></div><aside id="ba-side"></aside></div></div>
      </section>
      <!-- METHOD -->
      <section id="v-method" class="wr-view dc-view" hidden><div class="pane mth" id="mt-pane"></div></section>
    </div>
    <aside id="dc-side" aria-live="polite"></aside>
  </main>
  <noscript><p style="padding:24px">The Situation needs JavaScript. The data is readable in <code>src/data/situation.js</code>.</p></noscript>
  <script src="assets/world2.js"></script>
  <script src="src/data/conflicts.js"></script>
  <script src="src/data/situation.js"></script>
  <script src="src/realms-kit.js"></script>
  <script src="src/situation-app.js"></script>
</body>
