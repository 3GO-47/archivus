<style>

<body class="wr dc rl tw">
  <!-- the frame: one header on every page, in place before first paint (see src/nav.js) -->
  <script src="src/nav.js"></script>
  <header id="masthead">
    <div class="sigil" aria-hidden="true"></div>
    <div class="masthead-text">
      <h1>ARCHIVUS · TOTAL WAR</h1>
      <p class="tagline">every war on one string — thirty-three centuries, from Kadesh to the wars being fought today</p>
    </div>
    <a id="tx-link" href="index.html">⟵ The Archive</a>
  </header>
  <nav id="wr-bar" aria-label="Views">
    <div id="wr-tabs" role="tablist">
      <button role="tab" data-v="map" title="Every war where it was fought, in the years it was fought: press Play">The Map</button>
      <button role="tab" data-v="string" data-kin="map" title="Every war on one line of time, by the part of the world it was fought in">The String</button>
      <button role="tab" data-v="toll" title="The wars ranked by their dead, with the range the estimates span">The Toll</button>
      <button role="tab" data-v="centuries" data-kin="toll" title="The same dead, century by century">The Centuries</button>
      <button role="tab" class="minor" data-v="method" title="Where the rows come from, and how far to trust a death toll">Method &amp; sources</button>
    </div>
    <div id="dc-find"><input id="dc-q" type="search" placeholder="Find a war…  ( / )" autocomplete="off" aria-label="Find a war"></div>
  </nav>
  <main id="dc-main">
    <div id="dc-stage">
      <section id="v-map" class="wr-view dc-view">
        <div class="dc-bar"><div class="chips" id="tm-ctl" role="group" aria-label="Playback"></div><span class="wr-note" id="tm-n"></span></div>
        <div class="rl-map" id="tm-wrap">
          <svg id="tm" role="img" aria-label="World map of every war in the record, placed where it was fought"></svg>
          <div id="tm-now"></div>
          <div class="rl-zoom"><button class="chipbtn" id="tm-zi" title="Zoom in">+</button><button class="chipbtn" id="tm-zo" title="Zoom out">−</button><button class="chipbtn" id="tm-zr" title="Reset the view">⟲</button></div>
          <div id="tm-leg" class="plate rl-leg strip" tabindex="0" aria-label="Legend; focus it for its notes and sources"></div>
          <div id="tm-tip" class="plate rl-tip" hidden></div>
        </div>
        <div id="tm-scrub" role="slider" tabindex="0" aria-label="The year the map shows" aria-valuemin="-1300" aria-valuemax="2026"><i id="tm-done"></i><svg id="tm-dens" viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true"></svg><div id="tm-ticks"></div><i id="tm-h"></i></div>
        <div id="tm-leg2" class="plate rl-leg"></div>
      </section>
      <section id="v-string" class="wr-view dc-view" hidden>
        <div class="dc-bar"><div class="chips" id="ts-zoom" role="group" aria-label="Stretch time"></div><span class="wr-note" id="ts-n"></span></div>
        <div id="ts-box" data-stage><div id="ts-wrap" aria-label="The string of wars"></div><div id="ts-labs" class="ts-labs"></div></div>
      </section>
      <section id="v-toll" class="wr-view dc-view" hidden>
        <div class="dc-bar"><div class="chips" id="tt-f" role="group" aria-label="Which wars"></div><span class="wr-note" id="tt-n"></span></div>
        <div class="pane"><div id="tt-list"></div></div>
      </section>
      <section id="v-centuries" class="wr-view dc-view" hidden>
        <div class="dc-bar"><span class="wr-note" id="tc-n"></span></div>
        <div class="pane"><div id="tc-chart"></div><div class="tw-tblw" id="tc-table"></div></div>
      </section>
      <section id="v-method" class="wr-view dc-view" hidden><div class="pane mth" id="tm-pane"></div></section>
    </div>
    <aside id="dc-side" aria-live="polite"></aside>
  </main>
  <noscript><p style="padding:24px">Total War needs JavaScript. The data is readable in <code>src/data/totalwar.js</code>.</p></noscript>
  <script src="assets/world2.js"></script>
  <script src="src/data/events.js"></script><script src="src/data/events2.js"></script><script src="src/data/geo.js"></script><script src="src/data/uncertainty.js"></script><script src="src/data/events3.js"></script><script src="src/data/events4.js"></script>
  <script src="src/data/events5.js"></script><script src="src/data/events6.js"></script>
  <script src="src/data/conflicts.js"></script>
  <script src="src/data/totalwar.js"></script>
  <script src="src/realms-kit.js"></script>
  <script src="src/totalwar-app.js"></script>
